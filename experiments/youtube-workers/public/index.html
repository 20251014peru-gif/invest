<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자막으로 요약</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><header><p class="eyebrow">유튜브 요약</p><h1>자막으로 요약</h1><p>자막을 붙여넣고 접수하면, 창을 닫아도 작업과 결과가 보관됩니다.</p></header>
<section><label>내 접근 코드<input id="token" type="password" autocomplete="off"></label><button id="connect">작업 불러오기</button><p id="budget">접근 코드를 입력하면 비용과 작업을 확인합니다.</p></section>
<section><h2>새 요약</h2><div class="grid"><label>영상 제목<input id="title" maxlength="300"></label><label>채널<input id="channel" maxlength="300"></label><label>영상 주소 · 선택<input id="url" type="url"></label><label>게시일 · 선택<input id="publishDate" type="date"></label></div><label>자막 · 300~80,000자<textarea id="transcript" rows="8" maxlength="80000"></textarea></label><label>타임라인 · 선택<textarea id="timeline" rows="3" maxlength="20000" placeholder="00:00 시작&#10;03:20 다음 주제"></textarea></label>
<label class="choice"><input id="economy" type="checkbox">구간 정리에 저렴한 모델 사용 <small>최종 요약은 기존 모델 유지 · 품질 비교 전에는 선택하지 않아도 됩니다.</small></label>
<label class="choice"><input id="updateNote" type="checkbox">이번에 판단노트도 갱신 <small>추가 AI 비용 발생 · 기본은 요약만</small></label>
<button id="submit">요약 접수</button><p id="status" role="status"></p></section>
<section><h2>내 작업</h2><p>같은 입력과 같은 옵션은 기존 작업을 열어 추가 호출을 막습니다.</p><ul id="jobs"></ul></section>
<section id="output" hidden><h2 id="resultTitle"></h2><p id="costs"></p><p>전체 내용 완전성은 미검증입니다.</p><button id="export">결과 내려받기</button><iframe id="result" sandbox="" title="요약 결과"></iframe><h3>책갈피</h3><ul id="marks"></ul><details id="noteWrap" hidden><summary>판단노트</summary><iframe id="note" sandbox="" title="판단노트"></iframe></details></section>
<footer>개인용 요약 화면 · 기존 자료함·기록보관실과 별도 보관 · 접근 코드는 이 기기에 저장하지 않습니다.</footer></main></body></html>
