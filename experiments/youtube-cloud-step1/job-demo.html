<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>유튜브 작업 보관 시험</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#faf8f1;color:#283c32;max-width:900px;margin:40px auto;padding:20px}section{background:white;padding:24px;margin:20px 0;border:1px solid #e3dfd1;border-radius:14px}input,textarea,button{box-sizing:border-box;font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px}input,textarea{display:block;width:100%;margin:6px 0 16px}button{background:#2d6a4f;color:white;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word}li{padding:15px 0;border-bottom:1px solid #eee}.note{color:#756241}#status{min-height:26px}</style>
<h1>유튜브 작업 보관 시험</h1>
<p class="note">실제 AI를 호출하지 않는 복사본 시험입니다. 접수 후 창을 닫아도 서버가 처리하고 결과를 보관합니다.</p>
<section><label>시험용 접근 코드<input id="token" type="password" autocomplete="off"></label><button id="connect">작업 불러오기</button></section>
<section><label>영상 제목<input id="title" maxlength="300"></label><label>자막<textarea id="transcript" rows="6" maxlength="80000"></textarea></label><button id="submit">시험 작업 접수</button><p id="status" role="status"></p></section>
<section><h2>내 작업</h2><p>같은 접근 코드로 다시 열면 서버에 보관된 작업이 표시됩니다.</p><ul id="jobs"></ul></section>
<script>
const el=id=>document.getElementById(id);
let pending=null, busy=false;
const labels={queued:'접수 완료',running:'처리 중',succeeded:'완료',failed:'실패',uncertain:'중단 · 확인 필요'};
async function api(path,options={}){
  const r=await fetch(path,{...options,headers:{'Authorization':'Bearer '+el('token').value,'Content-Type':'application/json'}});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'연결 실패');return d;
}
async function refresh(){
  if(!el('token').value)return;
  try{
    const data=await api('/api/jobs');el('jobs').replaceChildren();
    for(const job of data.jobs){
      const li=document.createElement('li'),head=document.createElement('strong'),body=document.createElement('pre');
      head.textContent=job.title+' — '+labels[job.status];li.dataset.id=job.id;li.dataset.status=job.status;
      body.textContent=job.result?job.result.text+(job.result.input_chars?'\n받은 자막 '+job.result.input_chars+'자':''):(job.error||'');
      li.append(head,body);el('jobs').append(li);
    }
  }catch(e){el('status').textContent=e.message;}
}
el('connect').onclick=refresh;
el('submit').onclick=async()=>{
  if(busy)return;
  const payload={title:el('title').value.trim(),transcript:el('transcript').value.trim()};
  if(!el('token').value||!payload.title||payload.transcript.length<100){el('status').textContent='접근 코드·제목·100자 이상의 자막을 입력하세요.';return;}
  // Keep the request key until an acknowledgement is received. A lost response may
  // be retried without creating another job. Never auto-submit on reload.
  if(pending&&JSON.stringify(pending.payload)!==JSON.stringify(payload)){
    el('status').textContent='이전 접수 여부가 불명확합니다. 작업 목록에서 먼저 확인하세요.';return;
  }
  pending=pending||{request_key:crypto.randomUUID(),payload};busy=true;el('submit').disabled=true;
  try{const job=await api('/api/jobs',{method:'POST',body:JSON.stringify(pending)});pending=null;el('status').textContent='접수됐습니다. 이제 창을 닫아도 됩니다. 작업 '+job.id;await refresh();}
  catch(e){el('status').textContent=e.message+' 같은 내용으로 다시 누르면 중복 접수를 확인합니다.';}
  finally{busy=false;el('submit').disabled=false;}
};
setInterval(refresh,700);
</script></html>
