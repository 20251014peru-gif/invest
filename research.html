<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투자 통합 분석실</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#223e32;font:16px/1.5 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:10px 18px;background:#fff;border-bottom:1px solid #ceded3}h1{font-size:20px;margin:0}.top,nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top{justify-content:space-between}nav{margin-top:8px}nav a,.direct,summary{padding:7px 10px;border:1px solid #ceded3;border-radius:8px;color:#276749;text-decoration:none;cursor:pointer}nav a[aria-current=page]{background:#e3efe7;font-weight:700}details{position:relative}details .menu{position:absolute;top:100%;left:0;z-index:20;background:white;min-width:250px;padding:12px;border:1px solid #ceded3;border-radius:8px}details a{display:block;margin:6px 0}small{font-size:16px}.help{color:#53695c;margin:8px 0 0}#panels{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:white}iframe[hidden]{display:none}@media(max-width:600px){header{padding:8px}.help{display:none}.direct{padding:5px 8px}h1{font-size:19px}nav a,summary{padding:6px 8px}details .menu{left:auto;right:0}}
</style></head><body><header><div class="top"><h1>투자 통합분석실</h1><a class="direct" id="direct" target="_blank" rel="noopener" href="research-dashboard.html">따로 열기 ↗</a></div><nav aria-label="통합 메뉴"><a href="#dashboard" data-panel="dashboard">전체 대시보드</a><a href="#cpi" data-panel="cpi">CPI 집중 보기</a><a href="#records" data-panel="records">기록보관실</a><details><summary>기존 도구·버전</summary><div class="menu"><small>v019-20260914-050618-KST</small><a href="#macro" data-panel="macro">매크로 지표</a><a href="#analysis" data-panel="analysis">분석·뉴스·메모</a></div></details></nav><p class="help" id="help">핵심 정리 ← 변화와 비교 ← 세부 근거</p></header><main id="panels"></main>
<script>
const entries={dashboard:['research-dashboard.html','전체 대시보드 · 공통 3페이지 보기'],cpi:['research-cpi.html','CPI 3페이지 기본 보기'],macro:['macro.html','매크로 감각실'],analysis:['chatgpt/','분석 지표 대시보드'],records:['records.html','투자 기록보관실']};
const frames=new Map();
function render(){const [raw,id]=location.hash.slice(1).split('/');const key=Object.hasOwn(entries,raw)?raw:'dashboard';const [path,title]=entries[key];let frame=frames.get(key);if(!frame){frame=document.createElement('iframe');frame.title=title;frame.src=path;frame.dataset.panel=key;document.getElementById('panels').append(frame);frames.set(key,frame);}
if(key==='analysis'&&id&&/^[a-z0-9_]+$/.test(id)){const target='#/indicators/'+id;frame.addEventListener('load',()=>{frame.contentWindow.location.hash=target},{once:true});try{if(frame.contentWindow.location.pathname.endsWith('/chatgpt/'))frame.contentWindow.location.hash=target;}catch{}}
for(const [k,f]of frames)f.hidden=k!==key;document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.panel===key?'page':'false'));document.getElementById('direct').href=path+(key==='analysis'&&id&&/^[a-z0-9_]+$/.test(id)?'#/indicators/'+id:'');document.getElementById('help').textContent=key==='dashboard'?'카드·표·주제별 보기에서 선택 → 상세 → 출처·연결 자료. 원본은 기록보관실에 보관합니다.':key==='cpi'?'핵심 정리 ← 변화와 비교 ← 세부 근거 · 전체 페이지로 확대하고 이전 배치로 돌아올 수 있습니다.':key==='analysis'?'기존 분석 지표 대시보드 · 상세 분석, 뉴스, 내 메모를 이어서 사용합니다.':key==='records'?'기존 투자 기록보관실 · 기록과 로그인은 기존 저장소를 사용합니다.':'원자료 기준기간과 공식 발표일을 구분합니다. 카드를 누르면 기간별 값이 열립니다.';}
window.addEventListener('hashchange',render);render();
</script></body></html>
