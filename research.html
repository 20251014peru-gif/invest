<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투자 통합 분석실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182238;font:16px/1.5 system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header{padding:12px 20px;background:#fff;border-bottom:1px solid #dce2ef}h1{font-size:21px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}nav a,.direct{padding:9px 14px;border:1px solid #dce2ef;border-radius:10px;color:#334155;text-decoration:none}nav a[aria-current=page]{background:#e0e7ff;border-color:#818cf8;color:#312e81;font-weight:700}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.help{font-size:16px;color:#475569;margin:8px 0 0}#panels{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:white}iframe[hidden]{display:none}small{font-size:16px}@media(max-width:600px){header{padding:10px}.top{align-items:flex-start}nav a{flex:1;text-align:center;padding:8px}.direct{padding:6px}h1{font-size:19px}}</style></head>
<body><header><div class="top"><h1>투자 통합 분석실</h1><small style="color:#64748b">v016-20260913-214952-KST</small><a class="direct" id="direct" target="_blank" rel="noopener" href="macro.html">현재 화면 따로 열기 ↗</a></div><nav aria-label="통합 메뉴"><a href="#macro" data-panel="macro">매크로 지표</a><a href="#analysis" data-panel="analysis">분석·뉴스·메모</a><a href="#records" data-panel="records">투자 기록보관실</a></nav><p class="help" id="help">확인된 값과 발표일 → 지표 분석과 뉴스 → 나의 기록</p></header><main id="panels"></main>
<script>
const entries={macro:['macro.html','매크로 감각실'],analysis:['chatgpt/','분석 지표 대시보드'],records:['records.html','투자 기록보관실']};
const frames=new Map();
function render(){const [raw,id]=location.hash.slice(1).split('/');const key=Object.hasOwn(entries,raw)?raw:'macro';const [path,title]=entries[key];let frame=frames.get(key);if(!frame){frame=document.createElement('iframe');frame.title=title;frame.src=path;frame.dataset.panel=key;document.getElementById('panels').append(frame);frames.set(key,frame);}
if(key==='analysis'&&id&&/^[a-z0-9_]+$/.test(id)){const target='#/indicators/'+id;frame.addEventListener('load',()=>{frame.contentWindow.location.hash=target},{once:true});try{if(frame.contentWindow.location.pathname.endsWith('/chatgpt/'))frame.contentWindow.location.hash=target;}catch{}}
for(const [k,f]of frames)f.hidden=k!==key;document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.panel===key?'page':'false'));document.getElementById('direct').href=path+(key==='analysis'&&id&&/^[a-z0-9_]+$/.test(id)?'#/indicators/'+id:'');document.getElementById('help').textContent=key==='analysis'?'기존 분석 지표 대시보드 · 상세 분석, 뉴스, 내 메모를 이어서 사용합니다.':key==='records'?'기존 투자 기록보관실 · 기록과 로그인은 기존 저장소를 사용합니다.':'원자료 기준기간과 공식 발표일을 구분합니다. 카드를 누르면 기간별 값이 열립니다.';}
window.addEventListener('hashchange',render);render();
</script></body></html>
