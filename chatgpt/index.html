<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f4fa"><title>매크로 관측실 · ChatGPT</title><link rel="stylesheet" href="assets/289bd172ea80/styles.css"><link rel="icon" href="icon.svg" type="image/svg+xml"></head>
<body>
<a class="skip" href="#workspace">본문으로</a>
<header class="app-header"><a class="brand" href="#"><span class="brand-mark">◒</span><span>매크로 관측실<small>ChatGPT · 지표 보기</small></span></a><div class="header-right"><span id="clock"></span><button id="font-size" title="글자 크기 조절">가＋</button><button data-ask="">AI 질문</button><button id="settings-button">설정·버전</button></div></header>
<main id="workspace">
<section class="overview"><div><p class="eyebrow">오늘의 관측</p><h1>숫자의 변화에서<br class="mobile-only"> 경제의 흐름을 읽습니다.</h1><p id="data-status" class="subtle" role="status">지표를 불러오는 중입니다.</p></div><button id="refresh">↻ 새로 읽기</button></section>
<div id="health" role="status"></div><div id="summary" class="summary"></div>
<section id="macro-reading" class="macro-reading panel"></section><nav class="view-tabs" aria-label="보기"><button data-view="indicators" aria-pressed="true">지표 보기</button><button data-view="news" aria-pressed="false">뉴스 모아보기</button><button data-view="records" aria-pressed="false">내 메모·자료</button></nav>
<div class="search-row"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="전체 검색 · 지표, 뉴스, 자료, 내 메모" autocomplete="off" aria-label="전체 검색"><kbd>/</kbd></label><select id="sort" aria-label="정렬"><option value="default">중요도 우선</option><option value="change">변화율 큰 순</option><option value="date">기준일 최근 순</option></select></div>
<div id="priority-controls" class="priority-controls"><span>확인 순서</span><button data-tier="all" aria-pressed="true">전체 35개</button><button data-tier="1">핵심</button><button data-tier="2">보조</button><button data-tier="3">상황별</button><span class="muted">한국·미국 투자와 순환 이해 기준</span></div><div id="filters" class="filters" aria-label="지표 분류"></div><div id="results" aria-live="polite"></div>
<footer><span id="release-label">버전 확인 중</span><span>값은 기존 수집 자료 · 해석과 출처를 함께 확인하세요.</span></footer>
</main>
<dialog id="detail" class="page-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<dialog id="settings" aria-labelledby="settings-title"><div class="dialog-top"><h2 id="settings-title">연결과 버전</h2><button data-close="settings" aria-label="설정 닫기">✕</button></div><div id="settings-content"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="assets/289bd172ea80/app.js"></script>
</body></html>
