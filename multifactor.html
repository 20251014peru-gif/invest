<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내 멀티팩터 종합점수</title>
<!-- v 20261019-2 · 결과는 비공개: 본인 Google 로그인 후 mfLatest 함수(functions-mf/)로만 받는다. 계산은 scripts/multifactor_kr.py(주 1회), 게시는 scripts/mf_publish.py · 계산 모듈: js/multifactor-core.mjs -->
<style>
  :root{
    --bg:#FBF7F1; --card:#FFFFFF; --card-border:#F0E4D8; --text:#3D3630; --quiet:#8C8078; --faint:#A79B8E;
    --accent:#3B6EA5; --accent-soft:#E6EEF7; --warn-bg:#FBEEDA; --warn-tx:#8A5A26; --warn-border:#F0DCB8;
    --line:#EADFD3; --heat:59,110,165;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.01em}
  h2{margin:0 0 8px;font-size:15px;font-weight:700}
  .meta{font-size:12px;color:var(--quiet)}
  .notice{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-tx);border-radius:12px;padding:10px 14px;font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 16px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg label{cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}
  .seg input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .desc{margin:8px 0 0;font-size:12.5px;color:var(--quiet)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .tabs button{border:0;background:none;padding:9px 14px;font-size:14px;color:var(--quiet);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
  button.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text)}
  button.btn:hover{background:var(--accent-soft)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#2f5a8a}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  input[type=search],input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;min-width:200px;background:#fff;color:var(--text)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:700px;font-size:12.5px}
  th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}
  th{font-weight:500;color:var(--quiet);white-space:nowrap}
  th.grp{border-bottom:1px solid var(--faint);padding:2px 0}
  th button{all:unset;cursor:pointer;padding:2px 4px;border-radius:4px}
  th button:hover{background:var(--accent-soft)}
  th button:focus-visible{outline:2px solid var(--accent)}
  td.l,th.l{text-align:left}
  tr.row{cursor:pointer}
  tr.row:hover td.l{background:var(--accent-soft)}
  td.name{white-space:nowrap}
  td.name small{color:var(--faint);margin-left:4px}
  td.sc{font-weight:700}
  td.heat{min-width:46px}
  .off{opacity:.35}
  .mark{color:var(--warn-tx);font-weight:700;cursor:help}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .group h3{margin:0 0 6px;font-size:13.5px}
  .group h3 small{font-weight:400;color:var(--quiet);margin-left:6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px;font-size:12.5px;cursor:pointer;color:var(--text)}
  .chip:hover{background:var(--accent-soft)}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;background:rgb(var(--heat))}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0 12px}
  .kv div{background:#FFFDF9;border:1px solid var(--card-border);border-radius:10px;padding:8px 10px}
  .kv b{display:block;font-size:16px}
  .kv span{font-size:11.5px;color:var(--quiet)}
  .flags{margin:8px 0 0;padding-left:18px;color:var(--warn-tx);font-size:12.5px}
  .q{border-top:1px solid var(--line);padding:10px 0}
  .q:first-of-type{border-top:0}
  .q p{margin:0 0 6px;font-weight:600}
  .q label{display:block;padding:3px 0;cursor:pointer}
  .err{color:#A33;font-size:13px;margin:8px 0 0}
  .result{background:var(--accent-soft);border:1px solid #C9D9EC;border-radius:12px;padding:12px 14px;margin-top:12px}
  .state{padding:28px;text-align:center;color:var(--quiet)}
  .gate{text-align:center;padding:24px 16px}
  .gate p{margin:0 0 12px}
  .gate .toolbar{justify-content:center}
  .who{display:flex;gap:8px;align-items:center}
  details.fold{background:var(--card);border:1px solid var(--card-border);border-radius:14px}
  details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600}
  details.fold .body{padding:0 16px 14px;color:var(--quiet);font-size:12.5px}
  details.fold .body li{margin:3px 0}
  @media(max-width:600px){.wrap{padding:18px 10px 48px}.tabs button{padding:8px 9px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>국내 멀티팩터 종합점수</h1><div class="meta" id="meta"></div>
    <div class="meta who" id="who" hidden><span id="whoMail"></span> <button class="btn" id="btnWhoOut" type="button">로그아웃</button></div></header>
  <div class="notice" id="notice">학습·점검용 지표이며 매수·매도 권유가 아닙니다.</div>
  <div class="state" id="state">불러오는 중…</div>
  <div class="card gate" id="gate" hidden role="status">
    <p id="gateMsg"></p>
    <div class="toolbar">
      <button class="btn primary" id="btnLogin" type="button" hidden>🔐 본인 Google 로그인</button>
      <button class="btn primary" id="btnSwitch" type="button" hidden>다른 Google 계정으로 로그인</button>
      <button class="btn" id="btnRetry" type="button" hidden>다시 시도</button>
      <button class="btn" id="btnLogout" type="button" hidden>로그아웃</button>
    </div>
    <p class="desc">결과는 저장소나 공개 주소에 올라 있지 않고, 본인 인증을 서버가 확인한 뒤에만 전달됩니다.</p>
  </div>
  <div id="app" hidden>
    <div class="card">
      <h2>보는 기준(스타일)</h2>
      <div class="seg" id="styleSeg" role="radiogroup" aria-label="스타일 선택"></div>
      <p class="desc" id="styleDesc"></p>
    </div>
    <div class="tabs" role="tablist" id="tabs" style="margin-top:14px">
      <button role="tab" data-tab="rank" aria-selected="true">순위표</button>
      <button role="tab" data-tab="group" aria-selected="false">점수 그룹</button>
      <button role="tab" data-tab="stock" aria-selected="false">종목 조회</button>
      <button role="tab" data-tab="survey" aria-selected="false">성향 설문</button>
    </div>
    <section class="card" id="p-rank"></section>
    <section class="card" id="p-group" hidden></section>
    <section class="card" id="p-stock" hidden></section>
    <section class="card" id="p-survey" hidden></section>
  </div>
  <details class="fold" id="how">
    <summary>계산 방식과 한계</summary>
    <div class="body" id="howBody"></div>
  </details>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function () {
  var st = document.getElementById("state");
  if (location.protocol === "file:") {
    st.innerHTML = "이 페이지를 파일로 직접 열어서 데이터를 읽지 못하고 있습니다. 브라우저 보안 규칙 때문에 파일로 열면 동작하지 않습니다.<br>" +
      "배포된 주소(https://…)로 열거나, 이 폴더에서 <code>python -m http.server 8931</code> 을 실행한 뒤 <code>http://127.0.0.1:8931/multifactor.html</code> 로 여세요.";
    return;
  }
  setTimeout(function () {
    if (!st.hidden && st.textContent.indexOf("불러오는 중") === 0)
      st.textContent = "8초가 지나도 시작하지 못했습니다. 새로고침해도 같다면 스크립트 파일(js/multifactor-core.mjs)이나 로그인 도구(Firebase)를 읽지 못한 것일 수 있습니다(광고 차단·네트워크 확인).";
  }, 8000);
})();
</script>
<script type="module">
import {
  STYLE_KEYS, FACTOR_KEYS, STYLE_TEXT, SURVEY, groupItems, surveyResult, fmtFactor, fmtNum, fmtMarcap,
  heatAlpha, searchItems, sortItems, flagText,
} from "./js/multifactor-core.mjs";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = "mf_kr_survey_v1";
const S = { data: null, style: "base", tab: "rank", view: "rank", sort: { key: "rank", dir: 1 }, filter: "", showAll: false, ngroup: 10, code: null, q: "", answers: {}, result: null, err: "" };

function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
function lsSet(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경에서도 동작 */ } }

// ---------------- 본인 인증 + 비공개 결과 읽기
// 결과는 저장소·Pages 에 없다. 본인 Google 로그인 후 ID 토큰으로 mfLatest 함수를 호출해야만 받는다(서버가 토큰·본인 UID 를 확인한다).
// 화면 버튼 숨김이나 CORS 는 보호 수단이 아니다 — 보호는 서버 검사(functions-mf/handler.js)와 Firestore 규칙이 한다.
const MF_URL = "https://asia-northeast3-my-system-25497.cloudfunctions.net/mfLatest";
const FIREBASE_CONFIG = { apiKey: "AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY", authDomain: "my-system-25497.firebaseapp.com", projectId: "my-system-25497" };   // 웹 공개 설정(records.html 과 같음)
// 시험용 어댑터는 로컬 서버/시험 하네스(about:srcdoc)에서만 받아들인다. 배포 주소에서는 무시한다.
const TEST_ENV = location.href.indexOf("about:srcdoc") === 0 || ["localhost", "127.0.0.1"].indexOf(location.hostname) >= 0;

function firebaseAdapter() {
  let auth = null;
  const isGoogle = (u) => !!(u && (u.providerData || []).some((p) => p && p.providerId === "google.com"));
  return {
    init(onUser) {
      if (typeof firebase === "undefined") throw new Error("sdk");
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      auth.onAuthStateChanged((u) => {
        if (u && !isGoogle(u)) { auth.signOut().catch(() => {}); return; }      // 익명 등 다른 세션은 정리(기록보관실과 같은 방식)
        onUser(u ? { email: u.email || "" } : null);
      });
    },
    signIn() { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" }); return auth.signInWithPopup(p); },
    signOut() { return auth.signOut(); },
    async getToken() { const u = auth && auth.currentUser; if (!u) throw new Error("no user"); return u.getIdToken(); },
    async fetchLatest(token) {
      const r = await fetch(MF_URL, { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: "{}", cache: "no-store" });
      let body = null; try { body = await r.json(); } catch (e) { /* 본문 없음 */ }
      return { status: r.status, body };
    },
  };
}

let AD = null, BUSY = false;

function showState(text) { $("state").hidden = false; $("state").textContent = text; $("gate").hidden = true; $("app").hidden = true; }
function showGate(msg, btns) {
  $("state").hidden = true; $("app").hidden = true; $("gate").hidden = false;
  $("gateMsg").textContent = msg;
  const b = btns || {};
  $("btnLogin").hidden = !b.login; $("btnSwitch").hidden = !b.switchAcct; $("btnRetry").hidden = !b.retry; $("btnLogout").hidden = !b.logout;
}
function clearData() {
  S.data = null; S.code = null; S.q = ""; S.filter = ""; S.result = null;
  ["p-rank", "p-group", "p-stock", "p-survey", "howBody"].forEach((id) => { $(id).innerHTML = ""; });
  $("meta").textContent = ""; $("notice").textContent = "학습·점검용 지표이며 매수·매도 권유가 아닙니다.";
}
function renderWho(u) {
  const w = $("who");
  w.hidden = !u;
  $("whoMail").textContent = u ? (u.email || "Google 계정") : "";
}
function authErrorText(e) {
  const c = (e && e.code) || "";
  if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "로그인 창이 닫혔습니다. 다시 로그인해 주세요.";
  if (c === "auth/popup-blocked") return "브라우저가 로그인 창을 막았습니다. 팝업을 허용한 뒤 다시 시도하세요.";
  if (c === "auth/network-request-failed") return "네트워크 오류로 로그인하지 못했습니다. 연결을 확인하세요.";
  return "로그인하지 못했습니다. 잠시 뒤 다시 시도하세요.";
}

function renderData() {
  S.answers = lsGet().answers || {};
  $("state").hidden = true; $("gate").hidden = true; $("app").hidden = false;
  const d = S.data;
  $("notice").textContent = d.disclaimer;
  $("meta").textContent = "주가 " + d.price_date + " · 재무 " + (d.quarter_date || "—") + " 분기 · " + d.n + "종목(시총 상위 " + d.n_target + " 요청) · 계산 " + d.generated_at.slice(0, 16).replace("T", " ");
  renderStyleSeg(); renderHow(); renderAll();
}

async function loadData() {
  if (BUSY) return;
  BUSY = true;
  try {
    showState("결과를 불러오는 중…");
    let token;
    try { token = await AD.getToken(); } catch (e) { showGate("로그인 정보를 확인하지 못했습니다. 다시 로그인해 주세요.", { login: true }); return; }
    let res;
    try { res = await AD.fetchLatest(token); } catch (e) { showGate("서버에 연결하지 못했습니다. 네트워크를 확인한 뒤 다시 시도하세요.", { retry: true, logout: true }); return; }
    if (res.status === 401) { showGate("이 계정은 본인 계정으로 확인되지 않았습니다. 본인 Google 계정으로 로그인해 주세요.", { switchAcct: true, logout: true }); return; }
    if (res.status === 404) { showGate("아직 계산 결과가 없습니다. 주 1회 자동 계산이 한 번 끝나면 표시됩니다.", { retry: true, logout: true }); return; }
    const d = res.body;
    if (res.status !== 200 || !d) { showGate("결과를 읽지 못했습니다(HTTP " + res.status + "). 잠시 뒤 다시 시도하세요.", { retry: true, logout: true }); return; }
    if (d.schema !== "multifactor_kr/1" || !Array.isArray(d.items) || !d.items.length) { showGate("결과 형식이 맞지 않습니다. 잠시 뒤 다시 시도하세요.", { retry: true, logout: true }); return; }
    S.data = d;
    renderData();
  } finally { BUSY = false; }
}

function onUser(u) {
  renderWho(u);
  if (!u) { clearData(); showGate("이 화면의 결과는 비공개입니다. 본인 Google 계정으로 로그인하면 불러옵니다.", { login: true }); return; }
  loadData();
}

function doSignIn(btn) {
  btn.disabled = true;
  return AD.signIn().then(() => { if (!S.data) loadData(); }).catch((e) => { showGate(authErrorText(e), { login: true }); }).finally(() => { btn.disabled = false; });
}

function boot() {
  try { AD = (TEST_ENV && window.__MF_ADAPTER__) ? window.__MF_ADAPTER__ : firebaseAdapter(); }
  catch (e) { showState("로그인 도구를 만들지 못했습니다. 새로고침해 주세요."); return; }
  $("btnLogin").onclick = () => doSignIn($("btnLogin"));
  $("btnSwitch").onclick = () => doSignIn($("btnSwitch"));
  $("btnRetry").onclick = () => loadData();
  const out = () => { clearData(); return AD.signOut(); };
  $("btnLogout").onclick = out; $("btnWhoOut").onclick = out;
  try { AD.init(onUser); }
  catch (e) { showState("로그인 도구(Firebase)를 불러오지 못했습니다. 광고 차단·네트워크를 확인하고 새로고침해 주세요."); }
}

function factorsOf(style) { return new Set(S.data.styles[style].factors); }

function renderStyleSeg() {
  $("styleSeg").innerHTML = STYLE_KEYS.map((k) =>
    '<label><input type="radio" name="style" value="' + k + '"' + (S.style === k ? " checked" : "") + '><span>' + esc(STYLE_TEXT[k].name) + '</span></label>').join("");
  $("styleSeg").onchange = (e) => { S.style = e.target.value; renderStyleDesc(); renderAll(); };
  renderStyleDesc();
}
function renderStyleDesc() {
  const t = STYLE_TEXT[S.style], names = S.data.styles[S.style].factors.map((f) => S.data.factors[f]).join(", ");
  $("styleDesc").innerHTML = "<b>" + esc(t.short) + "</b> — " + esc(t.fits) + ". 점수에 쓰는 지표: " + esc(names) + ".<br>" + esc(t.caution);
}

function renderAll() { renderRank(); renderGroup(); renderStock(); renderSurvey(); }

// ---------------- 순위표
const GROUPS = [["모멘텀", ["mom_price", "mom_vol"]], ["밸류", ["per", "pbr"]], ["퀄리티", ["rev", "op", "ni", "roe"]]];
const SHORT = { mom_price: "주가", mom_vol: "거래량", per: "PER", pbr: "PBR", rev: "매출", op: "영업익", ni: "순익", roe: "ROE" };

function renderRank() {
  const el = $("p-rank"), inc = factorsOf(S.style);
  let items = sortItems(S.data.items, S.style, S.sort.key, S.sort.dir);
  if (S.filter) items = items.filter((it) => searchItems([it], S.filter).length);
  const total = items.length, shown = S.showAll ? items : items.slice(0, 100);
  const th = (key, label) => '<th><button data-sort="' + key + '" title="이 열로 정렬(좋은 순위가 위)">' + label + (S.sort.key === key ? (S.sort.dir === 1 ? " ▲" : " ▼") : "") + "</button></th>";
  let h = '<div class="toolbar"><input type="search" id="flt" placeholder="종목명 또는 코드 검색" value="' + esc(S.filter) + '" aria-label="종목 검색">' +
    '<span class="seg" id="viewSeg"><label><input type="radio" name="view" value="rank"' + (S.view === "rank" ? " checked" : "") + '><span>순위(%)</span></label>' +
    '<label><input type="radio" name="view" value="raw"' + (S.view === "raw" ? " checked" : "") + '><span>원본 값</span></label></span>' +
    '<span class="meta">진할수록 상위(유리) · 점수가 낮을수록 상위 · 행을 누르면 종목 조회</span></div>';
  h += '<div class="scroll"><table><thead><tr><th></th><th></th><th></th>' +
    GROUPS.map((g) => '<th class="grp" colspan="' + g[1].length + '">' + g[0] + "</th>").join("") + "</tr><tr>" +
    th("rank", "순위") + th("name", "종목").replace("<th>", '<th class="l">') + "<th>점수</th>" +
    FACTOR_KEYS.map((k) => th(k, SHORT[k])).join("") + "</tr></thead><tbody>";
  for (const it of shown) {
    const sc = it.scores[S.style];
    h += '<tr class="row" data-code="' + it.code + '"><td>' + sc.rank + '</td><td class="l name">' + esc(it.name) + "<small>" + it.code + "</small>" +
      (it.flags.length ? ' <span class="mark" title="' + esc(it.flags.map(flagText).join(" / ")) + '">!</span>' : "") + '</td><td class="sc">' + fmtNum(sc.score, 1) + "</td>";
    for (const k of FACTOR_KEYS) {
      const rk = it.ranks[k], on = inc.has(k);
      const txt = S.view === "rank" ? fmtNum(rk, 1) : fmtFactor(k, it.raw[k]);
      h += '<td class="heat' + (on ? "" : " off") + '" style="background:rgba(var(--heat),' + heatAlpha(rk) + ')"' + (on ? "" : ' title="이 스타일에서는 점수에 쓰지 않는 지표"') + ">" + txt + "</td>";
    }
    h += "</tr>";
  }
  h += "</tbody></table></div>";
  if (!shown.length) h += '<p class="desc">검색 결과가 없습니다.</p>';
  if (!S.showAll && total > 100) h += '<p class="desc">상위 100개를 표시 중(전체 ' + total + '개) <button class="btn" id="more">전체 보기</button></p>';
  el.innerHTML = h;
  const f = $("flt");
  f.oninput = () => { S.filter = f.value; const pos = f.selectionStart; renderRank(); const n = $("flt"); n.focus(); n.setSelectionRange(pos, pos); };
  $("viewSeg").onchange = (e) => { S.view = e.target.value; renderRank(); };
  el.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => {
    const key = b.dataset.sort; S.sort = S.sort.key === key ? { key, dir: -S.sort.dir } : { key, dir: 1 }; renderRank();
  });
  el.querySelectorAll("tr.row").forEach((r) => r.onclick = () => openStock(r.dataset.code));
  if ($("more")) $("more").onclick = () => { S.showAll = true; renderRank(); };
}

// ---------------- 점수 그룹
function renderGroup() {
  const gs = groupItems(S.data.items, S.style, S.ngroup);
  let h = '<h2>점수 그룹</h2><p class="desc" style="margin:0 0 10px">선택한 스타일의 점수순으로 대상 종목을 같은 크기의 그룹으로 나눕니다. 1그룹이 가장 상위입니다.</p><div class="toolbar"><span class="seg" id="ngSeg">' +
    [3, 5, 10].map((n) => '<label><input type="radio" name="ng" value="' + n + '"' + (S.ngroup === n ? " checked" : "") + '><span>' + n + "개 그룹</span></label>").join("") + "</span></div><div class=\"groups\">";
  for (const g of gs) {
    h += '<div class="card group"><h3>' + g.group + "그룹<small>" + g.items.length + "종목 · 평균 점수 " + fmtNum(g.avgScore, 1) + '</small></h3><div class="chips">' +
      g.items.map((it) => '<button class="chip" data-code="' + it.code + '">' + esc(it.name) + "</button>").join("") + "</div></div>";
  }
  $("p-group").innerHTML = h + "</div>";
  $("ngSeg").onchange = (e) => { S.ngroup = Number(e.target.value); renderGroup(); };
  $("p-group").querySelectorAll(".chip").forEach((b) => b.onclick = () => openStock(b.dataset.code));
}

// ---------------- 종목 조회
function openStock(code) { S.code = code; setTab("stock"); }

function renderStock() {
  const el = $("p-stock"), d = S.data, matches = searchItems(d.items, S.q).slice(0, 8);
  let h = '<h2>종목 조회</h2><div class="toolbar"><input type="search" id="sq" placeholder="종목명 또는 코드" value="' + esc(S.q) + '" aria-label="종목 조회"></div>';
  if (S.q && matches.length) h += '<div class="chips" style="margin-bottom:10px">' + matches.map((it) => '<button class="chip" data-code="' + it.code + '">' + esc(it.name) + "</button>").join("") + "</div>";
  else if (S.q) h += '<p class="desc">일치하는 종목이 없습니다(대상은 시가총액 상위 ' + d.n + "종목).</p>";
  const it = d.items.find((x) => x.code === S.code);
  if (it) {
    h += "<h2 style=\"margin-top:6px\">" + esc(it.name) + ' <small style="font-weight:400;color:var(--quiet)">' + it.code + " · " + esc(it.market) + "</small></h2>" +
      '<div class="kv"><div><b>' + fmtMarcap(it.marcap) + "</b><span>시가총액</span></div><div><b>" + fmtNum(it.close, 0) + "원</b><span>종가(" + it.price_date + ")</span></div><div><b>" + (it.quarter_date || "—") + "</b><span>최근 확정 분기</span></div></div>" +
      '<div class="scroll"><table style="min-width:360px"><thead><tr><th class="l">스타일</th><th>점수</th><th>순위</th><th>상위</th></tr></thead><tbody>' +
      STYLE_KEYS.map((k) => { const s = it.scores[k]; return '<tr><td class="l">' + esc(STYLE_TEXT[k].name) + " <small style=\"color:var(--faint)\">" + esc(STYLE_TEXT[k].short) + "</small></td><td>" + fmtNum(s.score, 1) + "</td><td>" + s.rank + " / " + d.n + "</td><td>" + fmtNum(s.pct, 1) + "%</td></tr>"; }).join("") +
      '</tbody></table></div><div class="scroll" style="margin-top:12px"><table style="min-width:460px"><thead><tr><th class="l">지표</th><th>원본 값</th><th>순위(%)</th><th style="width:34%"></th><th>점수 반영</th></tr></thead><tbody>' +
      FACTOR_KEYS.map((k) => { const on = factorsOf(S.style).has(k), rk = it.ranks[k];
        return '<tr class="' + (on ? "" : "off") + '"><td class="l">' + esc(d.factors[k]) + "</td><td>" + fmtFactor(k, it.raw[k]) + "</td><td>" + fmtNum(rk, 1) + '</td><td><div class="bar"><i style="width:' + (100 - rk) + '%"></i></div></td><td>' + (on ? "O" : "—") + "</td></tr>"; }).join("") +
      "</tbody></table></div>";
    if (it.flags.length) h += '<ul class="flags">' + it.flags.map((f) => "<li>" + esc(flagText(f)) + "</li>").join("") + "</ul>";
    h += '<p class="desc">막대가 길수록 대상 종목 안에서 유리한 순위입니다. "점수 반영"은 위에서 고른 스타일 기준입니다.</p>';
  } else if (!S.q) h += '<p class="desc">종목명이나 코드를 입력하거나, 순위표·그룹에서 종목을 눌러 보세요.</p>';
  el.innerHTML = h;
  const sq = $("sq");
  sq.oninput = () => { S.q = sq.value; const pos = sq.selectionStart; renderStock(); const n = $("sq"); n.focus(); n.setSelectionRange(pos, pos); };
  el.querySelectorAll(".chip").forEach((b) => b.onclick = () => { S.code = b.dataset.code; renderStock(); });
}

// ---------------- 성향 설문
function renderSurvey() {
  const el = $("p-survey"), r = S.result;
  let h = "<h2>투자 성향 설문(10문항)</h2><p class=\"desc\" style=\"margin:0 0 8px\">가장 가까운 답을 고르면 어느 스타일로 보면 좋을지 알려줍니다. 참고용 자기 점검이며 투자 자문이 아닙니다. 답은 이 기기의 브라우저에만 저장되고 서버로 보내지 않습니다.</p><form id=\"sv\">";
  SURVEY.forEach((q, i) => {
    h += '<div class="q"><p>' + (i + 1) + ". " + esc(q.q) + "</p>" +
      ["A", "B", "C"].map((o) => '<label><input type="radio" name="q' + i + '" value="' + o + '"' + (S.answers[i] === o ? " checked" : "") + "> " + esc(q.o[o]) + "</label>").join("") + "</div>";
  });
  h += '</form><div class="toolbar" style="margin-top:10px"><button class="btn primary" id="svGo">결과 보기</button><button class="btn" id="svReset">다시 하기</button></div>';
  if (S.err) h += '<p class="err" role="alert">' + esc(S.err) + "</p>";
  if (r && r.complete) {
    const names = r.styles.map((s) => STYLE_TEXT[s].name).join(" 또는 ");
    h += '<div class="result"><b>' + (r.tie ? "동률입니다: " : "추천 스타일: ") + esc(names) + "</b><p class=\"desc\" style=\"color:var(--text)\">A " + r.counts.A + " · B " + r.counts.B + " · C " + r.counts.C +
      (r.tie ? " — 답이 같은 수로 갈렸습니다. 두 스타일을 모두 살펴보세요." : "") + "</p>" +
      r.styles.map((s) => '<p style="margin:6px 0">' + esc(STYLE_TEXT[s].name) + ": " + esc(STYLE_TEXT[s].fits) + ". " + esc(STYLE_TEXT[s].caution) + ' <button class="btn" data-use="' + s + '">이 스타일로 순위표 보기</button></p>').join("") + "</div>";
  }
  el.innerHTML = h;
  el.querySelectorAll("input[type=radio]").forEach((inp) => inp.onchange = () => {
    S.answers[Number(inp.name.slice(1))] = inp.value; S.err = ""; lsSet({ answers: S.answers });
    const e = el.querySelector(".err"); if (e) e.remove();       // 답을 고치면 이전 오류 문구를 바로 지운다
  });
  $("svGo").onclick = () => {
    const res = surveyResult(S.answers);
    if (!res.complete) { S.err = "아직 " + res.missing + "문항에 답하지 않았습니다. 모두 답한 뒤 결과를 볼 수 있습니다."; S.result = null; }
    else { S.err = ""; S.result = res; }
    renderSurvey();
  };
  $("svReset").onclick = () => { S.answers = {}; S.result = null; S.err = ""; lsSet({ answers: {} }); renderSurvey(); };
  el.querySelectorAll("[data-use]").forEach((b) => b.onclick = () => {
    S.style = b.dataset.use; S.sort = { key: "rank", dir: 1 }; renderStyleSeg(); renderAll(); setTab("rank");
  });
}

// ---------------- 탭 · 설명
function setTab(t) {
  S.tab = t;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  for (const k of ["rank", "group", "stock", "survey"]) $("p-" + k).hidden = k !== t;
  if (t === "stock") renderStock();
}
$("tabs").onclick = (e) => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); };

function renderHow() {
  const u = S.data.universe, ex = (o) => Object.entries(o).map(([k, v]) => esc(k) + " " + v).join(", ") || "없음";
  const M = S.data.method || null;
  const periods = M ? M.momentum.periods.map((p) => p.name.replace("1d", "전일").replace("1w", "주간").replace("1m", "월간").replace("3m", "3개월").replace("1y", "연간")).join("·") : "전일·주간·월간·연간";
  $("howBody").innerHTML = "<ul>" +
    "<li><b>기준</b>: " + (M ? esc(M.reference) : "책 2장 방식") + ".</li>" +
    "<li><b>지표 8개</b>: 모멘텀(주가 등락률 " + esc(periods) + " 평균, 거래량 5일/20일 변화) · 밸류(PER, PBR) · 퀄리티(전분기 대비 매출·영업이익·순이익 증가율, ROE).</li>" +
    "<li><b>순위(%)</b>: 대상 종목 안에서의 순위 ÷ 종목 수 × 100. 모멘텀·퀄리티는 클수록, PER·PBR은 작을수록 상위. 동점은 평균 순위(공동 2위면 2.5). 값이 없으면 그 지표의 중앙값으로 채웁니다. <b>점수</b>는 쓰는 지표 순위의 평균이며 낮을수록 상위입니다.</li>" +
    "<li><b>스타일</b>: 같은 8개 순위 중 일부만 평균합니다(가치 성장=밸류+퀄리티, 추세 성장=모멘텀+퀄리티, 역발상=밸류+모멘텀).</li>" +
    (M && M.deviations.length ? "<li><b>책 패키지와 의도적으로 다른 점</b>: " + M.deviations.map(esc).join(" · ") + ".</li>" : "") +
    (M ? "<li><b>책 본문과 패키지가 다른 점</b>: " + esc(M.momentum.note) + ".</li>" : "") +
    "<li><b>이번 계산의 대상</b>: 전체 " + u.listing_total + "종목 중 사전 제외(" + ex(u.pre_excluded) + ") 후 시가총액 상위 " + u.requested + "종목을 받았고, 사후 제외(" + ex(u.post_excluded) + "), 수신 실패 " + u.failed.length + "건. 정상 " + S.data.n + "종목.</li>" +
    "<li><b>출처와 한계</b>: " + esc(S.data.source.note) + " 라이브러리 " + esc(S.data.source.library) + " " + esc(S.data.source.library_version) + ". 수치의 정확성은 공식 자료와 대조하지 않았고, 비공식 경로라 예고 없이 막히거나 바뀔 수 있습니다. 이용 약관 해석은 확인하지 않았습니다.</li>" +
    "<li>순위는 대상 종목 안의 상대 위치일 뿐이며, 이익이 작은 기업의 극단적 증가율이나 일회성 이익도 그대로 반영됩니다. 매수·매도 전에는 뉴스·공시로 악재와 일회성 요인을 따로 확인해야 합니다.</li></ul>";
}

boot();
</script>
</body>
</html>
