<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 기기 등록</title><style>body{font-family:Pretendard,'Malgun Gothic',sans-serif;background:#fbfaf5;color:#302f2b;margin:0}.box{max-width:520px;margin:50px auto;background:#fff;border:1px solid #e8e1d1;border-radius:16px;padding:22px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #d9cfb6}input{flex:1;min-width:180px}button{background:#d5ad32;font-weight:700;cursor:pointer}.muted{color:#7b7568;font-size:12px;line-height:1.6}.uid{font-family:monospace;font-size:11px;word-break:break-all;background:#f8f5ec;padding:8px;border-radius:8px}.ok{color:#267057}.err{color:#a43a3a}a{color:#665a38}</style></head><body><div class="box"><h2>🤖 AI 분석 기기 등록</h2><p class="muted">집·회사·휴대폰마다 Firebase 익명 UID가 다를 수 있어 처음 한 번만 등록합니다. Anthropic API 키는 이 화면에 들어오지 않습니다.</p><p>현재 UID</p><div id="uid" class="uid">로그인 중…</div><p class="muted">개인 AI Access Code를 입력하면 이 UID만 서버 허용목록에 등록됩니다. 짧은 숫자 PIN은 사용하지 않습니다. Access Code는 16자 이상으로 만들고 외부에 공유하지 마세요. 실패 시 UID와 IP 기준으로 일일 제한이 적용됩니다.</p><div class="row"><input id="code" type="password" autocomplete="off" minlength="16" placeholder="AI Access Code (16자 이상)"><button id="go">이 기기 등록</button></div><p id="msg"></p><p><a href="events.html">← 공시 Event 검토실</a></p></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script><script>const cfg={apiKey:"AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY",authDomain:"my-system-25497.firebaseapp.com",projectId:"my-system-25497"};firebase.initializeApp(cfg);const fn=firebase.app().functions('asia-northeast3');let uid=null;firebase.auth().signInAnonymously().catch(e=>msg(e.message,false));firebase.auth().onAuthStateChanged(u=>{uid=u&&u.uid||null;document.getElementById('uid').textContent=uid||'로그인 실패'});function msg(t,ok){const e=document.getElementById('msg');e.textContent=t;e.className=ok?'ok':'err'}document.getElementById('go').onclick=async()=>{if(!uid)return msg('Firebase 로그인 대기 중입니다.',false);const code=document.getElementById('code').value.trim();if(code.length<16)return msg('Access Code는 16자 이상이어야 합니다.',false);document.getElementById('go').disabled=true;try{const call=fn.httpsCallable('registerAiDevice');const r=await call({code});msg('등록 완료. 이제 이 기기에서 AI 분석을 사용할 수 있습니다.',!!r.data?.ok)}catch(e){msg('등록 실패: '+(e.message||e),false)}finally{document.getElementById('go').disabled=false;document.getElementById('code').value=''}};</script></body></html>
