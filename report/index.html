<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>톱니바퀴 일일 보고서</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#667085;--card:#fff;--line:#d9dee7;--acc:#1e3a5f}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--fg:#e6e9ef;--mut:#98a2b3;--card:#171c26;--line:#2a3140;--acc:#8fb4e8}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Noto Sans KR",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:6px 0 2px;color:var(--acc)} .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
input{width:9em;letter-spacing:.3em;text-align:center}button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}
.row{display:block;width:100%;box-sizing:border-box;text-align:left;margin:8px 0;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:12px 14px}
.row b{display:block}.row span{color:var(--mut);font-size:12px}.first{border:2px solid var(--acc)}
#msg{color:var(--mut);font-size:13px;margin-top:8px}.warn{font-size:12px;color:var(--mut);margin-top:16px}
</style></head><body><main>
<h1>톱니바퀴 일일 보고서</h1>
<div class="sub">원인 → 방향 → 결과 · 판단·예측·매수매도 없음 · Claude 작성(달님 원본 아님)</div>
<form id="f"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="000000" aria-label="코드 6자리"> <button>열기</button></form>
<div id="msg"></div><div id="list"></div>
<div class="warn">코드를 넣으면 이 기기에서 보고서 파일이 풀립니다(파일 자체가 암호화되어 있음). 6자리 코드는 강한 보안이 아니라 지나가다 못 보게 하는 수준입니다.</div>
<script>
const $=id=>document.getElementById(id);let PIN='';
async function key(pin,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(pin,buf){const u=new Uint8Array(buf);const k=await key(pin,u.slice(0,16));
 return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},k,u.slice(28));}
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.arrayBuffer();}
$('f').addEventListener('submit',async e=>{e.preventDefault();PIN=$('pin').value.trim();$('msg').textContent='확인 중…';$('list').textContent='';
 try{const d=JSON.parse(new TextDecoder().decode(await dec(PIN,await get('index.enc'))));$('msg').textContent='';
  (d.items||[]).forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='row'+(i?'':' first');
   const t=document.createElement('b');t.textContent=x.date+' '+x.title;const s=document.createElement('span');s.textContent=x.note||'';b.append(t,s);
   b.onclick=async()=>{$('msg').textContent='여는 중…';try{const pdf=await dec(PIN,await get(x.file));
     const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));$('msg').textContent='';location.href=url;}catch(_){$('msg').textContent='파일을 열지 못했습니다.';}};
   $('list').append(b);});
  if(!(d.items||[]).length)$('msg').textContent='아직 보고서가 없습니다.';
 }catch(_){$('msg').textContent='코드가 맞지 않거나 목록을 불러오지 못했습니다.';}});
</script></main></body></html>
