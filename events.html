<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공시 Event 검토실</title>
<style>
:root{--bg:#fbfaf5;--card:#fff;--line:#e8e1d1;--txt:#302f2b;--sub:#797367;--gold:#d5ad32;--soft:#fff8e6;--red:#a83838;--green:#28745a;--blue:#315f86}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--txt)}button,select,input{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fffaf0;border-bottom:1px solid #e4d7b4;padding:11px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top b{font-size:18px}.top a{text-decoration:none;color:#5f5745;border:1px solid #ddd0ad;border-radius:9px;padding:6px 10px;background:#fff}.sp{flex:1}.wrap{max-width:1500px;margin:auto;padding:14px}.sum{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px;margin-bottom:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.kpi span{display:block;color:var(--sub);font-size:11px}.kpi b{font-size:18px}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer}.chip.on{background:#f7edca;border-color:#d5b85e}.layout{display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.list{max-height:calc(100vh - 210px);overflow:auto}.row{padding:11px 12px;border-bottom:1px solid #f0ebdf;cursor:pointer}.row:hover,.row.on{background:#fffbf0}.title{font-weight:750;margin:4px 0}.meta{color:var(--sub);font-size:11px;display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;background:#eee}.m3{background:#fce0dd;color:#9a2e2e}.m2{background:#fff0bf;color:#80610d}.m1{background:#e9f3ea;color:#3a6e4b}.lock{background:#f5e0e0;color:#8f3535}.g{background:#e7eef7;color:#315f86}.detail{padding:16px;min-height:500px}.detail h2{margin:0 0 5px}.sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.sec h3{font-size:13px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.box{background:#faf8f1;border:1px solid #eee8da;border-radius:10px;padding:9px;font-size:12px;word-break:break-word}.warn{background:#fff0ef;border-color:#efc1bd}.ok{background:#edf7f1;border-color:#b9ddc9}.ai{background:#fbf7ea;border:1px solid #e4d7a9;border-radius:12px;padding:12px}.btn{border:1px solid #d9c98e;background:#fff9e6;border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:650}.btn.primary{background:var(--gold);border-color:var(--gold)}.btn:disabled{opacity:.5;cursor:not-allowed}.cost{font-size:12px;color:#5f5745}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}.pre{white-space:pre-wrap;font-size:12px;line-height:1.55}.empty{padding:32px;color:var(--sub);text-align:center}@media(max-width:850px){.sum{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.list{max-height:390px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><b>⚡ 공시 Event 검토실</b><a href="records.html">🗂 기록보관실</a><a href="cygnus.html#sectors">산업 관측</a><div class="sp"></div><span id="auth" class="meta">연결 중…</span></div>
<div class="wrap">
  <div class="sum" id="sum"></div>
  <div class="bar" id="filters"></div>
  <div class="layout"><div class="panel"><div class="list" id="list"></div></div><div class="panel"><div class="detail" id="detail"><div class="empty">왼쪽에서 Event를 선택하세요.</div></div></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY",authDomain:"my-system-25497.firebaseapp.com",projectId:"my-system-25497"};
firebase.initializeApp(cfg); const db=firebase.firestore(); const fn=firebase.app().functions('asia-northeast3');
let UID=null, IDX=[], FILTER='ALL', CUR=null, ANALYSIS=null, ESTIMATE=null;
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AI_FIELDS=[
  ['FACT_SUMMARY','factSummary'],['POSITIVE_CASE','positiveCase'],['NEGATIVE_CASE','negativeCase'],
  ['COUNTER_ARGUMENTS','counterArguments'],['KEY_RISKS','keyRisks'],['UNKNOWN_IMPORTANCE','unknownImportance'],
  ['THESIS_IMPACT','thesisImpact'],['THESIS_REASON','thesisReason'],['NEXT_CONFIRMATION','nextConfirmation'],
  ['INVALIDATION_TRIGGER','invalidationTrigger'],['ADDITIONAL_RESEARCH','additionalResearchNeeded'],['EVIDENCE_SUFFICIENCY','evidenceSufficiency']
];
function badge(t,c=''){return `<span class="badge ${c}">${esc(t)}</span>`}
function dayFile(d){return `facts/events/${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}.json`}
async function jget(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now());if(!r.ok)throw new Error(r.status+' '+url);return r.json()}
async function load(){try{const d=await jget('facts/events/index.json');IDX=d.events||[];render()}catch(e){$('#list').innerHTML='<div class="empty">Event 데이터가 아직 배포되지 않았습니다.<br>'+esc(e.message)+'</div>';}}
function filt(e){if(FILTER==='ALL')return true;if(FILTER==='LOCK')return e.decisionLocked;if(FILTER==='CORR')return e.version_type!=='ORIGINAL';return e.materiality===FILTER}
function render(){const f=IDX.filter(filt);const counts={M3:0,M2:0,LOCK:0,CORR:0};IDX.forEach(e=>{if(e.materiality==='M3')counts.M3++;if(e.materiality==='M2')counts.M2++;if(e.decisionLocked)counts.LOCK++;if(e.version_type!=='ORIGINAL')counts.CORR++});
$('#sum').innerHTML=`<div class="kpi"><span>전체 Event</span><b>${IDX.length}</b></div><div class="kpi"><span>M3</span><b>${counts.M3}</b></div><div class="kpi"><span>M2</span><b>${counts.M2}</b></div><div class="kpi"><span>판단 잠김</span><b>${counts.LOCK}</b></div><div class="kpi"><span>정정/철회</span><b>${counts.CORR}</b></div>`;
$('#filters').innerHTML=['ALL','M3','M2','LOCK','CORR'].map(x=>`<button class="chip ${FILTER===x?'on':''}" data-f="${x}">${x==='ALL'?'전체':x==='LOCK'?'🔒 잠김':x==='CORR'?'정정/철회':x}</button>`).join('');
$('#filters').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render()});
$('#list').innerHTML=f.length?f.map(e=>`<div class="row ${CUR&&CUR.event_id===e.event_id?'on':''}" data-id="${esc(e.event_id)}"><div class="meta">${badge(e.materiality||'UNKNOWN',(e.materiality||'').toLowerCase())}${badge(e.riskGate||'G0','g')}${e.decisionLocked?badge('🔒 잠김','lock'):''}${e.version_type!=='ORIGINAL'?badge(e.version_type):''}</div><div class="title">${esc(e.company||'')} · ${esc(e.type||'')}</div><div class="meta"><span>${esc(e.date||'')}</span><span>${esc(e.family||'')}</span><span>${esc(e.rcept_no||'')}</span></div></div>`).join(''):'<div class="empty">해당 Event가 없습니다.</div>';
$('#list').querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>openEvent(r.dataset.id));}
async function openEvent(id){const s=IDX.find(x=>x.event_id===id);if(!s)return;ANALYSIS=null;ESTIMATE=null;try{const d=await jget(dayFile(s.date));CUR=(d.events||[]).find(x=>x.event_id===id)||s}catch(_){CUR=s}render();renderDetail();}
function objBoxes(o){const a=Object.entries(o||{});return a.length?`<div class="grid">${a.map(([k,v])=>`<div class="box"><b>${esc(k)}</b><br>${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}</div>`:'<div class="meta">없음</div>'}
function metrics(m){return (m||[]).length?`<div class="grid">${m.map(x=>`<div class="box ${x.status==='CONFLICT'?'warn':''}"><b>${esc(x.metric)}</b> ${badge(x.materialityBand||'UNKNOWN')}<br>reported=${esc(x.reportedValue)} / computed=${esc(x.computedValue)}<br><span class="meta">${esc(x.status)} · ${esc(x.formula||'')}</span></div>`).join('')}</div>`:'<div class="meta">계산된 metric 없음</div>'}
function renderDetail(){if(!CUR)return;const v=(CUR.versions||[{}])[0],locked=CUR.decisionLocked!==false;
$('#detail').innerHTML=`<div class="meta">${badge(CUR.materiality||'UNKNOWN',(CUR.materiality||'').toLowerCase())}${badge(CUR.riskGate||'G0','g')}${locked?badge('🔒 투자판단 잠김','lock'):''}${badge(CUR.sourceLevel||'')}${badge(CUR.claimStatus||'')}${badge(CUR.dataStatus||'')}</div><h2>${esc(CUR.company||'')}</h2><div>${esc(CUR.raw_title||CUR.type||'')}</div><div class="meta"><a target="_blank" href="${esc(v.url||CUR.url||'#')}">DART 원문</a> · ${esc(v.rcept_no||CUR.rcept_no||'')}</div>
<div class="sec ${locked?'warn':'ok'} box"><b>${locked?'🔒 신규 투자판단 잠김':'검토 가능'}</b><br>${esc((CUR.lock_reasons||[]).join(' · ')||'')}</div>
<div class="sec"><h3>Fact</h3>${objBoxes(CUR.facts)}</div><div class="sec"><h3>Materiality Metrics</h3>${metrics(CUR.metrics)}</div><div class="sec"><h3>UNKNOWN / 확인 필요</h3>${(CUR.unknowns||[]).length?'<div class="pre">'+esc((CUR.unknowns||[]).join('\n'))+'</div>':'<div class="meta">없음</div>'}</div>
<div class="sec ai"><h3>🤖 AI Risk / Thesis 분석</h3><div class="cost" id="aiCost">자동 호출 OFF · 먼저 예상비용을 확인합니다.</div><div class="bar"><select id="tier"><option value="analysis">Sonnet 5 · Risk/Thesis</option><option value="routine">Haiku 4.5 · 짧은 정리</option><option value="deep">Opus 5 · 심층분석</option></select><button class="btn" id="estimate">예상비용 확인</button><button class="btn primary" id="analyze" disabled>비용 확인 후 분석 실행</button></div><div id="aiOut"></div><div class="meta" id="uidLine"></div></div>
<div class="sec"><h3>사용자 최종 판단(G6)</h3><div class="meta">AI가 자동으로 G6를 열지 않습니다. 분석/수동검토 후 사용자 확인이 필요합니다. 미확정·UNKNOWN·CONFLICT에서는 BUY/ADD를 저장할 수 없습니다.</div><div class="bar"><select id="decision"><option>WATCH</option><option>HOLD</option><option>REDUCE</option><option>SELL</option><option>BUY</option><option>ADD</option></select><label><input type="checkbox" id="manualReview"> 리스크·기존 논지 비교를 직접 확인함</label><button class="btn" id="g6">G6 확인 저장</button></div><div id="decisionState" class="meta"></div></div>`;
$('#estimate').onclick=estimate;$('#analyze').onclick=analyze;$('#g6').onclick=saveDecision;loadDecision();}
async function currentThesis(){try{const d=await db.collection('records_meta').doc('stocks').get();const list=d.exists&&d.data().list||[];const hit=list.find(x=>(typeof x==='object'?x.name:x)===CUR.company);return hit&&typeof hit==='object'?hit:null}catch(_){return null}}
async function estimate(){if(!UID)return;$('#aiCost').textContent='토큰 계산 중…';try{const th=await currentThesis();const call=fn.httpsCallable('estimateEventAnalysis');const r=await call({event:CUR,thesis:th,tier:$('#tier').value});ESTIMATE=r.data;const effort=ESTIMATE.effort?` · effort ${ESTIMATE.effort}`:'';$('#aiCost').textContent=`모델 ${ESTIMATE.model}${effort} · 예상 입력 ${ESTIMATE.estimatedInputTokens.toLocaleString()} · 예상비용 $${Number(ESTIMATE.estimatedCostUsd).toFixed(4)} · 최대 약 $${Number(ESTIMATE.maxCostUsd).toFixed(4)}`;$('#analyze').disabled=false;}catch(e){$('#aiCost').textContent='예상비용 확인 실패: '+(e.message||e);$('#uidLine').innerHTML=`AI 사용권한이 없으면 <a href="ai-register.html">이 기기를 등록</a>하세요. UID: <span class="mono">${esc(UID||'')}</span>`;}}
function renderAiOutput(o){return AI_FIELDS.map(([label,key])=>{const v=o&&o[key];const text=Array.isArray(v)?v.join('\n'):(v===0?0:(v||'UNKNOWN'));return `<div class="box" style="margin-top:6px"><b>${label}</b><div class="pre">${esc(text)}</div></div>`}).join('')}
async function analyze(){if(!ESTIMATE||!confirm(`실제 AI 분석을 실행합니다. 예상비용 $${Number(ESTIMATE.estimatedCostUsd).toFixed(4)} (최대 약 $${Number(ESTIMATE.maxCostUsd).toFixed(4)})\n계속할까요?`))return;$('#analyze').disabled=true;$('#aiOut').innerHTML='<div class="meta">분석 중…</div>';try{const th=await currentThesis();const call=fn.httpsCallable('analyzeEvent');const r=await call({event:CUR,thesis:th,tier:$('#tier').value});ANALYSIS=r.data.analysis;const o=ANALYSIS.output||{};$('#aiCost').textContent=`${r.data.cacheHit?'CACHE HIT · 추가비용 $0':'실제 계산비용 $'+Number(r.data.incrementalCostUsd||0).toFixed(4)} · ${ANALYSIS.model||''}${ANALYSIS.effort?' · effort '+ANALYSIS.effort:''}`;$('#aiOut').innerHTML=renderAiOutput(o);}catch(e){$('#aiOut').innerHTML='<div class="box warn">AI 분석 실패: '+esc(e.message||e)+'</div>';}finally{$('#analyze').disabled=false}}
function aggressiveLocked(){return CUR.claimStatus!=='CONFIRMED'||CUR.materiality==='UNKNOWN'||CUR.materialityStatus==='UNKNOWN'||CUR.materialityStatus==='CONFLICT'||(CUR.metrics||[]).some(x=>x.status==='CONFLICT')}
async function saveDecision(){if(!UID||!CUR)return;const reviewed=$('#manualReview').checked||!!ANALYSIS;if(!reviewed){alert('AI 분석 결과를 검토했거나, 직접 리스크·기존 논지를 확인했다는 체크가 필요합니다.');return;}const decision=$('#decision').value;if(['BUY','ADD'].includes(decision)&&aggressiveLocked()){alert('현재 Event는 미확정·중대성 UNKNOWN 또는 수치 충돌 상태라 BUY/ADD 판단을 열 수 없습니다. WATCH/HOLD/REDUCE/SELL 중에서 검토하세요.');return;}await db.collection('event_decisions').doc(CUR.event_id).set({schema:'event-decision/1',eventId:CUR.event_id,rcept_no:(CUR.versions||[{}])[0].rcept_no||'',decision,userConfirmed:true,riskReviewed:true,analysisFingerprint:ANALYSIS&&ANALYSIS.fingerprint||null,gate:'G6',uid:UID,confirmedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$('#decisionState').textContent='G6 사용자 확인 저장됨: '+decision;}
async function loadDecision(){try{const d=await db.collection('event_decisions').doc(CUR.event_id).get();if(d.exists)$('#decisionState').textContent='저장된 결정: '+(d.data().decision||'')+' · '+(d.data().gate||'');}catch(_){}}
firebase.auth().signInAnonymously().catch(()=>{});firebase.auth().onAuthStateChanged(u=>{UID=u&&u.uid||null;$('#auth').textContent=UID?'Firebase 연결됨':'로그인 대기';load();});
</script>
</body></html>
