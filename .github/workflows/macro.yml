# v 20260913  macro.yml — 매크로 수집 + 보강지표 + 시간 메타. 정각 회피 + concurrency + 실패 시 ntfy
name: Macro Collector
on:
  schedule:
    - cron: '5 * * * *'        # 매시 5분 — 컴 없이 자동. GitHub cron 누락 대비 매시간 실행
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: macro
  cancel-in-progress: false
jobs:
  macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install yfinance==0.2.54
      - name: 외국인 수급용 pykrx 설치 (실패해도 매크로 수집은 계속)
        run: pip install pykrx==1.2.9 || echo "::warning::pykrx 설치 실패 — 외국인 수급만 수신 실패로 표시됨"
      - name: 실행하고 커밋·push (충돌 나면 최신으로 다시 실행)
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          set -e
          git config user.name "macro-bot"
          git config user.email "bot@users.noreply.github.com"
          # 기간별 차트 수집기 종료코드를 보관했다가, 나머지 수집·저장·push 를 끝낸 뒤 실패면 작업을 빨갛게 끝낸다.
          # (실패를 삼키고 exit 0 하면 자료가 갱신되지 않았는데도 초록불이 된다)
          PERIODS_RC=0
          REPORT_RC=0
          finish() {
            if [ "$REPORT_RC" != "0" ]; then
              echo "::error::보고서 수집 경로 실패 — facts/market_report_validation.json 확인"
              exit 1
            fi
            if [ "$PERIODS_RC" != "0" ]; then
              echo "::error::macro_periods 종료코드 $PERIODS_RC — 기간별 차트 자료가 갱신되지 않음(facts/macro_periods.json 의 status·errors 확인). 다른 수집분은 저장됨"
              exit 1
            fi
            exit 0
          }
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/macro.py
            python scripts/macro_extra.py || echo "::warning::보강 매크로 수집 일부 실패 — facts/macro_extra.json 확인"
            python scripts/regime.py || echo "::warning::레짐 판정 실패(값 없음) — status.json 에 표시됨"
            NTFY_TOPIC="$NTFY_TOPIC" python scripts/calendar.py || echo "::warning::발표 달력 실패"
            PERIODS_RC=0   # push 재시도로 다시 실행하므로 매 시도의 결과로 갱신한다(이전 시도 값에 덮어써도 마지막 실행 결과가 남는다)
            python scripts/macro_periods.py || PERIODS_RC=$?
            REPORT_RC=0
            python scripts/report_feeds.py || REPORT_RC=$?
            python -P scripts/kr_investor.py || echo "::warning::외국인 수급 수집 실패 — facts/kr_investor.json 의 status·error 확인(어제 값을 새 값으로 쓰지 않음)"
            python -P scripts/kr_investor_history.py || echo "::warning::외국인 이력 갱신 실패"
            python -P scripts/issue_direction.py || echo "::warning::방향 라벨 계산 실패"
            python -P scripts/headlines.py || echo "::warning::헤드라인 RSS 수집 실패"
            python scripts/macro_time_meta.py || echo "::warning::지표 시간 메타 생성 실패 — 원 수집 데이터는 유지"
            python scripts/journal.py || echo "::warning::일지 초안 실패"
            git add facts/macro_periods.json facts/macro.json facts/macro_history.json facts/macro_extra.json facts/macro_extra_history.json facts/kr_key.json facts/calendar_sent.json analysis/regime.json analysis/calendar.json log/ data/status.json 2>/dev/null || true
            git add facts/kr_investor.json facts/kr_investor_history.json facts/issue_direction.json facts/headlines.json 2>/dev/null || true   # 따로 add: 파일이 없을 때 위의 add 전체가 실패하지 않게
            git add facts/market_report_feeds.json facts/market_report_validation.json facts/market_report_clock.json facts/report_candidates/ facts/report_editions/
            if git diff --cached --quiet; then echo "::notice::변경 없음"; finish; fi
            git commit -q -m "auto: macro $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then echo "::notice::push 성공 (시도 $i 회)"; finish; fi
            echo "push 밀림 — $((i*5))초 뒤 최신으로 다시 실행"; sleep $((i*5))
          done
          echo "::error::push 4회 실패"; exit 1
      - name: 보고서 원응답 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-feeds-${{ github.run_id }}
          path: raw/market-report-run/
          retention-days: 30
      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC 없음 — 알림 생략"; exit 0; }
          curl -s -H "Title: [실패] 매크로 수집" -H "Priority: 4" -d "invest macro.yml 실패 — 허브 상단 띠와 Actions 로그 확인" "https://ntfy.sh/$NTFY_TOPIC" || true
