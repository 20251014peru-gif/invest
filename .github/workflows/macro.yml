# v 20260904-3610  macro.yml — CYGNUS 매크로 수집(scripts/macro.py) 하루 2회. 정각 회피 + concurrency + 실패 시 status.json fail + ntfy
name: Macro Collector
on:
  schedule:
    - cron: '5 * * * *'        # 매시 5분 — 컴 없이 자동. GitHub cron 누락 대비 매시간 실행
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: macro
  cancel-in-progress: false
jobs:
  macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install yfinance==0.2.54
      - name: 실행하고 커밋·push (충돌 나면 최신으로 다시 실행)
        run: |
          set -e
          git config user.name "macro-bot"
          git config user.email "bot@users.noreply.github.com"
          # 원리: 커밋 전에 최신을 받고 → 실행 → 커밋 → push. push 가 밀리면(그 사이 누가 올림) 최신으로 되돌리고 다시 실행.
          # 옛 방식(커밋 후 pull --rebase)은 data/status.json 이 양쪽에서 바뀌어 rebase 충돌 → detached HEAD 로 3회 실패했음(2026-09-04).
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/macro.py
            git add facts/macro.json facts/macro_history.json data/status.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "::notice::변경 없음"; exit 0; fi
            git commit -q -m "auto: macro $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then echo "::notice::push 성공 (시도 $i 회)"; exit 0; fi
            echo "push 밀림 — $((i*5))초 뒤 최신으로 다시 실행"; sleep $((i*5))
          done
          echo "::error::push 4회 실패"; exit 1
      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC 없음 — 알림 생략"; exit 0; }
          curl -s -H "Title: [실패] 매크로 수집" -H "Priority: 4" -d "invest macro.yml 실패 — 허브 상단 띠와 Actions 로그 확인" "https://ntfy.sh/$NTFY_TOPIC" || true
