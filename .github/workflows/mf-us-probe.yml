# 멀티팩터(미국) 데이터 확보 프로브 (1회성 시험) — v 20261019-1
# 무엇: GitHub-hosted runner 에서 yfinance(야후)·FinanceDataReader(위키백과) 로 미국 멀티팩터 입력을 받아보는 시험.
# 아님: cron 없음 · 비밀값 없음 · 프록시·쿠키 없음 · 저장소에 commit/push 하지 않음.
# 판정: 초록색 = 시험이 끝까지 실행됨일 뿐이다. 확보 여부는 Summary 의 '유효' 열과 규모 시험 결과로만 판정한다.
name: MF US data probe (manual, one-shot)
on:
  workflow_dispatch: {}
  push:                         # 임시: 시험 브랜치에서, 이 시험 파일이 바뀐 push 에서만 1회 실행. main 에 합칠 때 제거.
    branches: ['feature/mf-kr']
    paths:
      - '.github/workflows/mf-us-probe.yml'
      - 'tests/mf_us_probe/**'
permissions:
  contents: read
concurrency:
  group: mf-us-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치 (버전 고정) + 실제 설치 버전 기록
        run: |
          python -m pip install --quiet "finance-datareader==0.9.202" "yfinance==0.2.54"
          python -m pip show yfinance | sed -n '1,2p'
      - name: 프로브 실행 (호출당 상한 90초 · 항목마다 결과 즉시 저장 · 연속 10회 실패 시 중단)
        run: python tests/mf_us_probe/probe.py
      - name: 대체 출처 프로브 (SEC EDGAR · Stooq · FDR) — 야후가 막혔을 때의 후보 확인
        run: python tests/mf_us_probe/probe_alt.py
      - name: 결과를 Summary 에 표시
        if: always()
        run: |
          if [ -f tests/mf_us_probe/out/result.md ]; then cat tests/mf_us_probe/out/result.md >> "$GITHUB_STEP_SUMMARY"; else echo "결과 파일 없음 — 프로브가 시작 전에 실패(실행 실패, 데이터 미확보 판정 아님)" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f tests/mf_us_probe/out_alt/result.md ]; then cat tests/mf_us_probe/out_alt/result.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 결과 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-us-probe-result
          path: |
            tests/mf_us_probe/out/
            tests/mf_us_probe/out_alt/
          retention-days: 7
          if-no-files-found: warn
