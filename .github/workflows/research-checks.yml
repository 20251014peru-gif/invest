name: Research workspace checks
on:
  pull_request:
    paths: ['research*.html', 'macro.html', 'chatgpt/**', 'js/research*', 'data/research-cpi.json', 'tests/research*.mjs', '.github/workflows/research-checks.yml']
  push:
    paths: ['research*.html', 'macro.html', 'chatgpt/**', 'js/research*', 'data/research-cpi.json', 'tests/research*.mjs', '.github/workflows/research-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/research*.mjs tests/macro-detail.test.cjs
      - run: node --check js/research-app.mjs
      - run: node --check js/research-dashboard.mjs
      - run: node --check js/research-tools.mjs
      - run: node --check js/research-cpi-editor.mjs
      - run: node --check js/research-archive-draft.mjs
      - run: node --test chatgpt/tests/*.test.mjs
