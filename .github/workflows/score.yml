# v 20260904-1530  score.yml — 오픈북 채점(scripts/score.py) 매일 1회. 정각 회피 cron + concurrency + 실패 시 status.json fail + ntfy
name: Openbook Score
on:
  schedule:
    - cron: '23 22 * * *'      # 22:23 UTC = 07:23 KST (전날 종가 반영 후, 정각 회피)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install yfinance==0.2.54
      - name: 채점 실행
        id: run
        run: python scripts/score.py
      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "score-bot"
          git config user.email "bot@users.noreply.github.com"
          git add analysis/scores.json facts/source_trust.json data/status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "::notice::변경 없음"; exit 0; fi
          git commit -m "auto: score $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            git push && exit 0
            sleep $((i*5))
          done
          echo "::error::push 3회 실패"; exit 1
      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC 없음 — 알림 생략"; exit 0; }
          curl -s -H "Title: [실패] 오픈북 채점" -H "Priority: 4" -d "invest score.yml 실패 — 허브 상단 띠와 Actions 로그 확인" "https://ntfy.sh/$NTFY_TOPIC" || true
