# 멀티팩터 입력값 대조 시험 (1회성, 읽기 전용) — v 20261019-1
# 무엇: 우리 점수의 입력(네이버 분기 재무·주가)을 독립 출처와 대조한다. 재무=금감원 OpenDART 공시, 주가=야후(yfinance).
# 키: 기존 비밀값 DART_API_KEY 를 환경변수로만 쓴다. 스크립트는 키·주소·예외 원문을 출력하지 않는다(시험으로 확인).
# 아님: cron 없음 · 저장소에 commit/push 하지 않음 · AI 호출 없음 · 새 비밀값 없음.
# 판정: 초록색 = 시험이 끝까지 실행됨. 일치 여부는 Summary 의 표로 판단한다. 종료코드 2 = 실행 실패(키 없음 등).
name: MF verify inputs (manual, one-shot)
on:
  workflow_dispatch: {}
  push:                         # 임시: 시험 브랜치에서, 이 시험 파일이 바뀐 push 에서만 1회 실행. main 에 합칠 때 제거.
    branches: ['feature/mf-kr']
    paths:
      - '.github/workflows/mf-verify.yml'
      - 'tests/mf_verify/**'
permissions:
  contents: read
concurrency:
  group: mf-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치 (버전 고정)
        run: python -m pip install --quiet "finance-datareader==0.9.202" "yfinance==0.2.54"
      - name: 단위 시험 (네트워크·키 없이)
        run: python -m unittest discover -s tests/mf_verify -p "test_*.py"
      - name: 대조 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python tests/mf_verify/verify.py
      - name: 결과를 Summary 에 표시
        if: always()
        run: |
          if [ -f tests/mf_verify/out/result.md ]; then cat tests/mf_verify/out/result.md >> "$GITHUB_STEP_SUMMARY"; else echo "결과 파일 없음 — 실행 실패(키 없음 등)" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 결과 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-verify-result
          path: tests/mf_verify/out/
          retention-days: 7
          if-no-files-found: ignore
