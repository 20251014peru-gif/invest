name: Event Engine Baseline Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/event-engine-baseline-once.yml'
permissions:
  contents: write
concurrency:
  group: dart
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build first Event baseline without ntfy
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NTFY_TOPIC: ''
        run: |
          set -euo pipefail
          git config user.name "event-baseline-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          test ! -f facts/events/index.json || { echo "::error::facts/events/index.json already exists; refusing to rebuild baseline"; exit 1; }
          python scripts/dart.py | tee /tmp/baseline.log
          test -f facts/events/index.json || { echo "::error::baseline index was not created"; exit 1; }
          python - <<'PY'
          import json
          d=json.load(open('facts/events/index.json',encoding='utf-8'))
          assert d.get('baselineBuiltAt'), 'baselineBuiltAt missing'
          assert d.get('count',0) >= 0
          print(f"BASELINE_OK count={d.get('count')} builtAt={d.get('baselineBuiltAt')}")
          PY
          if grep -q 'Event ntfy 전송 OK' /tmp/baseline.log; then
            echo "::error::baseline unexpectedly sent ntfy"; exit 1
          fi
          git add facts/dart.json facts/events data/corp_codes.json data/status.json 2>/dev/null || true
          git commit -m "auto: build Event Engine baseline"
          git push origin HEAD:main
