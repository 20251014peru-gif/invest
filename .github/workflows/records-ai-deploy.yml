name: Records AI Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chatgpt/backend/**'
      - 'chatgpt/tests/records-ai.test.mjs'
      - '.github/workflows/records-ai-deploy.yml'
permissions:
  contents: read
concurrency:
  group: records-ai-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test chatgpt/tests/ai-server.test.mjs chatgpt/tests/records-ai.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: my-system-25497
      - name: Install deployment dependencies
        run: |
          npm install -g firebase-tools@latest
          npm --prefix chatgpt/backend install --no-audit --no-fund
      - name: Set non-secret existing model parameter
        working-directory: chatgpt/backend
        run: node -e "require('fs').writeFileSync('.env.my-system-25497', 'MACRO_AI_MODEL=gpt-5-mini\n')"
      - name: Deploy existing private AI function
        working-directory: chatgpt/backend
        run: firebase deploy --only functions:macro-private-ai:macroAi --project my-system-25497 --non-interactive
