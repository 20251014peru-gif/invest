# 서비스 계정 Firestore 쓰기 권한 시험 — 임시(1회성). 시험 후 이 파일과 tests/mf_selftest/ 를 제거한다.
# 하는 일: 기존 비밀값 GCP_SERVICE_ACCOUNT_KEY 로 인증해 chatgpt_macro_private/multifactor_kr/_selftest/{ping,ping2} 를 만들고 바로 삭제한다.
#          각 단계에서 비로그인 읽기가 403 인지도 확인한다. 기존 데이터는 건드리지 않는다.
# 트리거: 이 시험 파일이 바뀐 push(브랜치 feature/mf-kr 한정) 또는 수동. 저장소에 쓰지 않고 아티팩트도 올리지 않는다.
name: MF selftest (temporary)
on:
  workflow_dispatch: {}
  push:
    branches: ['feature/mf-kr']
    paths:
      - '.github/workflows/mf-selftest.yml'
      - 'tests/mf_selftest/**'
permissions:
  contents: read
concurrency:
  group: mf-selftest
  cancel-in-progress: false
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치 (버전 고정)
        run: python -m pip install --quiet "google-cloud-firestore==2.33.0"
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: my-system-25497
      - name: 쓰기·삭제·비로그인 403 시험
        run: python tests/mf_selftest/selftest.py
