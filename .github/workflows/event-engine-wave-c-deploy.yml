name: Event Engine Wave C Deploy (manual)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '검증된 소스 브랜치/커밋'
        required: true
        default: 'main'
      confirm_no_paid_test:
        description: '배포 중 Anthropic 유료 분석을 실행하지 않음'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Safety gate
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_ACCESS_CODE: ${{ secrets.AI_ACCESS_CODE }}
          NO_PAID: ${{ inputs.confirm_no_paid_test }}
        run: |
          set -euo pipefail
          [ "$NO_PAID" = "true" ] || { echo "::error::유료 AI 시험 금지 확인이 필요합니다"; exit 1; }
          [ -n "$GCP_SERVICE_ACCOUNT_KEY" ] || { echo "::error::GitHub Secret GCP_SERVICE_ACCOUNT_KEY 미설정"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::GitHub Secret ANTHROPIC_API_KEY 미설정"; exit 1; }
          [ -n "$AI_ACCESS_CODE" ] || { echo "::error::GitHub Secret AI_ACCESS_CODE 미설정"; exit 1; }
          [ ${#AI_ACCESS_CODE} -ge 16 ] || { echo "::error::AI_ACCESS_CODE는 16자 이상 사용"; exit 1; }
          echo "필수 Secret 존재 확인 완료(값은 출력하지 않음)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: my-system-25497

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and dependencies
        run: |
          set -euo pipefail
          npm install -g firebase-tools@latest
          npm --prefix functions install --no-audit --no-fund
          npm --prefix functions-access install --no-audit --no-fund
          npm --prefix functions run sync-config
          npm --prefix functions run test:core
          node -e "import('./functions/index.js').then(()=>console.log('event-ai import OK'))"
          node -e "import('./functions-access/index.js').then(()=>console.log('event-access import OK'))"

      - name: Firebase auth/project preflight
        run: |
          set -euo pipefail
          firebase projects:list --json >/tmp/firebase-projects.json
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/firebase-projects.json','utf8'));
          const rows=Array.isArray(d.result)?d.result:(d.result?.projects||[]);
          if(!rows.some(x=>x.projectId==='my-system-25497')) { console.error('::error::배포 계정이 my-system-25497 프로젝트에 접근할 수 없습니다'); process.exit(1); }
          console.log('Firebase project access OK');
          NODE

      - name: Set Firebase Secret Manager values
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_ACCESS_CODE: ${{ secrets.AI_ACCESS_CODE }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANTHROPIC_API_KEY" >/tmp/anthropic_api_key
          printf '%s' "$AI_ACCESS_CODE" >/tmp/ai_access_code
          firebase functions:secrets:set ANTHROPIC_API_KEY --data-file /tmp/anthropic_api_key --project my-system-25497
          firebase functions:secrets:set AI_ACCESS_CODE --data-file /tmp/ai_access_code --project my-system-25497
          rm -f /tmp/anthropic_api_key /tmp/ai_access_code
          echo "Firebase secrets set (values hidden)"

      - name: Deploy access function codebase
        run: firebase deploy --only functions:event-access --project my-system-25497 --non-interactive

      - name: Deploy AI function codebase
        run: firebase deploy --only functions:event-ai --project my-system-25497 --non-interactive

      - name: Verify deployed functions
        run: |
          firebase functions:list --project my-system-25497
          echo "::notice::배포 완료. 이 workflow는 Anthropic messages.create를 호출하지 않았으므로 유료 AI 분석은 실행하지 않음."
