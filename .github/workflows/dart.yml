# v 20260904-3610  dart.yml — 산업 사슬 종목의 DART 공시 수집(scripts/dart.py) 평일 4회. 정각 회피 + 실패 시 status fail + ntfy
name: DART Disclosure
on:
  schedule:
    - cron: '15,45 * * * *'    # 매시 15·45분 — 30분마다, 수주 공시 빨리 잡기(컴 없이 자동)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dart
  cancel-in-progress: false
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집하고 커밋·push (충돌 나면 최신으로 다시)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -e
          git config user.name "dart-bot"; git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main; git reset --hard origin/main
            python scripts/dart.py
            git add facts/dart.json data/status.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "::notice::변경 없음"; exit 0; fi
            git commit -q -m "auto: dart $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*5))
          done
          echo "::error::push 4회 실패"; exit 1
      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: '[ -n "$NTFY_TOPIC" ] && curl -s -H "Title: [실패] 공시 수집" -H "Priority: 4" -d "invest dart.yml 실패 — 허브 띠·Actions 로그 확인" "https://ntfy.sh/$NTFY_TOPIC" || true'
