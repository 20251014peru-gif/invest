# v 20260915-WaveC1 dart.yml — DART Collector + Event Engine. 30분마다 클라우드 실행.
name: DART Disclosure
on:
  schedule:
    - cron: '15,45 * * * *'    # 매시 15·45분 — 30분마다
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: dart
  cancel-in-progress: false
jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 수집하고 Event 결과까지 커밋·push
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -e
          git config user.name "dart-bot"; git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main; git reset --hard origin/main
            python scripts/dart.py
            git add facts/dart.json facts/events data/corp_codes.json data/status.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "::notice::변경 없음"; exit 0; fi
            git commit -q -m "auto: dart event $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*5))
          done
          echo "::error::push 4회 실패"; exit 1
      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: '[ -n "$NTFY_TOPIC" ] && curl -s -H "Title: [실패] 공시 Event 수집" -H "Priority: 4" -d "invest dart.yml 실패 — Event Engine/Actions 로그 확인" "https://ntfy.sh/$NTFY_TOPIC" || true'
