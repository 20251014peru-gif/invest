# v 20260915-WaveB4 — 실검증. workflow_dispatch 전용. 운영 자동연결 없음.
name: Event Engine Validate (manual)
on:
  workflow_dispatch:
    inputs:
      days:
        description: '조회기간(일) — 표본 부족 시 365로 늘린다'
        default: '180'
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: OpenDART 실제 호출 검증
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          echo "::add-mask::$DART_API_KEY"
          DART_DAYS="${{ inputs.days }}" python scripts/event_engine_validate.py
      - name: 검증 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-engine-validation-${{ github.run_id }}
          path: |
            data/corp_codes.json
            tests/fixtures/opendart/
          if-no-files-found: warn
          retention-days: 14
