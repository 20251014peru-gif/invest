<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>매크로 감각실</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--sub:#667085;--line:#e5e7eb;--blue:#2563eb;--red:#dc2626;--green:#15803d;--orange:#c2410c;--shadow:0 8px 24px rgba(15,23,42,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 18px}.head{max-width:1450px;margin:auto;display:flex;gap:12px;align-items:center}.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);font-weight:800}.title{flex:1}.title h1{font-size:20px;margin:0}.title p{font-size:12px;color:var(--sub);margin:3px 0 0}.status{font-size:11px;color:var(--sub);text-align:right}main{max-width:1450px;margin:auto;padding:16px 18px 40px}.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:10px}.box,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.box{padding:15px}.box h3{margin:0 0 7px;font-size:12px;color:var(--sub)}.big{font-size:24px;font-weight:900}.desc{font-size:12px;color:var(--sub);line-height:1.55;margin-top:6px}.timebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 12px;font-size:11px;color:#475467}.timebar strong{color:var(--ink)}.timebar .sep{color:#d0d5dd}.changes{display:flex;gap:7px;overflow:auto;padding:0 0 12px}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.tabs button.on{background:#111827;color:#fff;border-color:#111827}.group{margin:19px 0}.gh{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.gh h2{font-size:16px;margin:0}.gh span{font-size:10.5px;color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:10px}.card{padding:13px;cursor:pointer;min-height:205px}.top{display:flex;justify-content:space-between;gap:7px}.name{font-size:14px;font-weight:900}.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:9.5px;border-radius:999px;padding:3px 7px;background:#f3f4f6;color:var(--sub)}.badge.core{background:#eef2ff;color:#3730a3}.badge.early{background:#f3e8ff;color:#7e22ce}.badge.review{background:#fff7ed;color:#c2410c}.badge.today{background:#ecfdf3;color:#027a48}.badge.available{background:#eff8ff;color:#175cd3}.badge.scheduled{background:#f3e8ff;color:#7e22ce}.badge.error{background:#fef3f2;color:#b42318}.badge.pending,.badge.unknown{background:#f2f4f7;color:#475467}.metric{display:flex;gap:6px;align-items:baseline;margin-top:8px}.value{font-size:25px;font-weight:900}.unit{font-size:11px;color:var(--sub)}.delta{font-size:11px;font-weight:800}.delta.up{color:var(--red)}.delta.down{color:var(--blue)}.bench{font-size:10.5px;color:var(--sub);min-height:17px;margin-top:2px}.spark{height:42px;margin:7px 0}.meaning{font-size:12px;line-height:1.45;color:#475467;min-height:34px}.meta{border-top:1px solid #f0f1f4;margin-top:8px;padding-top:7px;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:10px;color:#667085}.meta .wide{grid-column:1/-1}.meta b{font-weight:800;color:#475467}.warn{margin-top:7px;padding:6px 8px;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:10px}.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;padding:14px}.modal-bg.on{display:flex;align-items:center;justify-content:center}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.mhead{display:flex;gap:10px}.grow{flex:1}.mhead h2{margin:0}.close{border:none;background:#f3f4f6;border-radius:50%;width:36px;height:36px;font-size:18px}.chart{height:260px;margin:16px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{border:1px solid var(--line);border-radius:12px;padding:12px}.info h3{font-size:11px;color:var(--sub);margin:0 0 5px}.info p{font-size:13px;line-height:1.55;margin:0}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{font-size:12px;font-weight:800;color:var(--blue);text-decoration:none;border:1px solid #dbeafe;border-radius:9px;padding:7px 10px}@media(max-width:900px){.summary{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}}@media(max-width:640px){header{padding:10px 12px}.status{display:none}main{padding:12px}.grid{grid-template-columns:1fr}.card{min-height:auto}.summary{gap:8px}.timebar{align-items:flex-start}}@media print{header,.tabs,.changes{display:none!important}body{background:#fff}.grid{grid-template-columns:repeat(3,1fr)}.card{box-shadow:none;break-inside:avoid}.group{break-inside:avoid}.timebar{box-shadow:none}}
</style></head><body>
<header><div class="head"><a class="back" href="index.html">‹ 허브</a><div class="title"><h1>매크로 감각실</h1><p>미국·한국의 경제환경과 실제 시장 반응을 중요도 순으로 확인</p></div><div class="status" id="status">불러오는 중…</div></div></header>
<main><section class="summary"><div class="box"><h3>수집값 중 변화 확인</h3><div class="big" id="headline">데이터 확인 중</div><div class="desc" id="headlineDesc">실제 수집된 값의 변화만 표시합니다.</div></div><div class="box"><h3>🇺🇸 미국</h3><div class="big" id="usState">—</div><div class="desc" id="usDesc"></div></div><div class="box"><h3>🇰🇷 한국</h3><div class="big" id="krState">—</div><div class="desc" id="krDesc"></div></div></section><div class="timebar" id="timebar"><strong>시간 정보 확인 중…</strong></div><div class="changes" id="changes"></div><div class="tabs"><button class="on" data-tab="all">전체</button><button data-tab="us">🇺🇸 미국</button><button data-tab="kr">🇰🇷 한국</button><button data-tab="world">🌍 글로벌</button><button onclick="window.print()">🖨️ 출력</button></div><div id="groups"></div></main>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mhead"><div class="grow"><h2 id="mTitle"></h2><div id="mSub" class="desc"></div></div><button class="close" onclick="closeModal()">×</button></div><div class="chart" id="mChart"></div><div class="twocol"><div class="info"><h3>무엇을 뜻하나</h3><p id="mMeaning"></p></div><div class="info"><h3>방향 해석</h3><p id="mDirection"></p></div></div><div class="links" id="mLinks"></div></div></div>
<script>
const S={items:[],hist:{},view:null,tab:'all',macro:null};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=v=>v==null||isNaN(+v)?'—':Math.abs(+v)>=10000?(+v).toLocaleString('ko-KR',{maximumFractionDigits:1}):(+v).toLocaleString('ko-KR',{maximumFractionDigits:3});
const cyc=c=>({D:'일간',W:'주간',M:'월간',Q:'분기',A:'연간',weekday:'영업일',daily:'일간',weekly:'주간',monthly:'월간',quarterly:'분기'})[c]||c||'—';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function kstShort(s){if(!s)return '—';let d=new Date(s);if(isNaN(d))return String(s).slice(5,16).replace('T',' ');return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replaceAll('.','/').replace(/\s+/g,' ').trim()}
function freshLabel(r){return ({today:'당일 자료',available:'수집됨',scheduled:'공식 발표 예정',error:'수집 오류',pending:'미설정',unknown:'확인 필요'})[r.freshness]||'확인 필요'}
function nextText(r){let n=r.next_update||{};return n.verified===true&&n.label?'공식 '+n.label:'공식 일정 미확인'}
function mergeHist(a,b){let out={};[a,b].forEach(x=>Object.entries((x&&x.days)||{}).forEach(([d,v])=>Object.assign(out[d]||(out[d]={}),v)));return out}
function histFor(id){return Object.keys(S.hist).sort().map(d=>({d,v:S.hist[d][id]})).filter(x=>x.v!=null).slice(-60)}
function spark(a,b){if(a.length<2)return '<div style="font-size:10px;color:#98a2b3;padding-top:13px">이력 축적 중</div>';let v=a.map(x=>+x.v),mn=Math.min(...v),mx=Math.max(...v);if(Number.isFinite(+b)){mn=Math.min(mn,+b);mx=Math.max(mx,+b)}if(mx===mn){mx++;mn--}let p=a.map((x,i)=>[(i/(a.length-1))*240,38-(x.v-mn)/(mx-mn)*34]);let path=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');let line='';if(Number.isFinite(+b)){let y=38-(b-mn)/(mx-mn)*34;line='<line x1="0" x2="240" y1="'+y+'" y2="'+y+'" stroke="#d1d5db" stroke-dasharray="3 3"/>'}return '<svg viewBox="0 0 240 42" width="100%" height="42" preserveAspectRatio="none">'+line+'<path d="'+path+'" fill="none" stroke="#4f46e5" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'}
function chart(a,b){if(a.length<2)return '<div class="desc">그래프 이력이 아직 부족합니다.</div>';let v=a.map(x=>+x.v),mn=Math.min(...v),mx=Math.max(...v);if(Number.isFinite(+b)){mn=Math.min(mn,+b);mx=Math.max(mx,+b)}let pad=(mx-mn||1)*.12;mn-=pad;mx+=pad;let w=820,h=250,l=45,r=15,t=15,bot=30;let pts=a.map((x,i)=>[l+(w-l-r)*i/(a.length-1),t+(h-t-bot)*(1-(x.v-mn)/(mx-mn))]);let path=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');let g='';for(let i=0;i<5;i++){let y=t+(h-t-bot)*i/4,val=mx-(mx-mn)*i/4;g+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y+'" y2="'+y+'" stroke="#eef0f3"/><text x="'+(l-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#98a2b3">'+fmt(val)+'</text>'}return '<svg viewBox="0 0 820 250" width="100%" height="100%" preserveAspectRatio="none">'+g+'<path d="'+path+'" fill="none" stroke="#4f46e5" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>'}
function item(id){return S.items.find(x=>x.id===id)}function meta(id){return S.view.items[id]||{}};
function card(r,m){let b=m.benchmark&&Number.isFinite(+m.benchmark.value)?+m.benchmark.value:null,d=r.change_pct??r.change;let qual=m.quality==='review'?'<span class="badge review">검토 필요</span>':'';let fs=r.freshness||'unknown';let age=Number.isInteger(r.age_days)?'<span><b>경과</b> '+r.age_days+'일</span>':'';return '<div class="card" onclick="openModal(\''+r.id+'\')"><div class="top"><div class="name">'+esc(r.name)+'</div><div class="badges"><span class="badge '+esc(m.role||'context')+'">'+esc(m.role||'context')+'</span><span class="badge '+esc(fs)+'">'+freshLabel(r)+'</span>'+qual+'</div></div><div class="metric"><span class="value">'+fmt(r.value)+'</span><span class="unit">'+esc(r.unit||'')+'</span>'+(d!=null?'<span class="delta '+(d>0?'up':d<0?'down':'')+'">'+(d>0?'▲ ':d<0?'▼ ':'')+fmt(Math.abs(d))+'</span>':'')+'</div><div class="bench">'+esc((m.benchmark&&m.benchmark.label)||'고정 기준선 없음 · 실제 변화 확인')+'</div><div class="spark">'+spark(histFor(r.id),b)+'</div><div class="meaning">'+esc(m.meaning||'')+'</div><div class="meta"><span><b>자료 기준</b> '+esc(r.as_of||'—')+'</span><span><b>발표 주기</b> '+esc(r.frequency||m.frequency||cyc(r.cycle))+'</span><span><b>최근 수집</b> '+esc(kstShort(r.collected_at))+'</span><span><b>출처</b> '+esc(r.source||'—')+'</span>'+age+'<span class="wide"><b>다음 발표</b> '+esc(nextText(r))+'</span></div>'+(m.warning?'<div class="warn">'+esc(m.warning)+'</div>':'')+'</div>'}
function render(){let gs=[...S.view.groups].sort((a,b)=>a.order-b.order),host=$('#groups');host.innerHTML='';gs.filter(g=>S.tab==='all'||g.country===S.tab).forEach(g=>{let rows=S.items.filter(r=>meta(r.id).group===g.id).sort((a,b)=>(meta(a.id).priority||9)-(meta(b.id).priority||9));if(!rows.length)return;host.insertAdjacentHTML('beforeend','<section class="group"><div class="gh"><h2>'+g.title+'</h2><span>중요도 설정 순 · 카드를 누르면 상세</span></div><div class="grid">'+rows.map(r=>card(r,meta(r.id))).join('')+'</div></section>')});summary()}
function summary(){let changes=S.items.filter(x=>x.value!=null).map(x=>({x,d:Math.abs(x.change_pct??x.change??0)})).filter(o=>o.d>0).sort((a,b)=>b.d-a.d).slice(0,8);$('#changes').innerHTML=changes.map(o=>'<span class="chip">'+esc(o.x.name)+' · '+fmt(o.x.change_pct??o.x.change)+'</span>').join('')||'<span class="chip">변화값 없음</span>';let first=changes[0];$('#headline').textContent=first?first.x.name:'변화값 없음';$('#headlineDesc').textContent=first?'수집된 변화율 절대값 상위 · '+fmt(first.x.change_pct??first.x.change):'현재 수집 데이터에 비교 가능한 변화값이 없습니다.';let us=S.items.filter(x=>meta(x.id).group&&meta(x.id).group.startsWith('us_')&&x.error==='');let kr=S.items.filter(x=>meta(x.id).group&&meta(x.id).group.startsWith('kr_')&&x.error==='');$('#usState').textContent=us.length+'개 수집';$('#krState').textContent=kr.length+'개 수집';$('#usDesc').textContent='오류 없는 실제 수집 항목 수';$('#krDesc').textContent='오류 없는 실제 수집 항목 수'}
function openModal(id){let r=item(id),m=meta(id);if(!r)return;let b=m.benchmark&&Number.isFinite(+m.benchmark.value)?+m.benchmark.value:null;$('#mTitle').textContent=r.name;$('#mSub').textContent='현재 '+fmt(r.value)+' '+(r.unit||'')+' · 자료 기준 '+(r.as_of||'—')+' · '+(r.frequency||m.frequency||cyc(r.cycle))+' · '+freshLabel(r)+' · 다음 발표 '+nextText(r);$('#mChart').innerHTML=chart(histFor(id),b);$('#mMeaning').textContent=m.meaning||'';$('#mDirection').textContent='상승: '+(m.up||'—')+' / 하락: '+(m.down||'—');let nu=r.next_update||{};$('#mLinks').innerHTML=(m.source_url?'<a href="'+m.source_url+'" target="_blank">공식·원자료 ↗</a>':'')+(nu.verified===true&&nu.source?'<a href="'+nu.source+'" target="_blank">검증된 발표일정 ↗</a>':'')+(m.schedule_url?'<a href="'+m.schedule_url+'" target="_blank">기관 일정 페이지 ↗</a>':'');$('#modalBg').classList.add('on')}function closeModal(){$('#modalBg').classList.remove('on')}
$$('.tabs [data-tab]').forEach(b=>b.onclick=()=>{$$('.tabs [data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;render()});
Promise.all([fetch('facts/macro.json?t='+Date.now()).then(r=>r.json()),fetch('facts/macro_history.json?t='+Date.now()).then(r=>r.json()),fetch('data/macro_view.json?t='+Date.now()).then(r=>r.json()),fetch('facts/macro_extra.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),fetch('facts/macro_extra_history.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([m,h,v,e,eh])=>{S.macro=m;S.items=[...(m.items||[]),...((e&&e.items)||[])];S.hist=mergeHist(h,eh);S.view=v;$('#status').textContent='기본 '+(m.ok||0)+'/'+(m.total||0)+' · 보강 '+((e&&e.ok)||0)+'/'+((e&&e.total)||0)+' · '+kstShort(m.collected_at);$('#timebar').innerHTML='<strong>자동수집 일정</strong> 매시 05분 <span class="sep">|</span> <strong>최근 실제 수집</strong> '+esc(kstShort(m.collected_at))+' <span class="sep">|</span> <strong>원자료 다음 발표</strong> 공식 검증 일정만 표시 <span class="sep">|</span> 임의 추정·보간 없음';render()}).catch(err=>{$('#status').textContent='불러오기 실패';$('#timebar').innerHTML='<strong>시간 정보 불러오기 실패</strong>';$('#groups').innerHTML='<div class="box">데이터를 불러오지 못했습니다. 새로고침 후 다시 확인하세요.</div>'});
</script></body></html>
