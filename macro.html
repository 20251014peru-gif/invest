<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>매크로 감각실</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--sub:#667085;--line:#e5e7eb;--blue:#2563eb;--purple:#7c3aed;--green:#15803d;--orange:#c2410c;--red:#dc2626;--soft:#eef2ff;--shadow:0 8px 24px rgba(15,23,42,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:-.01em}header{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 18px}.head{max-width:1450px;margin:auto;display:flex;gap:12px;align-items:center}.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);font-weight:800}.title{flex:1}.title h1{font-size:20px;margin:0}.title p{font-size:12px;color:var(--sub);margin:3px 0 0}.status{font-size:12px;color:var(--sub);text-align:right}main{max-width:1450px;margin:auto;padding:16px 18px 40px}.summary{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-bottom:16px}.hero,.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.hero{padding:16px}.hero h2,.mini h3{margin:0 0 8px}.hero h2{font-size:16px}.hero .big{font-size:27px;font-weight:900}.hero .desc{margin-top:7px;color:var(--sub);font-size:13px;line-height:1.55}.mini{padding:14px}.mini h3{font-size:13px;color:var(--sub)}.mini .v{font-size:18px;font-weight:900}.changes{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.change-chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;margin:4px 0 14px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}.tabs button.on{background:#111827;color:#fff;border-color:#111827}.group{margin:20px 0}.group-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:9px}.group h2{font-size:16px;margin:0}.group .hint{font-size:11px;color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:0 2px 10px rgba(15,23,42,.035);cursor:pointer;min-height:192px}.card:hover{border-color:#c7d2fe}.card-top{display:flex;justify-content:space-between;gap:8px}.name{font-size:14px;font-weight:900}.badge{font-size:10px;border-radius:999px;padding:3px 7px;background:#f3f4f6;color:var(--sub);white-space:nowrap}.badge.core{background:#eef2ff;color:#3730a3}.badge.early{background:#f3e8ff;color:#7e22ce}.badge.review{background:#fff7ed;color:#c2410c}.metric{display:flex;align-items:baseline;gap:7px;margin-top:8px}.value{font-size:25px;font-weight:900}.unit{font-size:11px;color:var(--sub)}.delta{font-size:12px;font-weight:800}.delta.up{color:var(--red)}.delta.down{color:#2563eb}.benchmark{font-size:11px;color:var(--sub);min-height:17px;margin-top:3px}.spark{height:42px;margin:7px 0 3px}.spark svg{width:100%;height:100%;overflow:visible}.meaning{font-size:12px;color:#475467;line-height:1.45;height:35px;overflow:hidden}.meta{margin-top:9px;padding-top:8px;border-top:1px solid #f0f1f4;font-size:10.5px;color:#98a2b3;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}.warn{margin-top:7px;background:#fff7ed;color:#9a3412;border-radius:8px;padding:6px 8px;font-size:10.5px}.empty{padding:30px;text-align:center;color:var(--sub)}.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;padding:18px}.modal-bg.on{display:flex;align-items:center;justify-content:center}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.mhead{display:flex;gap:10px;align-items:start}.mhead .grow{flex:1}.mhead h2{margin:0;font-size:20px}.close{border:none;background:#f3f4f6;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}.bigchart{height:260px;margin:18px 0}.bigchart svg{width:100%;height:100%}.explain{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:12px;padding:12px}.box h3{font-size:12px;color:var(--sub);margin:0 0 5px}.box p{font-size:13px;line-height:1.55;margin:0}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{font-size:12px;font-weight:800;color:var(--blue);text-decoration:none;border:1px solid #dbeafe;border-radius:9px;padding:7px 10px}@media(max-width:900px){.summary{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.explain{grid-template-columns:1fr}}@media(max-width:640px){header{padding:10px 12px}.head{align-items:flex-start}.status{display:none}main{padding:12px 12px 32px}.grid{grid-template-columns:1fr}.hero .big{font-size:23px}.card{min-height:auto}.meaning{height:auto}.modal-bg{padding:8px}.modal{padding:14px}}
@media print{header,.tabs,.changes{display:none!important}body{background:#fff}main{padding:0}.summary{grid-template-columns:1fr 1fr 1fr}.group{break-inside:avoid}.card{box-shadow:none;break-inside:avoid}.grid{grid-template-columns:repeat(3,1fr)}.modal-bg{display:none!important}}
</style>
</head>
<body>
<header><div class="head"><a class="back" href="index.html">‹ 허브</a><div class="title"><h1>매크로 감각실</h1><p>미국·한국 경제환경과 실제 시장 반응을 한 화면에서 확인</p></div><div class="status" id="status">불러오는 중…</div></div></header>
<main>
<section class="summary"><div class="hero"><h2>오늘 무엇이 바뀌었나</h2><div class="big" id="headline">데이터 확인 중</div><div class="desc" id="headlineDesc">값보다 방향과 변화, 그리고 시장 확인을 함께 봅니다.</div></div><div class="mini"><h3>미국 핵심 상태</h3><div class="v" id="usState">—</div><div class="desc" id="usDesc"></div></div><div class="mini"><h3>한국 핵심 상태</h3><div class="v" id="krState">—</div><div class="desc" id="krDesc"></div></div></section>
<div class="changes" id="changes"></div>
<div class="tabs"><button class="on" data-tab="all">전체</button><button data-tab="us">🇺🇸 미국</button><button data-tab="kr">🇰🇷 한국</button><button data-tab="world">🌍 글로벌</button><button onclick="window.print()">🖨️ 출력</button></div>
<div id="groups"></div>
</main>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mhead"><div class="grow"><h2 id="mTitle"></h2><div id="mSub" style="font-size:12px;color:#667085;margin-top:3px"></div></div><button class="close" onclick="closeModal()">×</button></div><div class="bigchart" id="mChart"></div><div class="explain"><div class="box"><h3>무엇을 뜻하나</h3><p id="mMeaning"></p></div><div class="box"><h3>방향 해석</h3><p id="mDirection"></p></div></div><div class="links" id="mLinks"></div></div></div>
<script>
const S={macro:null,hist:null,view:null,ind:null,calendar:null,tab:'all'};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(v){if(v===null||v===undefined||Number.isNaN(Number(v)))return '—'; let n=Number(v); if(Math.abs(n)>=10000)return n.toLocaleString('ko-KR',{maximumFractionDigits:1}); if(Math.abs(n)>=100)return n.toLocaleString('ko-KR',{maximumFractionDigits:2}); return n.toLocaleString('ko-KR',{maximumFractionDigits:3});}
function cycle(c){return ({D:'일간',W:'주간',M:'월간',Q:'분기',A:'연간'})[c]||c||'—';}
function histFor(id){let d=(S.hist&&S.hist.days)||{};return Object.keys(d).sort().map(k=>({d:k,v:d[k]&&d[k][id]})).filter(x=>x.v!==undefined&&x.v!==null);}
function compactSeries(a){let out=[];a.forEach(x=>{if(!out.length||out[out.length-1].v!==x.v)out.push(x);});return out.slice(-40);}
function sparkSvg(arr,baseline){arr=compactSeries(arr);if(arr.length<2)return '<div style="font-size:10px;color:#98a2b3;padding-top:12px">이력 축적 중</div>';let vals=arr.map(x=>+x.v);if(Number.isFinite(+baseline))vals.push(+baseline);let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}let w=240,h=40,p=3;let pts=arr.map((x,i)=>{let xx=p+(w-2*p)*(i/(arr.length-1));let yy=p+(h-2*p)*(1-(x.v-mn)/(mx-mn));return [xx,yy]});let path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');let base='';if(Number.isFinite(+baseline)){let y=p+(h-2*p)*(1-(baseline-mn)/(mx-mn));base='<line x1="0" x2="240" y1="'+y+'" y2="'+y+'" stroke="#d1d5db" stroke-dasharray="3 3"/>'}return '<svg viewBox="0 0 240 40" preserveAspectRatio="none">'+base+'<path d="'+path+'" fill="none" stroke="#4f46e5" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';}
function bigChart(arr,baseline){arr=compactSeries(arr);if(arr.length<2)return '<div class="empty">그래프를 그릴 이력이 아직 부족합니다.</div>';let vals=arr.map(x=>+x.v);if(Number.isFinite(+baseline))vals.push(+baseline);let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx+=1;mn-=1}let pad=(mx-mn)*.12;mn-=pad;mx+=pad;let w=820,h=250,l=48,r=16,t=14,b=32;let pts=arr.map((x,i)=>{let xx=l+(w-l-r)*(i/(arr.length-1));let yy=t+(h-t-b)*(1-(x.v-mn)/(mx-mn));return [xx,yy]});let path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');let grid='';for(let i=0;i<5;i++){let y=t+(h-t-b)*i/4;let val=mx-(mx-mn)*i/4;grid+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y+'" y2="'+y+'" stroke="#eef0f3"/><text x="'+(l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#98a2b3">'+fmt(val)+'</text>'}let base='';if(Number.isFinite(+baseline)){let y=t+(h-t-b)*(1-(baseline-mn)/(mx-mn));base='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y+'" y2="'+y+'" stroke="#f59e0b" stroke-dasharray="5 4"/><text x="'+(w-r-2)+'" y="'+(y-5)+'" text-anchor="end" font-size="10" fill="#b45309">기준 '+fmt(baseline)+'</text>'}let labels='';[0,Math.floor((arr.length-1)/2),arr.length-1].forEach(i=>{let x=l+(w-l-r)*(i/(arr.length-1));labels+='<text x="'+x+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" fill="#98a2b3">'+arr[i].d.slice(5)+'</text>'});return '<svg viewBox="0 0 820 250" preserveAspectRatio="none">'+grid+base+'<path d="'+path+'" fill="none" stroke="#4f46e5" stroke-width="3" vector-effect="non-scaling-stroke"/>'+labels+'</svg>';}
function meta(id){return (S.view.items||{})[id]||null}
function item(id){return (S.macro.items||[]).find(x=>x.id===id)}
function deltaClass(v){return v>0?'up':v<0?'down':''}
function renderCard(r,m){let b=m.benchmark;let baseline=b&&Number.isFinite(+b.value)?+b.value:null;let d=r.change_pct;let q=m.quality==='review'?'<span class="badge review">검토 필요</span>':'';return '<div class="card" onclick="openModal(\''+r.id+'\')"><div class="card-top"><div class="name">'+esc(r.name)+'</div><div><span class="badge '+esc(m.role)+'">'+esc(m.role)+'</span>'+q+'</div></div><div class="metric"><span class="value">'+fmt(r.value)+'</span><span class="unit">'+esc(r.unit)+'</span>'+(d!==null&&d!==undefined?'<span class="delta '+deltaClass(d)+'">'+(d>0?'▲ ':d<0?'▼ ':'')+Math.abs(d).toFixed(2)+'%</span>':'')+'</div><div class="benchmark">'+(b?esc(b.label||('기준 '+b.value)):'고정 중립값 없음 · 방향과 추세 중심')+'</div><div class="spark">'+sparkSvg(histFor(r.id),baseline)+'</div><div class="meaning">'+esc(m.meaning)+'</div>'+(m.warning?'<div class="warn">⚠ '+esc(m.warning)+'</div>':'')+'<div class="meta"><span>기준일 '+esc(r.as_of||'—')+'</span><span>주기 '+esc(m.schedule||cycle(r.cycle))+'</span><span>수집 '+esc((r.collected_at||'').replace('T',' ').slice(0,16)||'—')+'</span><span>'+(r.error?'오류 있음':r.pending?'미설정':'데이터 정상')+'</span></div></div>'}
function render(){let host=$('#groups');let groups=(S.view.groups||[]).filter(g=>S.tab==='all'||g.country===S.tab).sort((a,b)=>a.order-b.order);host.innerHTML=groups.map(g=>{let ids=Object.entries(S.view.items||{}).filter(([id,m])=>m.group===g.id).sort((a,b)=>(a[1].priority||9)-(b[1].priority||9));let cards=ids.map(([id,m])=>{let r=item(id);return r?renderCard(r,m):''}).filter(Boolean).join('');if(!cards)return '';return '<section class="group"><div class="group-head"><h2>'+esc(g.title)+'</h2><span class="hint">중요한 순 · 카드를 누르면 상세 그래프</span></div><div class="grid">'+cards+'</div></section>'}).join('')||'<div class="empty">표시할 지표가 없습니다.</div>';renderSummary();}
function renderSummary(){let changed=(S.macro.items||[]).map(r=>({r,m:meta(r.id)})).filter(x=>x.m&&x.r.change_pct!==null&&x.r.change_pct!==undefined).sort((a,b)=>Math.abs(b.r.change_pct)-Math.abs(a.r.change_pct));let top=changed.slice(0,6);$('#changes').innerHTML=top.map(x=>'<button class="change-chip" onclick="openModal(\''+x.r.id+'\')">'+esc(x.r.name)+' '+(x.r.change_pct>0?'▲':'▼')+Math.abs(x.r.change_pct).toFixed(2)+'%</button>').join('');if(top.length){$('#headline').textContent=top[0].r.name+' 변화가 가장 큼';$('#headlineDesc').textContent='단순 등락률 기준입니다. 중요도와 경제적 의미는 아래 그룹에서 함께 확인하세요.'}function countryState(c){let ms=Object.values(S.view.items||{}).filter(m=>m.group&&m.group.startsWith(c+'_')&&m.priority===1);let ids=Object.entries(S.view.items||{}).filter(([id,m])=>ms.includes(m)).map(x=>x[0]);let ok=ids.map(item).filter(x=>x&&x.value!==null&&!x.error).length;return ok+'/'+ids.length+' 핵심신호 정상'}$('#usState').textContent=countryState('us');$('#krState').textContent=countryState('kr');$('#usDesc').textContent='성장·물가·고용·금리·시장확인을 분리';$('#krDesc').textContent='성장·수출·물가·금리·환율·시장확인을 분리';}
function openModal(id){let r=item(id),m=meta(id);if(!r||!m)return;let b=m.benchmark,baseline=b&&Number.isFinite(+b.value)?+b.value:null;$('#mTitle').textContent=r.name+'  '+fmt(r.value)+(r.unit||'');$('#mSub').textContent='기준일 '+(r.as_of||'—')+' · 수집 '+((r.collected_at||'').replace('T',' ').slice(0,16)||'—')+' · '+cycle(r.cycle);$('#mChart').innerHTML=bigChart(histFor(id),baseline);$('#mMeaning').textContent=m.meaning||'';$('#mDirection').textContent='↑ '+(m.up||'')+'  /  ↓ '+(m.down||'');let links=[];if(m.source_url)links.push('<a href="'+m.source_url+'" target="_blank" rel="noopener">공식/원자료 ↗</a>');if(m.schedule_url)links.push('<a href="'+m.schedule_url+'" target="_blank" rel="noopener">발표 일정 ↗</a>');$('#mLinks').innerHTML=links.join('');$('#modalBg').classList.add('on')}
function closeModal(){$('#modalBg').classList.remove('on')}
$$('.tabs button[data-tab]').forEach(b=>b.onclick=()=>{$$('.tabs button[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;render()});
Promise.all([fetch('facts/macro.json?t='+Date.now()).then(r=>r.json()),fetch('facts/macro_history.json?t='+Date.now()).then(r=>r.json()),fetch('data/macro_view.json?t='+Date.now()).then(r=>r.json()),fetch('data/indicators.json?t='+Date.now()).then(r=>r.json()),fetch('analysis/calendar.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([macro,hist,view,ind,calendar])=>{S.macro=macro;S.hist=hist;S.view=view;S.ind=ind;S.calendar=calendar;$('#status').textContent='최근 수집 '+((macro.collected_at||'').replace('T',' ').slice(0,16)||'—')+' · '+macro.ok+'/'+macro.total+' 정상';render()}).catch(e=>{$('#status').textContent='불러오기 실패';$('#groups').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>'});
</script>
</body>
</html>
