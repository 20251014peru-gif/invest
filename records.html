<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>투자 기록보관실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ══════════════════════════════════════════════════════════
   🗂 투자 기록보관실  v7.25-0911-1228
   업무일지(worklog)와 한눈에 구분되도록 네이비×골드 테마로 짰다.
   업무일지의 8뷰 엔진(카드·표·보드·달력)을 새 창고(records)에
   맞게 다시 짠 것 — worklog_entries 와는 완전히 분리된 컬렉션.
   v5: 투자두뇌 구조 원칙 12~15번 절차로 추가 — ① 검증상태(verifyState) 필드+배지+필터
   ② idea 기록에 시나리오(상승/중립/하락 + 공통사실, scenariosSetAt로 최초저장시각 보존)
   v6: ① 반복 체크리스트(records_meta/checklist_templates) — 항목관리(순서·이름수정·일시중지·삽입)
   + 매일 자동생성(중복방지) + 최근14일 이력표 ② 액션 필드 자유텍스트→단일선택 칩+기타입력
   ③ 달력에 체크예정일(🔔) 표시 ④ 필터해제 버튼 — 필터 없을 땐 숨김
   v7: ① 반복 체크리스트 월~금만 자동생성(주말 제외) ② 종목/상태 필터 칩 세로쌓임 버그 수정
   + 종목 6개 넘으면 더보기/접기 토글 ③ 툴바를 아이콘줄/필터칩줄 2줄로 분리(중간에 걸치던 문제)
   ④ 달력 🔔 — 제목을 칸 안에 바로 표시, 클릭 시 전체기록 대신 그날 요약(기록+확인할 것) 팝업
   v7.1: 투자두뇌 구조 원칙 12~15번 절차로 추가 — ① 종목 상세(정보 누적) — 종목관리에서 이름 클릭 →
   목표가·보유수량·매수단가·상태 + 투자논지 이력(날짜별로 쌓임, 값 바뀌면 자동으로 한 줄 기록) + 관련
   기록 목록 ② 뉴스레이더 등 다른 앱에서 "?import=news&title=..." 로 넘어오면 + 기록 추가 모달에
   미리 채워서 엶(자동저장 없음 — 반드시 확인 후 직접 저장)
   v7.2: 실사용(모바일) 피드백 반영 — ① 달력 기록제목(.evt) 줄바꿈 안 돼 옆칸까지 침범하던 문제
   수정(가로로 안 넘치고 세로로 늘어남) ② 팝업 텍스트가 세로 한 글자씩 쌓이는 문제 방어— 모달 중앙정렬을
   flex 대신 block+margin auto 방식으로 교체(iOS 사파리 flex+overflow 크기계산 버그 회피) + 텍스트에
   overflow-wrap 안전장치 추가 ③ kind탭·보기아이콘·종목칩 3줄을 하나의 흐르는 줄로 통합(공간 있으면
   한 줄, 좁으면 자연스럽게 다음 줄로) ④ 체크리스트를 세로 목록 대신 가로 4열 그리드로 ⑤ 종목 필터칩에
   ⓘ 버튼 추가 — 눌러야 정보 누적 모달(v7.1)이 열림(칩 클릭은 필터링 유지, 서로 안 섞이게 분리)
   v7.3: v7.2의 "팝업 세로 텍스트" 재발 확인 후 진짜 원인 발견 — .checkItem 안의 .kk(아이콘+원본
   기록제목)에 폭 제한이 없어서, 기록 제목이 길면 .kk가 거의 모든 폭을 차지하고 .tt가 0px로 눌려
   그 안 글자가 세로로 쌓였음(v7.2의 overflow-wrap 안전장치가 오히려 이 증상을 드러냄).
   .kk를 줄바꿈 허용+최대폭 38%로 묶어서 .tt가 항상 넉넉한 폭을 갖도록 수정 — 실제 데이터(긴 유튜브
   제목)로 재현 후 확인함
   v7.4: ① 달력 🔔 확인예정 칩(.chkEvt)도 .evt처럼 줄바꿈되게 — nowrap+ellipsis라 셀 폭이
   내용에 맞춰 억지로 넓어지던 문제(grid 1fr에 minmax(0,1fr) 추가로 근본 차단) ② 종목칩의 ⓘ 버튼을
   원형 배지로 키움 — 있는지도 몰랐다는 피드백 반영 ③ 종목 상세에 "추가 정보" 섹션 신설 — 목표가·
   보유수량·매수단가 외에 원하는 항목(PER, 섹터, 손절가 등)을 이름 붙여 자유롭게 추가/삭제, 값이
   바뀌면 투자논지 이력에 자동 기록
   v7.5: "정보 넣는 창" 역할을 더 분명하게 — ① 종목 상세: "추가 정보"를 맨 위·항상 보이는 자리로
   옮기고, 상태·목표가·보유수량·매수단가는 details(기본 접힘)로 내림 — 다 채우는 항목이 아니므로
   ② 자주 쓰는 항목명을 칩으로 눌러서 바로 채워지게(타이핑 없이) — 이미 추가한 이름은 칩에서 빠짐
   ③ 종목별 보드 위에 종류탭과 같은 방식의 탭 줄 추가 시도 — **v7.6에서 "보드 안 말고 새 탭으로"
   피드백 받아 이 부분만 되돌리고 v7.6의 독립 탭으로 재구현**
   v7.6: ① "🏷 종목" 을 독립된 보기 탭으로 신설(v7.5의 보드 안 탭 시도는 되돌림) — "전체"에서는
   등록된 종목 이름만 카드로 나열(정보 유무 배지만 표시), 종목 하나를 고르면 그 종목 기록 리스트 +
   "📋 정보 보기/입력" 버튼(종목상세 모달로 바로 진입) ② 추가정보 프리셋 칩을 배당수익률·동종업계
   비교 같은 "지표성" 항목에서 매수사유·핵심가정·반증조건·촉매·확신도·매도조건·재평가시점 등
   "나중에 판단을 복기할 때 도움되는" 항목으로 전면 교체
   v7.7: v7.6에서 만든 "🏷" 아이콘이 실제로는 너무 작고 색도 없어서(윈도우 크롬에서 얇은 회색
   윤곽선으로만 보임) "종목탭이 없는데?"라는 피드백 받음 — 다른 보기 아이콘(카드/리스트/표…)은
   그대로 정사각형 아이콘만 쓰되, 이 버튼만 "🏷 종목" 글자를 같이 보여줘서 확실히 눈에 띄게 수정
   v7.8: "종목"의 자리를 다시 옮김 — 보기 아이콘 줄이 아니라 **종류탭(#ktabs)에 뉴스와 아이디어
   사이 하나의 탭으로**(전체·유튜브·뉴스·🏷종목·아이디어·차트·메모, 총 7개 탭). 실제 kind 값은
   아니고 누르면 curView가 'stock'으로 바뀌는 특수 탭 — 다시 누르거나 다른 탭을 누르면 누르기
   직전 보기로 돌아감(v7.7의 보기아이콘 줄 버튼은 제거)
   ══════════════════════════════════════════════════════════ */
:root{
  --navy-900:#514936; --navy-800:#5c5340; --navy-700:#6b6049; --navy-600:#8a7d5e;
  --gold:#d4ad32; --gold-dk:#b59022; --gold-lt:#f8efd0; --gold-soft:#fff8e5; --champagne:#f4ead0;
  --bg:#fbfaf5; --card:#fff; --line:#ebe4d3; --line2:#f1ecdf;
  --txt:#2f2f2c; --sub:#77736a; --sub2:#a49c88;
  --k-youtube:#2c5f8a; --k-news:#0f766e; --k-idea:#9c7c17; --k-chart:#8a3a3a; --k-memo:#64748b;
  --good:#2f7d5c; --warn:#b23b3b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:inherit}
::selection{background:var(--gold-lt)}

/* ── 헤더 ── */
.topbar{background:linear-gradient(90deg,#fffaf0,#f5e8bf);color:#3c3527;padding:11px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #e5d7af}
.topbar h1{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.topbar .ver{font-size:11px;color:#9a8a5c;font-weight:600}
.topbar .sp{flex:1}
.topbar .search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.65);border:1px solid #e0d3a6;border-radius:10px;padding:7px 14px;font-size:13px;color:#6b6049;min-width:240px}
.topbar .search input{background:transparent;border:0;outline:0;color:#3c3527;font-size:13px;width:100%}
.topbar .search input::placeholder{color:#a89a6e}
.topbar .navbtn{background:#fffdf8;border:1px solid #e5d7af;color:#5c5340;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.topbar .navbtn:hover{background:#f8efd0}
.topbar .navbtn.gold{background:var(--gold);color:#3c3527;border-color:var(--gold)}
.topbar .stat{font-size:11.5px;color:#8a7d5e}

.wrap{max-width:1920px;margin:0 auto;padding:16px 22px 70px}

/* ── 오늘의 체크리스트 위젯 ── */
.today{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(11,29,51,.05)}
.today .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.today .hd b{font-size:15px;font-weight:800}
.today .hd .dd{font-size:12px;color:var(--sub)}
.today .hd .sp{flex:1}
.today .hd .streak{font-size:12px;color:var(--gold-dk);font-weight:700;background:var(--gold-lt);border-radius:999px;padding:3px 10px}
/* v7.11: 카드 헤더의 ✏️(항목편집)/⋯(더보기) 버튼 — 참고 이미지의 날짜카드 우상단 버튼 자리를 재현.
   기존에 .col h4 안에 있던 "⚙ 항목관리"/"🗂 지난 기록"이 여기로 옮겨온 것(id는 그대로라 동작 그대로) */
.today .hd .iconbtn{border:0;background:#f4f2ea;color:var(--sub);width:28px;height:28px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.today .hd .iconbtn:hover{background:#ece9dc;color:var(--navy-700)}
.today .hd .menuWrap{position:relative}
.today .hd .menuPop{display:none;position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(11,29,51,.14);padding:6px;min-width:130px;z-index:20}
.today .hd .menuPop.on{display:block}
.today .hd .menuPop button{width:100%;text-align:left;border:0;background:none;padding:8px 9px;font-size:12.5px;border-radius:7px;cursor:pointer;color:var(--txt)}
.today .hd .menuPop button:hover{background:#f5f3ec}
.today .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.today .cols{grid-template-columns:1fr}}
.today .col h4{font-size:12px;color:var(--sub);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
/* v7.2: 세로 목록 대신 가로 4열 그리드로 — 화면이 좁아지면 2열→1열로 자동 축소 */
#todoList{display:block}  /* v7.25: 부모가 4열 grid라 1행/2행 div가 좌우로 놓이던 것 → block으로 위아래 2행 */
@media(max-width:1100px){#todoList{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){#todoList{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){#todoList{grid-template-columns:1fr}}
.todoRow{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid #f2f0e7;border-radius:9px;min-width:0}
.todoRow input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy-600);flex:0 0 auto;cursor:pointer}
/* v7.11: 반복 항목에 지정된 아이콘을 색 배지로 — 참고 이미지의 체크박스 옆 아이콘 배지 자리.
   반복이 아닌(일회성) 오늘 할 일은 배지 없이 기존 그대로(빨리 적고 끝내는 흐름을 방해하지 않으려 배지 강제 안 함) */
.todoRow .badge2{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.todoRow .t{flex:1;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.todoRow.done .t{color:var(--sub2);text-decoration:line-through}
.todoRow .x{border:0;background:none;color:#c9b8b8;font-size:12px;cursor:pointer;padding:2px 6px;flex:0 0 auto}
.todoRow .x:hover{color:var(--warn)}
.todoAdd{display:flex;gap:7px;margin-top:8px}
.todoAdd input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;outline:0}
.todoAdd input:focus{border-color:var(--navy-600)}
.todoAdd button{background:var(--navy-700);color:#fff;border:0;border-radius:8px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer}
.checkItem{display:flex;align-items:flex-start;gap:9px;padding:7px 2px;border-bottom:1px solid #f2f0e7;cursor:pointer;min-width:0}
.checkItem:last-child{border-bottom:0}
.checkItem .dot{width:8px;height:8px;border-radius:999px;flex:0 0 auto;margin-top:5px}
/* v7.2: 글자가 세로로 한 자씩 쌓이는 걸 방지 — min-width:0으로 flex가 억지로 안 줄어드는 문제 차단 +
   overflow-wrap으로 한 줄이 너무 길면 정상적으로 줄바꿈되게(칸이 극단적으로 좁아져도 안전) */
.checkItem .tt{flex:1;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
/* v7.2.1: 진짜 원인 발견 — .kk(아이콘+원본기록 제목)에 폭 제한이 없어서 제목이 길면 .kk가
   거의 모든 공간을 차지하고 .tt가 0px로 눌려서 그 안의 글자가 세로로 한 자씩 쌓였던 것.
   .kk를 접이식(줄바꿈 허용 + 최대폭 38%)으로 묶어서 .tt가 항상 넉넉한 공간을 갖게 함 */
.checkItem .kk{font-size:10.5px;color:var(--sub2);flex:0 1 auto;max-width:38%;text-align:right;overflow-wrap:anywhere}
.emptyMini{font-size:12.5px;color:var(--sub2);padding:8px 2px}

/* ── kind 탭 ── */
.ktab{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:700;color:#5b5646;display:flex;align-items:center;gap:7px;cursor:pointer}
.ktab .n{font-weight:800;color:var(--sub2)}
.ktab.on{background:#f2df9c;color:#463c24;border-color:#d7b442}
.ktab.on .n{color:#6b5a1e}

/* ── v7.2: kind탭 · 보기아이콘 · 개수 · 버튼 · 종목/상태 칩을 하나의 흐르는 줄로 통합 ──
   예전엔 3줄(ktabs / viewbarRow1 / viewbarRow2)로 억지로 나눠져 있었는데, 화면이 넓으면 한 줄에
   다 들어가고 좁으면 자연스럽게 다음 줄로 넘어가도록 flex-wrap 하나로 합침.
   #ktabs·#stockPicker·#verifyPicker는 display:contents로 "껍데기"를 없애서 안에 든 칩들이
   .toolbar 의 같은 flex 줄에 직접 놓이게 한다(칩 하나하나가 이 줄의 flex 아이템이 됨) */
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar #ktabs,.toolbar #stockPicker,.toolbar #verifyPicker,.toolbar #topicPicker,.toolbar #starPicker,.toolbar #channelPicker{display:contents}
.toolbar #cntLabel{margin-left:auto}
.viewicons{display:flex;gap:4px;background:#f1efe6;border-radius:8px;padding:3px}
.vicon{width:36px;height:31px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14.5px;color:var(--sub);border:0;background:none;cursor:pointer}
.vicon.on{background:#fff;color:var(--navy-700);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fchip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:#555;background:#fff;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fchip.on{background:#f2df9c;color:#463c24;border-color:#d7b442}
.fchip.moreBtn{background:#f7f6f0;color:var(--sub);border-style:dashed}
/* v7.2: 종목 필터칩 안의 ⓘ — 누르면 정보 누적(종목 상세) 모달이 열림. 칩 클릭(필터링)과 안 섞이게
   클릭 시 stopPropagation 처리(JS 쪽) */
/* v7.4: 있는지도 모르겠다는 피드백 반영 — 작은 글자가 아니라 눈에 띄는 원형 배지 버튼으로 */
.fchipInfo{border:0;background:#eef1f5;color:var(--navy-700);font-size:12px;cursor:pointer;line-height:1;font-weight:800;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-left:1px}
.fchip.on .fchipInfo{background:rgba(255,255,255,.3);color:#fff}
.fchipInfo:hover{background:var(--gold-lt);color:var(--gold-dk)}
.addbtn{background:var(--gold);color:var(--navy-900);border:0;border-radius:9px;padding:9px 17px;font-size:13.5px;font-weight:800;cursor:pointer}
.mgrbtn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
.cnt{font-size:12.5px;color:var(--sub);font-weight:700}

/* ── v5: 검증상태 배지·필터 / 시나리오 3분기 (투자두뇌 구조 4·5번 원칙) ── */
.vbadge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:800;color:#fff;white-space:nowrap}
.scenGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:700px){.scenGrid{grid-template-columns:1fr}}
.scenCol{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fbfaf5}
.scenCol b{display:block;margin-bottom:6px;font-size:12px}
.scenCol textarea{width:100%;min-height:56px;margin-bottom:6px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;outline:0;resize:vertical}
.scenCol input{width:100%;margin-bottom:6px;border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;outline:0}
.pg-scen{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.pg-scen .commonFacts{font-size:12.5px;color:var(--sub);margin-bottom:8px;white-space:pre-wrap}

/* ── v6: 체크리스트 항목관리 / 액션 칩 / 이력표 / 달력 체크마커 ── */
.mgrbtn.tiny{padding:3px 9px;font-size:10.5px;border-radius:7px;margin-left:6px;font-weight:700}
.col h4{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.actionPick{display:flex;gap:6px;flex-wrap:wrap}
.actionChip{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;color:#555;cursor:pointer}
.actionChip.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
.tmplList{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.tmplRow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}
.tmplRow.paused{opacity:.5}
.tmplRow.dragOver{border-color:var(--navy-600);border-style:dashed}
.tmplRow .drag{cursor:grab;color:var(--sub2);font-size:14px;flex:0 0 auto}
/* v7.11: 항목마다 아이콘+색 배지 — 눌러서 아래 .tmplIconEdit 펼침(이모지 직접 입력 + 색 6가지 중 선택) */
.tmplRow .iconPick{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto;cursor:pointer;border:1px solid transparent}
.tmplRow .iconPick:hover{border-color:var(--navy-600)}
.tmplIconEdit{display:none;align-items:center;gap:7px;padding:6px 0 6px 34px;flex-wrap:wrap}
.tmplIconEdit.on{display:flex}
.tmplIconEdit input{width:52px;text-align:center;border:1.5px solid var(--navy-600);border-radius:7px;padding:4px;font-size:15px;font-family:inherit;outline:0}
.tmplColorDot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.tmplColorDot.on{border-color:var(--navy-800)}
.tmplRow .tmplText{flex:1;font-size:13px;cursor:text;padding:3px 4px;border-radius:5px}
.tmplRow .tmplText:hover{background:#f5f3ec}
.tmplRow .tmplText input{width:100%;border:1.5px solid var(--navy-600);border-radius:5px;padding:4px 6px;font-size:13px;font-family:inherit;outline:0}
.tmplRow button{border:0;background:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:6px;flex:0 0 auto}
.tmplRow button:hover{background:#f0eee4}
.tmplRow .rm:hover{color:var(--warn)}
.tmplInsertRow{display:none;gap:6px;padding:4px 0 4px 22px}
.tmplInsertRow.on{display:flex}
.tmplInsertRow input{flex:1;border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;outline:0}
.histTable{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.histTable th,.histTable td{border:1px solid var(--line2);padding:5px 6px;text-align:center;white-space:nowrap}
.histTable th{background:#f7f5ef;font-weight:700;color:var(--sub)}
.histTable td.dateCol{text-align:left;color:var(--sub);font-weight:700}
.calChk{display:inline-block;font-size:10px;margin-left:3px;cursor:pointer}
/* v6.1: 달력 확인예정 칩 — .evt(기록 제목 칩)와 같은 자리에, 다른 색으로 제목까지 바로 보이게 */
/* v7.4: .evt와 똑같이 줄바꿈 — nowrap+ellipsis였을 때 셀이 내용 길이에 맞춰 옆으로 넓어지던 문제 수정 */
.chkEvt{display:block;font-size:10.3px;font-weight:700;border-radius:5px;padding:2px 5px;margin-bottom:3px;line-height:1.35;cursor:pointer;color:#7a5b00;background:#fff3cc;border:1px solid #f0dc93;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
.dayPopSec{margin-bottom:14px}
.dayPopSec:last-child{margin-bottom:0}
.dayPopSec h5{font-size:12px;color:var(--sub);margin:0 0 6px;font-weight:800}

/* ── 날짜 그룹 ── */
.day{display:flex;align-items:baseline;gap:10px;margin:18px 2px 10px}
.day h2{font-size:14px;color:var(--navy-800);font-weight:800}
.day span{font-size:11.5px;color:var(--sub2)}
.day:after{content:'';flex:1;height:1px;background:var(--line)}

/* ── 카드보기 ── */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1700px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:1400px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.rcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--k-youtube);border-radius:10px;padding:12px 13px 11px;position:relative;box-shadow:0 1px 2px rgba(11,29,51,.04);cursor:pointer}
.rcard:hover{box-shadow:0 6px 16px rgba(11,29,51,.09);transform:translateY(-1px)}
.rcard.news{border-left-color:var(--k-news)} .rcard.idea{border-left-color:var(--k-idea)} .rcard.chart{border-left-color:var(--k-chart)} .rcard.memo{border-left-color:var(--k-memo)}
.rcard .del{position:absolute;top:9px;right:9px;background:#fbeaea;color:#b23b3b;border:0;border-radius:7px;width:23px;height:23px;font-size:11px;cursor:pointer}
.rcard .kind{font-size:10.5px;font-weight:800;color:var(--k-youtube);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.rcard.news .kind{color:var(--k-news)} .rcard.idea .kind{color:var(--k-idea)} .rcard.chart .kind{color:var(--k-chart)} .rcard.memo .kind{color:var(--k-memo)}
.rcard .star{color:var(--gold)}
.rcard .title{font-weight:700;font-size:13.5px;line-height:1.4;padding-right:20px;margin-bottom:5px;min-height:38px}
.rcard .oneLine{font-size:11.5px;color:var(--sub);line-height:1.4;margin-bottom:7px}
.rcard .stocks{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.rcard .stag{font-size:10.5px;background:var(--gold-lt);color:var(--gold-dk);border-radius:6px;padding:1.5px 7px;font-weight:700}
/* 카드가 아닌 곳(리스트·타임라인)에서도 쓰는 종목칩 — .rcard 밖이라 별도로 둔다 */
.stocks{display:flex;gap:4px;flex-wrap:wrap}
.stag{font-size:10.5px;background:var(--gold-lt);color:var(--gold-dk);border-radius:6px;padding:1.5px 7px;font-weight:700;display:inline-block}
.rcard .dt{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--sub2);background:#f4f2ea;border-radius:6px;padding:2px 7px}
.rcard .re{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--warn);font-weight:700;margin-top:7px}
.rcard .lk{font-size:10.5px;color:var(--navy-600);font-weight:700;margin-top:6px;display:inline-block}

/* ── 표보기 ── */
table.rt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.rt th{text-align:left;font-size:11.5px;color:#8a6f22;font-weight:800;padding:9px 12px;background:#faf4df;border-bottom:1px solid #e6d6a8}
table.rt td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f2f0e7;vertical-align:top;cursor:pointer}
table.rt tr:hover td{background:#fffaf0}
.colrz{position:absolute;top:0;right:-5px;width:11px;height:100%;cursor:col-resize;user-select:none;z-index:2}
.colrz::after{content:"";position:absolute;top:18%;right:5px;width:2px;height:64%;background:#e6d6a8;border-radius:2px}
.colrz:hover::after{background:var(--gold);width:4px;right:4px}
table.rt tr:last-child td{border-bottom:0}
table.rt .k{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 8px;color:#fff}
.k.youtube{background:var(--k-youtube)} .k.news{background:var(--k-news)} .k.idea{background:var(--k-idea)} .k.chart{background:var(--k-chart)} .k.memo{background:var(--k-memo)}
table.rt .stag2{font-size:11px;background:var(--gold-lt);color:var(--gold-dk);border-radius:6px;padding:1px 7px;font-weight:700;margin-right:3px;display:inline-block}
table.rt .re2{color:var(--warn);font-weight:700;font-size:12px}

/* ── 보드(종목별)보기 ── */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.bcol{flex:0 0 280px;background:#f4f2ea;border-radius:14px;padding:12px}
.bcol .bhd{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px}
.bcol .bhd b{font-size:13.5px}
.bcol .bhd .n{font-size:11px;background:#fff;border-radius:999px;padding:2px 8px;color:var(--sub);font-weight:700}
.bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.bcard:hover{box-shadow:0 4px 10px rgba(11,29,51,.09)}
.bcard .kk{font-size:10px;font-weight:800;margin-bottom:4px}
.bcard .tt{font-size:12.5px;font-weight:700;line-height:1.4}
.bcard .dd{font-size:10.5px;color:var(--sub2);margin-top:5px}

/* ── 종목보기(v7.10) — "🏷 종목" 탭이 켜지면 #viewicons(카드/리스트/표/보드/채널별/달력/타임라인/갤러리)가
   레코드 대신 "종목 목록 자체"를 그 방식으로 보여줌(stockCardHTML 등, records2 참고). 카드가 기본형 */
.stockDirGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stockDirCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.stockDirCard:hover{box-shadow:0 4px 10px rgba(11,29,51,.09);border-color:var(--navy-600)}
.stockDirCard .nm{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:8px}
.stockDirCard .nm .n{font-size:11px;background:#f4f2ea;border-radius:999px;padding:2px 9px;color:var(--sub);font-weight:700}
.stockDirCard .badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;display:inline-block}
.stockDirCard .badge.관심{background:#eef3f8;color:var(--navy-700)}
.stockDirCard .badge.보유{background:var(--gold-lt);color:var(--gold-dk)}
.stockDirCard .badge.청산{background:#f2f0e7;color:var(--sub)}
.stockFocusHd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.stockFocusHd .infoBtn{background:var(--navy-800);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer}

/* ── 캘린더보기 ── */
.cal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhd b{font-size:17px}
.calhd .nav{display:flex;gap:6px}
.calhd .nav button{border:1px solid var(--line);border-radius:8px;width:30px;height:30px;background:#fff;font-size:13px;color:var(--sub);cursor:pointer}
/* v7.4: 1fr만 쓰면 칸 안의 줄바꿈 안 되는 내용이 있을 때 그 칸의 최소폭이 내용 크기로 벌어져
   그리드 전체가 삐뚤어짐(minmax(0,1fr)로 각 칸의 최소폭을 0으로 고정해서 항상 균등하게 유지) */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calgrid .dow{text-align:center;font-size:11.5px;color:var(--sub2);font-weight:800;padding-bottom:6px}
.calgrid .cell{min-height:98px;border-radius:9px;padding:6px 7px;font-size:12px;background:#fbfaf6;border:1px solid #f2f0e7}
.calgrid .cell.dim{background:transparent;border-color:transparent;color:#ccc}
.calgrid .cell.today{border-color:var(--navy-600);background:#eef3f8}
.calgrid .cell .num{font-weight:800;font-size:12.5px;margin-bottom:4px;display:block}
.calgrid .cell.today .num{color:var(--navy-700)}
/* v7.2: 제목이 안 끊기고 옆 칸까지 침범하던 문제 — 강제로 줄바꿈해서 칸 안에서 세로로만 늘어나게 */
.evt{display:block;font-size:10.3px;font-weight:700;border-radius:5px;padding:2px 5px;margin-bottom:3px;line-height:1.35;cursor:pointer;color:#fff;max-width:100%;overflow-wrap:anywhere;word-break:break-word}

/* ── 리스트(줄)보기 ── */
.rlist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #f2f0e7;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#fbfaf6}
.lrow .dot2{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
.lrow .dt3{font-size:11px;color:var(--sub2);flex:0 0 62px}
.lrow .tt3{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ol3{font-size:11.5px;color:var(--sub);flex:0 1 32%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .st3{display:flex;gap:4px;flex:0 0 auto}
.lrow .re3{font-size:10.5px;color:var(--warn);font-weight:700;flex:0 0 auto}

/* ── 채널별보기 (board 재사용) ── */
.chcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chcard:hover{box-shadow:0 4px 10px rgba(11,29,51,.09)}

/* ── 타임라인보기 ── */
.tl{position:relative;padding-left:26px;max-width:820px}
.tl:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line2)}

.tlItem:hover{box-shadow:0 4px 12px rgba(11,29,51,.08)}
.tlItem:before{content:'';position:absolute;left:-23px;top:16px;width:11px;height:11px;border-radius:999px;background:var(--navy-600);border:2px solid #fff;box-shadow:0 0 0 2px var(--line2)}
.tlItem .tlHd{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:var(--sub2);font-weight:700}
.tlItem .tlTitle{font-size:14px;font-weight:700;margin-bottom:3px}
.tlItem .tlSub{font-size:12px;color:var(--sub)}

/* ── 갤러리보기 ── */
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.galcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(11,29,51,.05)}
.galcard:hover{box-shadow:0 8px 20px rgba(11,29,51,.12);transform:translateY(-2px)}
.galcard .cover{height:92px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}

.galcard .gk{font-size:10.5px;font-weight:800;margin-bottom:4px}
.galcard .gt{font-size:13px;font-weight:700;line-height:1.4;margin-bottom:5px;min-height:36px}
.galcard .go2{font-size:11px;color:var(--sub)}

/* ── 빈 상태 ── */
.emptyState{padding:60px 20px;text-align:center;color:var(--sub2)}
.emptyState .ei{font-size:34px;margin-bottom:10px}

/* ── 모달 ── */
/* v7.2: 센터 정렬을 flex justify-content 대신 block+margin auto로 — 일부 모바일 브라우저에서
   overflow-y:auto가 있는 flex 컨테이너 + justify-content:center 조합이 자식 너비를 잘못
   계산해(내용 기준 최소폭으로 쪼그라듦) 글자가 세로로 한 자씩 쌓이는 현상이 보고돼 회피 처리 */
.ovwrap{position:fixed;inset:0;background:rgba(11,20,33,.5);z-index:9000;display:none;overflow-y:auto;padding:40px 16px}
.ovwrap.on{display:block}

.modal .mhd{background:var(--navy-800);color:#fff;padding:16px 20px;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:10px;cursor:move;user-select:none}
.modal.dragged{margin:0 !important;position:fixed !important}
.modal .mhd b{font-size:15px}
.modal .mhd .x{margin-left:auto;background:none;border:0;color:#c7d0dc;font-size:18px;cursor:pointer}
.modal .mbody{padding:18px 20px 20px}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.frow input[type=text],.frow input[type=date],.frow input[type=url],.frow textarea,.frow select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;outline:0;font-family:inherit}
.frow input:focus,.frow textarea:focus,.frow select:focus{border-color:var(--navy-600)}
.frow textarea{min-height:80px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kindPick{display:flex;gap:7px;flex-wrap:wrap}
.kindPick button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;color:#555}
.kindPick button.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
.stockTags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stockTag{background:var(--gold-lt);color:var(--gold-dk);border-radius:999px;padding:5px 10px 5px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.stockTag button{border:0;background:none;color:var(--gold-dk);cursor:pointer;font-size:11px}
.stockAdd{display:flex;gap:7px}
.stockAdd input{flex:1}
.stockAdd .go{background:var(--navy-700);color:#fff;border:0;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer}
.starRow{display:flex;gap:4px;font-size:20px;cursor:pointer}
.starRow span{color:#ddd}
.starRow span.on{color:var(--gold)}
.modal .mfoot{display:flex;gap:9px;padding:14px 20px 20px}
.mfoot .save{flex:1;background:var(--navy-800);color:#fff;border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
.mfoot .del2{background:#fbeaea;color:var(--warn);border:0;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:800;cursor:pointer}

/* ── 종목관리 모달 ── */
.stockMgrList{max-height:320px;overflow-y:auto;margin-bottom:12px}
.smRow{display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid #f2f0e7}
.smRow .nm{flex:1;font-size:13.5px;font-weight:600;cursor:pointer}
.smRow .nm:hover{color:var(--navy-700);text-decoration:underline}
.smRow .cnt2{font-size:11px;color:var(--sub2)}
.smRow .rm{border:0;background:none;color:#c9b8b8;cursor:pointer;font-size:12px}
.smRow .rm:hover{color:var(--warn)}
/* v7.1: 종목 상세 모달(정보 누적) */
.sdMetaRow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:10px}
.sdField label{font-size:11.5px;color:var(--sub);font-weight:700;display:block;margin-bottom:3px}
.sdField input,.sdField select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 9px;font-size:13px;font-family:inherit;outline:0}
.thesisLogItem{padding:8px 2px;border-bottom:1px solid #f2f0e7;font-size:12.5px}
.thesisLogItem:last-child{border-bottom:0}
.thesisLogItem .d{font-size:10.5px;color:var(--sub2);font-weight:700;margin-right:6px}
.thesisLogItem.auto{color:var(--sub)}
.saveBtn{background:var(--navy-800);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer}
/* v7.4: 종목 상세 "추가 정보" — 목표가·보유수량·매수단가 외에 자유롭게 이름 붙여 넣는 항목들 */
.cfRow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f2f0e7}
.cfRow label{font-size:11.5px;color:var(--sub);font-weight:700;flex:0 0 auto;min-width:64px;max-width:110px;overflow-wrap:anywhere}
.cfRow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;outline:0}
.cfRow .cfDel{border:0;background:none;color:#c9b8b8;cursor:pointer;font-size:12px;flex:0 0 auto;padding:2px 4px}
.cfRow .cfDel:hover{color:var(--warn)}
.cfAddRow{display:flex;gap:6px;margin-top:8px}
.cfAddRow input{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;outline:0}
.cfAddRow input.cfLabelInp{flex:0 0 110px}
.cfAddRow input.cfValInp{flex:1;min-width:0}
.cfAddRow button{background:var(--navy-700);color:#fff;border:0;border-radius:8px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto}
/* v7.5: 항목명을 매번 타이핑 안 해도 되게 자주 쓰는 이름을 칩으로 — 이미 추가한 이름은 목록에서 빠짐 */
.cfPresets{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.cfPreset{background:#f4f2ea;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11.5px;color:#5b5646;cursor:pointer;font-weight:700}
.cfPreset:hover{background:var(--gold-lt);color:var(--gold-dk);border-color:var(--gold-dk)}
/* v7.5: 상태·목표가·보유수량·매수단가는 다 채우는 게 아니라서 기본은 접어두고, 필요할 때만 펼침 */
.sdTradeInfo{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.sdTradeInfo summary{cursor:pointer;padding:11px 0;font-size:12.5px;font-weight:700;color:var(--sub);list-style:none;display:flex;align-items:center;gap:5px}
.sdTradeInfo summary::-webkit-details-marker{display:none}
.sdTradeInfo summary::before{content:'▸';color:var(--sub2);font-size:11px}
.sdTradeInfo[open] summary::before{content:'▾'}
.sdTradeInfo[open]{padding-bottom:14px}
.sdTradeInfo .frow2{margin-top:10px}

/* ── 체크 캘린더 편집 줄 ── */
.checkRow{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:7px;margin-bottom:7px;align-items:center}
@media(max-width:560px){.checkRow{grid-template-columns:1fr;gap:6px}}
.checkRow input{border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:0;font-family:inherit}
.checkRow input:focus{border-color:var(--navy-600)}
.checkRow .rmRow{border:0;background:#fbeaea;color:var(--warn);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:11px}

/* ── 이미지 첨부 ── */
#imgPreviewBox img{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:6px;object-fit:cover}
#imgUploadStatus{font-size:11.5px;color:var(--sub);margin-top:5px}
#imgUploadStatus.err{color:var(--warn)}
.galcard .cover img{width:100%;height:100%;object-fit:cover}

/* ── 페이지 보기(노션식 읽기 화면) ── */
.pageModalBox .mbody{padding:22px 26px 10px}
.pg-oneliner{background:var(--gold-lt);border:1px solid #e8d9a6;border-radius:12px;padding:14px 16px;font-size:14.5px;font-weight:700;color:#5a4712;margin-bottom:16px;line-height:1.5}
.pg-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.pg-meta .m1{font-size:12px;background:#f4f2ea;border-radius:8px;padding:5px 11px;color:var(--sub);font-weight:700}
.pg-meta .m1.action{background:var(--navy-800);color:#fff}
.pg-meta .m1.stars{color:var(--gold-dk);background:var(--gold-lt)}
.pg-meta a.m1{text-decoration:none;color:var(--navy-700);background:#eaf1f8}
.pg-stocks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pg-body{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:#2a3140;background:#fbfaf6;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;max-height:46vh;overflow-y:auto}
.pg-body:empty::before{content:'아직 본문이 없어요';color:var(--sub2)}
.pg-checktbl{width:100%;border-collapse:collapse;margin-bottom:10px}
.pg-checktbl th{font-size:11px;color:var(--sub);text-align:left;padding:6px 8px;background:#f4f2ea}
.pg-checktbl td{font-size:12.5px;padding:7px 8px;border-bottom:1px solid #f2f0e7;vertical-align:top}
.pg-h4{font-size:12px;font-weight:800;color:var(--sub);margin:4px 0 8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>

<div class="ovwrap" id="stockDetailModal">
  <div class="modal" style="max-width:560px">
    <div class="mhd"><b id="sdName">종목명</b><button class="x" id="sdClose">✕</button></div>
    <div class="mbody">

           추가 정보를 맨 위 · 항상 보이게, 상태/목표가/보유수량/매수단가는 아래로 접어둠 -->
      <div class="frow">
        <label>🗂 핵심 정보 — 이름 붙여 자유롭게 추가하세요 (예: PER, 섹터, 손절가…)</label>
        <div id="sdCustomFields"></div>

/* ── KST 시간 (worklog 관행: new Date() 직접 쓰지 않는다) ── */
function kstNow(){
  var now = new Date();
  var utc = now.getTime() + now.getTimezoneOffset()*60000;
  return new Date(utc + 9*3600000);
}
function todayStr(){ return kstNow().toISOString().slice(0,10); }
/* v6: 오늘로부터 n일 전 날짜 문자열 — Date.UTC 고정 연산(KST에서 하루 밀리는 사고 방지) */
function daysAgoStr(n){
  var p = todayStr().split('-');
  var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0,10);
}
function histCutoffStr(){ return daysAgoStr(HIST_DAYS-1); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._tm); toast._tm=setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* ══════════════════════════════════════════════════════════
   모달 이동(드래그) — 제목줄을 잡고 끌면 모달이 화면 위에서 움직인다
   ══════════════════════════════════════════════════════════ */
function resetModalPos(modalEl){
  if(!modalEl) return;
  modalEl.classList.remove('dragged');
  modalEl.style.left = ''; modalEl.style.top = ''; modalEl.style.margin = '';
}
function makeDraggable(modalEl){
  var hd = modalEl.querySelector('.mhd');
  if(!hd) return;
  var dragging=false, sx=0, sy=0, ox=0, oy=0;
  function start(x,y){
    var r = modalEl.getBoundingClientRect();
    dragging=true; sx=x; sy=y; ox=r.left; oy=r.top;
    modalEl.classList.add('dragged');
    modalEl.style.left=ox+'px'; modalEl.style.top=oy+'px';
  }
  function move(x,y){
    if(!dragging) return;
    var nx = Math.max(4, Math.min(window.innerWidth-70, ox+(x-sx)));
    var ny = Math.max(4, Math.min(window.innerHeight-50, oy+(y-sy)));
    modalEl.style.left=nx+'px'; modalEl.style.top=ny+'px';
  }
  function end(){ dragging=false; }
  hd.addEventListener('mousedown', function(e){
    if(e.target.closest('.x')) return;
    start(e.clientX, e.clientY);
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
  document.addEventListener('mouseup', end);
  hd.addEventListener('touchstart', function(e){
    if(e.target.closest('.x')) return;
    var t=e.touches[0]; start(t.clientX, t.clientY);
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!dragging) return;
    var t=e.touches[0]; move(t.clientX, t.clientY);
  }, {passive:true});
  document.addEventListener('touchend', end);
}

var _curEditingAction = ''; // openAdd/openEdit에서 세팅 — applyKindFields가 이 값 기준으로 칩을 그림
function renderActionPick(kind, currentValue){
  var host = document.getElementById('actionPick');
  if(!host) return;
  var opts = ACTION_OPTIONS[kind] || [];
  var matched = opts.indexOf(currentValue) >= 0;
  var html = opts.map(function(o){
    return '<span class="actionChip'+(currentValue===o?' on':'')+'" data-a="'+esc(o)+'">'+esc(o)+'</span>';
  }).join('') + '<span class="actionChip'+((!matched && currentValue) ? ' on' : '')+'" data-a="__other__">기타</span>';
  host.innerHTML = html;
  var otherInp = document.getElementById('fActionOther');
  if(!matched && currentValue){ otherInp.style.display=''; otherInp.value = currentValue; }
  else { otherInp.style.display='none'; otherInp.value=''; }
  host.querySelectorAll('[data-a]').forEach(function(el){
    el.addEventListener('click', function(){
      host.querySelectorAll('.actionChip').forEach(function(c){ c.classList.remove('on'); });
      el.classList.add('on');
      var v = el.getAttribute('data-a');
      if(v==='__other__'){ otherInp.style.display=''; otherInp.value=''; otherInp.focus(); }
      else { otherInp.style.display='none'; otherInp.value=''; }
      _curEditingAction = readActionValue();
    });
  });
}
function readActionValue(){
  var host = document.getElementById('actionPick');
  var on = host ? host.querySelector('.actionChip.on') : null;
  if(!on) return '';
  var v = on.getAttribute('data-a');
  if(v==='__other__') return document.getElementById('fActionOther').value.trim();
  return v;
}

/* ══════════════════════════════════════════════════════════
   종목 마스터 — 자동수집(기록에 쓰인 종목) + 수동목록 합치기
   ══════════════════════════════════════════════════════════ */
/* v7.1: stockMaster 항목은 원래 순수 문자열이었는데, 종목 상세(목표가 등)를 위해 객체도 섞일 수 있게 확장.
   기존 문자열 데이터를 절대 깨뜨리지 않도록 항상 이 헬퍼로만 이름/객체를 꺼내 쓴다 */
function stockName(item){ return (item && typeof item === 'object') ? String(item.name||'') : String(item||''); }
function stockItemOf(name){
  for(var i=0;i<stockMaster.length;i++){ if(stockName(stockMaster[i])===name) return stockMaster[i]; }
  return null; // 상세 정보가 아직 없으면 null(= 이름만 있는 상태)
}
function allStockNames(){
  var set = {};
  stockMaster.forEach(function(s){ var n=stockName(s); if(n) set[n]=1; });
  records.forEach(function(r){ (r.stocks||[]).forEach(function(s){ set[s]=1; }); });
  return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'ko'); });
}
function stockCount(name){
  return records.filter(function(r){ return (r.stocks||[]).indexOf(name)>=0; }).length;
}
function saveStockMaster(list){
  if(!db) return;
  db.collection('records_meta').doc('stocks').set({list:list}, {merge:true})
    .catch(function(e){ logBug('종목 저장 실패: '+e.message); });
}
function addStockToMaster(name){
  name = String(name||'').trim();
  if(!name) return;
  if(allStockNames().indexOf(name)>=0) return;
  var list = stockMaster.slice(); list.push(name);
  saveStockMaster(list);
}
/* v7.1: stockMaster 안의 종목 하나를 안전하게 고쳐서 한 번에 저장 — 같은 클릭 안에서 필드저장+이력추가를
   따로따로 저장하면(각자 옛 stockMaster 스냅샷에서 시작해) 서로 덮어쓰는 경합이 생기므로, 반드시 이 함수로
   한 번의 mutatorFn 안에서 필요한 변경을 전부 적용한 뒤 한 번만 저장한다 */
function mutateStockItem(name, mutatorFn){
  var list = stockMaster.map(function(s){ return s; });
  var idx = -1;
  for(var i=0;i<list.length;i++){ if(stockName(list[i])===name){ idx=i; break; } }
  var base = (idx>=0 && typeof list[idx]==='object' && list[idx]) ? Object.assign({}, list[idx]) : {name:name};
  mutatorFn(base);
  if(idx>=0) list[idx] = base; else list.push(base);
  saveStockMaster(list);
}
/* v7.1: 투자논지 이력에 한 줄 추가(항상 append만 — 기존 줄은 절대 지우거나 고치지 않음) */
function appendThesisLog(name, text, auto){
  if(!text) return;
  mutateStockItem(name, function(base){
    var log = (base.thesisLog||[]).slice();
    log.push({date: todayStr(), text: text, auto: !!auto});
    base.thesisLog = log;
  });
}

/* 오늘 것이 아직 없는 활성 템플릿만 골라 하루치를 만든다. _pendingTemplateAdds로 같은 세션 안 중복 발사 방지,
   todos 스냅샷의 실제 존재 여부로 새로고침/재접속 시 중복 방지 — 이중 안전장치 */
/* v6.1: 날짜문자열(YYYY-MM-DD)이 토·일인지 — Date.UTC 고정 연산(KST에서 하루 밀리는 사고 방지, 프로젝트 표준 패턴) */
function isWeekendStr(dateStr){
  var p = dateStr.split('-');
  var day = new Date(Date.UTC(+p[0], +p[1]-1, +p[2])).getUTCDay(); // 0=일 6=토
  return day===0 || day===6;
}
function ensureTodayInstances(){
  if(!db || !checklistTemplates.length) return;
  var t = todayStr();
  if(isWeekendStr(t)) return; // v6.1: 반복 체크리스트는 월~금만 자동생성
  checklistTemplates.forEach(function(tpl){
    if(tpl.paused) return;
    var key = t+'|'+tpl.id;
    if(_pendingTemplateAdds[key]) return;
    var exists = todos.some(function(x){ return x.templateId===tpl.id && x.date===t; });
    if(exists) return;
    _pendingTemplateAdds[key] = true;
    db.collection('records_todos').add({text:tpl.text, done:false, date:t, createdAt:Date.now(), templateId:tpl.id})
      .catch(function(e){ logBug('반복항목 생성 실패: '+e.message); delete _pendingTemplateAdds[key]; });
  });
}

      + '<button type="button" class="rm" data-idx="'+i+'" title="삭제">✕</button>'
      + '</div>'
      + '<div class="tmplIconEdit" data-iconedit="'+i+'">'
        + '<input type="text" maxlength="4" value="'+esc(tpl.icon||'📌')+'">'
        + TMPL_COLOR_ORDER.map(function(c){
            return '<span class="tmplColorDot'+(((tpl.color||'gray')===c)?' on':'')+'" data-color="'+c+'" data-idx="'+i+'" style="background:'+TMPL_COLORS[c].bg+'" title="'+c+'"></span>';
          }).join('')
      + '</div>'
      + '<div class="tmplInsertRow" data-ins="'+i+'"><input type="text" placeholder="여기 끼워넣을 항목…"><button type="button" class="go">추가</button></div>';
  }).join('');
  bindTmplMgrEvents(host);
}
function bindTmplMgrEvents(host){
  /* v7.11: 아이콘 배지 클릭 -> 바로 아래 이모지 입력칸+색상 6종이 펼쳐짐 */
  host.querySelectorAll('.iconPick').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-idx');
      var row = host.querySelector('.tmplIconEdit[data-iconedit="'+i+'"]');
      row.classList.toggle('on');
      if(row.classList.contains('on')) row.querySelector('input').focus();
    });
  });
  host.querySelectorAll('.tmplIconEdit').forEach(function(row){
    var i = +row.getAttribute('data-iconedit');
    var inp = row.querySelector('input');
    /* v7.11 버그수정: 배지를 열면 입력칸에 자동 포커스가 가는데, 바로 옆 색상점(비포커스 요소)을
       클릭하면 브라우저가 포커스를 body로 옮기며 이 입력칸에 blur가 먼저 발생 — 그때 commitIcon이
       매번 renderTmplMgr()로 줄 전체를 통째로 다시 그리면, 지금 막 클릭하려던 색상점 DOM이
       그 사이 사라져서 클릭이 허공에 떨어짐(paused 버튼 등 같은 줄의 다른 컨트롤도 전부 같은 이유로
       먹통이 됨 — 재현 확인함). 근본 원인은 "값이 안 바뀌었는데도 매번 통째로 재렌더한 것"이라
       값이 실제로 바뀔 때만 저장하고, 재렌더 대신 배지 글자만 바꿔서 같은 줄의 다른 요소를 안 건드림 */
    function commitIcon(){
      var v = inp.value.trim() || '📌';
      if(v === (checklistTemplates[i].icon||'📌')) return;
      checklistTemplates[i].icon = v;
      saveTemplates(checklistTemplates);
      var badge = host.querySelector('.iconPick[data-idx="'+i+'"]');
      if(badge) badge.textContent = v;
    }
    inp.addEventListener('blur', commitIcon);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') inp.blur(); });
    row.querySelectorAll('.tmplColorDot').forEach(function(dot){
      dot.addEventListener('click', function(){
        checklistTemplates[i].color = dot.getAttribute('data-color');
        saveTemplates(checklistTemplates);
        renderTmplMgr();
      });
    });
  });
  host.querySelectorAll('.tmplText').forEach(function(span){
    span.addEventListener('click', function(){
      var i = +span.getAttribute('data-idx');
      var cur = checklistTemplates[i];
      var inp = document.createElement('input');
      inp.type='text'; inp.value = cur.text;
      span.innerHTML=''; span.appendChild(inp); inp.focus(); inp.select();
      function commit(){
        var v = inp.value.trim();
        if(v){ checklistTemplates[i].text = v; saveTemplates(checklistTemplates); }
        renderTmplMgr();
      }
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') inp.blur(); if(e.key==='Escape') renderTmplMgr(); });
    });
  });
  host.querySelectorAll('.pauseBtn').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-idx');
      checklistTemplates[i].paused = !checklistTemplates[i].paused;
      saveTemplates(checklistTemplates);
      renderTmplMgr();
    });
  });
  host.querySelectorAll('.rm').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-idx');
      if(!confirm('"'+checklistTemplates[i].text+'" 항목을 삭제할까요? (지난 이력은 남습니다)')) return;
      checklistTemplates.splice(i,1);
      saveTemplates(checklistTemplates);
      renderTmplMgr();
    });
  });
  host.querySelectorAll('.insBtn').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-idx');
      var row = host.querySelector('.tmplInsertRow[data-ins="'+i+'"]');
      row.classList.toggle('on');
      if(row.classList.contains('on')) row.querySelector('input').focus();
    });
  });
  host.querySelectorAll('.tmplInsertRow').forEach(function(row){
    var i = +row.getAttribute('data-ins');
    function doInsert(){
      var inp = row.querySelector('input');
      var v = inp.value.trim();
      if(!v) return;
      checklistTemplates.splice(i+1, 0, {id:'t'+Date.now()+Math.random().toString(36).slice(2,6), text:v, paused:false});
      saveTemplates(checklistTemplates);
      renderTmplMgr();
    }
    row.querySelector('.go').addEventListener('click', doInsert);
    row.querySelector('input').addEventListener('keydown', function(e){ if(e.key==='Enter') doInsert(); });
  });
  /* 드래그 순서 변경 */
  host.querySelectorAll('.tmplRow').forEach(function(row){
    row.addEventListener('dragstart', function(){ _tmplDragFrom = +row.getAttribute('data-idx'); });
    row.addEventListener('dragover', function(e){ e.preventDefault(); row.classList.add('dragOver'); });
    row.addEventListener('dragleave', function(){ row.classList.remove('dragOver'); });
    row.addEventListener('drop', function(e){
      e.preventDefault(); row.classList.remove('dragOver');
      var to = +row.getAttribute('data-idx');
      if(_tmplDragFrom===null || _tmplDragFrom===to) return;
      var moved = checklistTemplates.splice(_tmplDragFrom,1)[0];
      checklistTemplates.splice(to,0,moved);
      _tmplDragFrom = null;
      saveTemplates(checklistTemplates);
      renderTmplMgr();
    });
  });
}

function topicCounts(){

    m[key].n++;
  }); });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return b.n-a.n || String(a.label).localeCompare(String(b.label)); });
}

var FKLABEL={stock:'종목',topic:'주제',star:'별점',verify:'검증',channel:'출처',date:'날짜'};
function _uniqVals(field){ var m={}; records.forEach(function(r){ if(field==='stocks'||field==='topics'){ (r[field]||[]).forEach(function(x){ if(x) m[x]=(m[x]||0)+1; }); } else if(r[field]){ m[r[field]]=(m[r[field]]||0)+1; } }); return Object.keys(m).sort(function(a,b){ return m[b]-m[a]; }); }
function filterOptions(kind){
  var o=[];
  if(kind==='star'){ [['','전체'],['5','★5'],['4','4★ 이상'],['3','3★ 이상'],['none','미평가']].forEach(function(x){ o.push({label:x[1],on:curStar===x[0],apply:function(){curStar=x[0];}}); }); }
  else if(kind==='date'){ [['','전체'],['today','오늘'],['7','최근 7일'],['30','최근 30일']].forEach(function(x){ o.push({label:x[1],on:curDateRange===x[0],apply:function(){curDateRange=x[0];}}); }); }
  else if(kind==='verify'){ o.push({label:'전체',on:!curVerify,apply:function(){curVerify='';}}); VERIFY_ORDER.forEach(function(k){ if(records.some(function(r){return r.verifyState===k;})) o.push({label:VERIFY_STATES[k].n,on:curVerify===k,apply:function(){curVerify=k;}}); }); }
  else if(kind==='channel'){ o.push({label:'전체',on:!curChannel,apply:function(){curChannel='';}}); _uniqVals('channel').forEach(function(c){ o.push({label:c,on:curChannel===c,apply:function(){curChannel=c;}}); }); }
  else if(kind==='stock'){ o.push({label:'전체',on:!curStock,apply:function(){curStock='';}}); _uniqVals('stocks').forEach(function(c){ o.push({label:c,on:curStock===c,apply:function(){curStock=c;}}); }); }
  else if(kind==='topic'){ o.push({label:'전체',on:!curTopic,apply:function(){curTopic='';}}); _uniqVals('topics').forEach(function(c){ o.push({label:c,on:curTopic&&curTopic.toLowerCase()===String(c).toLowerCase(),apply:function(){curTopic=c;}}); }); }
  return o;
}

/* ══════════════════════════════════════════════════════════
   필터링 → 정렬
   ══════════════════════════════════════════════════════════ */
function filtered(){
  var arr = records.slice();
  if(curKind!=='전체') arr = arr.filter(function(r){ return r.kind===curKind; });
  if(curStock) arr = arr.filter(function(r){ return (r.stocks||[]).indexOf(curStock)>=0; });
  if(curVerify) arr = arr.filter(function(r){ return r.verifyState===curVerify; });
  if(curTopic){ var _tp = curTopic.toLowerCase(); arr = arr.filter(function(r){ return (r.topics||[]).some(function(t){ return String(t).toLowerCase()===_tp; }); }); }
  if(curStar){ arr = arr.filter(function(r){ return curStar==='none' ? !((r.star||0)>0) : (r.star||0)>=(+curStar); }); }
  if(curChannel){ arr = arr.filter(function(r){ return (r.channel||'')===curChannel; }); }
  if(curDateRange){ if(curDateRange==='today'){ var _t=todayStr(); arr=arr.filter(function(r){ return r.date===_t; }); } else { var _d=kstNow(); _d.setDate(_d.getDate()-(curDateRange==='7'?7:30)); var _lim=_d.toISOString().slice(0,10); arr=arr.filter(function(r){ return (r.date||'')>=_lim; }); } }
  if(curQ){
    var q = curQ.toLowerCase();
    arr = arr.filter(function(r){
      var hay = [r.title,r.oneLiner,r.body,r.action,r.channel,(r.stocks||[]).join(' '),(r.topics||[]).join(' '),r.aiInterpretation,r.userJudgment].join(' ').toLowerCase();
      return hay.indexOf(q)>=0;
    });
  }
  arr.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0); });
  return arr;
}

function cardHTML(arr){
  var groups = {}, order = [];

      + '<div class="grid">' + groups[d].map(cardOne).join('') + '</div>';

/* 다가올(오늘 포함) 확인일 중 가장 가까운 것 — 없으면 null */
function nextCheck(r){
  var t = todayStr();
  var list = (r.checks||[]).map(function(c){ return c.date; }).filter(Boolean).sort();
  if(!list.length) return null;
  var future = list.filter(function(d){ return d>=t; });
  return future.length ? future[0] : list[list.length-1];
}

function boardHTML(arr){

  return '<div class="board">' + order.map(function(s){
    var recent = cols[s].map(function(r){return r.date||'';}).filter(Boolean).sort().pop()||'';

      + '<div style="font-size:10.5px;color:var(--sub2);padding:0 2px 6px">'+(recent?('최근 '+fmtDate(recent)):'')+(maxStar?(' · 최고 '+'★'.repeat(maxStar)):'')+'</div>'
      + cols[s].map(function(r){

            + '<div class="tt">'+esc(r.title||'')+'</div>'

/* ── 종목모드(v7.10) 전용 헬퍼 — 전부 기존에 이미 있던 필드(records/stockMaster)에서만 계산,
   새로 지어낸 값 없음. stockRecords는 v7.6의 stockDirHTML 안에 있던 필터링을 재사용 가능하게 뺀 것뿐 */
function stockRecords(name){
  return records.filter(function(r){ return (r.stocks||[]).indexOf(name)>=0; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
}
/* 이 종목과 관련된 활동 중 가장 최근 날짜 — 관련기록 날짜 + 투자논지 이력 날짜(thesisLog) 중 최댓값.
   원래 있던 날짜 필드들을 모아 max만 취하는 것이라 새 필드가 필요 없다 */
function stockLastActivity(name){
  var dates = stockRecords(name).map(function(r){ return r.date||''; });
  var item = stockItemOf(name);
  if(item && item.thesisLog) item.thesisLog.forEach(function(t){ if(t && t.date) dates.push(t.date); });
  dates = dates.filter(Boolean).sort();
  return dates.length ? dates[dates.length-1] : '';
}
/* 이 종목의 관련기록 중 가장 많이 나온 channel(record.channel) — "종목 채널별보기"용 그룹 기준 */
function stockMainChannel(name){
  var counts = {}, best = '', bestN = 0;
  stockRecords(name).forEach(function(r){
    var c = r.channel || ''; if(!c) return;
    counts[c] = (counts[c]||0)+1;
    if(counts[c] > bestN){ best = c; bestN = counts[c]; }
  });
  return best;
}
/* 이 종목의 관련기록 중 이미지(record.image)가 있는 가장 최근 것 — "종목 갤러리보기"용 커버 */
function stockCoverImage(name){
  var recs = stockRecords(name);
  for(var i=0;i<recs.length;i++){ if(recs[i].image) return recs[i].image; }
  return '';
}

/* ── 종목모드(v7.10) — "🏷 종목" 탭이 켜져 있고 특정 종목을 아직 안 골랐을 때(레벨1),
   "종목 목록 자체"를 #viewicons가 고른 curView 방식으로 보여주는 8개 렌더 함수.
   하나를 고른 뒤(레벨2)는 이 함수들을 안 쓰고 기존 레코드용 8개 함수를 그대로 재사용(render() 참고) */
function stockCardHTML(names){
  return '<div class="stockDirGrid">' + names.map(function(n){
    var item = stockItemOf(n);
    var badge = (item && item.status) ? '<span class="badge '+esc(item.status)+'">'+esc(item.status)+'</span>' : '<span class="emptyMini" style="padding:0">정보 없음</span>';
    return '<div class="stockDirCard" data-stocktab="'+esc(n)+'">'
      + '<div class="nm"><span>🏷 '+esc(n)+'</span><span class="n">'+stockCount(n)+'건</span></div>'
      + badge
      + '</div>';
  }).join('') + '</div>';
}
function stockListHTML(names){
  return '<div class="rlist">' + names.map(function(n){
    var item = stockItemOf(n);
    var last = stockLastActivity(n);
    return '<div class="lrow" data-stocktab="'+esc(n)+'">'
      + '<span class="dot2" style="background:var(--gold-dk)"></span>'
      + '<span class="tt3">🏷 '+esc(n)+'</span>'
      + '<span class="ol3">'+((item&&item.status)?esc(item.status):'')+'</span>'
      + '<span class="st3">'+stockCount(n)+'건</span>'
      + (last ? '<span class="re3">🕒 '+esc(fmtDate(last))+'</span>' : '')
      + '</div>';
  }).join('') + '</div>';
}
function stockTableHTML(names){
  var rows = names.map(function(n){
    var item = stockItemOf(n) || {};
    var last = stockLastActivity(n);
    return '<tr data-stocktab="'+esc(n)+'">'
      + '<td>🏷 '+esc(n)+'</td>'
      + '<td>'+(item.status?esc(item.status):'-')+'</td>'
      + '<td>'+(item.quantity!=null&&item.quantity!==''?esc(String(item.quantity)):'')+'</td>'
      + '<td>'+(item.avgCost!=null&&item.avgCost!==''?esc(String(item.avgCost)):'')+'</td>'
      + '<td>'+(item.targetPrice!=null&&item.targetPrice!==''?esc(String(item.targetPrice)):'')+'</td>'
      + '<td>'+stockCount(n)+'건</td>'
      + '<td>'+(last?esc(last):'-')+'</td>'
      + '</tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table class="rt"><tr><th>종목</th><th>상태</th><th>보유수량</th><th>매수단가</th><th>목표가</th><th>기록수</th><th>최근 활동일</th></tr>'+rows+'</table></div>';
}
function stockBoardHTML(names){
  var order = ['보유','관심','청산','미설정'];
  var cols = {'보유':[], '관심':[], '청산':[], '미설정':[]};
  names.forEach(function(n){
    var item = stockItemOf(n);
    var st = (item && item.status) ? item.status : '미설정';
    if(!cols[st]) cols[st] = [];
    cols[st].push(n);
  });
  return '<div class="board">' + order.filter(function(s){ return cols[s].length; }).map(function(s){
    return '<div class="bcol"><div class="bhd"><b>'+esc(s)+'</b><span class="n">'+cols[s].length+'</span></div>'
      + cols[s].map(function(n){
          var last = stockLastActivity(n);
          return '<div class="bcard" data-stocktab="'+esc(n)+'">'
            + '<div class="kk" style="color:var(--gold-dk)">🏷 '+esc(n)+'</div>'
            + '<div class="tt">'+stockCount(n)+'건</div>'
            + '<div class="dd">'+(last?('최근 '+fmtDate(last)):'활동 없음')+'</div>'
            + '</div>';
        }).join('')
      + '</div>';
  }).join('') + '</div>';
}
function stockChHTML(names){
  var cols = {}, order = [];
  names.forEach(function(n){
    var ch = stockMainChannel(n) || '연결된 채널 없음';
    if(!cols[ch]){ cols[ch]=[]; order.push(ch); }
    cols[ch].push(n);
  });
  order.sort(function(a,b){ if(a==='연결된 채널 없음') return 1; if(b==='연결된 채널 없음') return -1; return cols[b].length-cols[a].length; });
  return '<div class="board">' + order.map(function(ch){
    return '<div class="bcol"><div class="bhd"><b>'+esc(ch)+'</b><span class="n">'+cols[ch].length+'</span></div>'
      + cols[ch].map(function(n){
          return '<div class="chcard" data-stocktab="'+esc(n)+'">'
            + '<div class="kk" style="color:var(--gold-dk)">🏷 '+esc(n)+'</div>'
            + '<div class="tt">'+stockCount(n)+'건</div>'
            + '</div>';
        }).join('')
      + '</div>';
  }).join('') + '</div>';
}
function stockCalHTML(names){
  var y=+calYM.slice(0,4), m=+calYM.slice(5,7);
  var first=new Date(y,m-1,1), start=first.getDay();
  var days=new Date(y,m,0).getDate();
  var byDay={};
  names.forEach(function(n){
    var last = stockLastActivity(n);
    if(last && last.slice(0,7)===calYM){ var dd=+last.slice(8,10); (byDay[dd]=byDay[dd]||[]).push(n); }
  });
  var t = todayStr();
  var h = '<div class="cal"><div class="calhd"><div class="nav"><button id="calPrev">‹</button></div><b>'+y+'년 '+m+'월</b><div class="nav"><button id="calNext">›</button></div></div>'
    + '<div class="calgrid">';
  ['일','월','화','수','목','금','토'].forEach(function(d){ h+='<div class="dow">'+d+'</div>'; });
  for(var i=0;i<start;i++) h+='<div class="cell dim"></div>';
  for(var d=1; d<=days; d++){
    var list = byDay[d]||[];
    var dateStr = calYM+'-'+String(d).padStart(2,'0');
    var isT = dateStr===t;
    h += '<div class="cell'+(isT?' today':'')+'"><span class="num">'+d+'</span>'
      + list.slice(0,3).map(function(n){
          return '<span class="evt" style="background:var(--gold-dk)" data-stocktab="'+esc(n)+'">🏷 '+esc(n)+'</span>';
        }).join('')
      + (list.length>3 ? '<span style="font-size:10px;color:var(--sub2)">+'+(list.length-3)+'건 더</span>' : '')
      + '</div>';
  }
  return h + '</div></div>';
}
function stockTimeHTML(names){
  var withDate = names.map(function(n){ return {n:n, last: stockLastActivity(n)}; });
  withDate.sort(function(a,b){ return (b.last||'').localeCompare(a.last||''); });
  return '<div class="tl">' + withDate.map(function(x){
    var item = stockItemOf(x.n);
    return '<div class="tlItem" data-stocktab="'+esc(x.n)+'">'
      + '<div class="tlHd">'+(x.last?fmtDate(x.last):'활동 없음')+((item&&item.status)?(' · '+esc(item.status)):'')+'</div>'
      + '<div class="tlTitle">🏷 '+esc(x.n)+'</div>'
      + '<div class="tlSub">'+stockCount(x.n)+'건의 관련 기록</div>'
      + '</div>';
  }).join('') + '</div>';
}
function stockGalHTML(names){
  return '<div class="galgrid">' + names.map(function(n){
    var cover = stockCoverImage(n);
    var item = stockItemOf(n);
    var coverHtml = cover
      ? '<div class="cover" style="background:var(--gold-dk)"><img src="'+esc(cover)+'" alt="" loading="lazy"></div>'
      : '<div class="cover" style="background:var(--gold-dk)">🏷</div>';
    return '<div class="galcard" data-stocktab="'+esc(n)+'">'
      + coverHtml
      + '<div class="gb">'
      + '<div class="gk" style="color:var(--gold-dk)">'+((item&&item.status)?esc(item.status):'정보 없음')+'</div>'
      + '<div class="gt">🏷 '+esc(n)+'</div>'
      + '<div class="go2">'+stockCount(n)+'건</div>'
      + '</div></div>';
  }).join('') + '</div>';
}

/* ── 캘린더보기 (날짜 칸 안에 실제 제목 텍스트) ── */
function calHTML(arr){
  var y=+calYM.slice(0,4), m=+calYM.slice(5,7);
  var first=new Date(y,m-1,1), start=first.getDay();
  var days=new Date(y,m,0).getDate();
  var byDay={};
  arr.forEach(function(r){ var d=String(r.date||''); if(d.slice(0,7)===calYM){ var dd=+d.slice(8,10); (byDay[dd]=byDay[dd]||[]).push(r); } });
  /* v6: 체크 캘린더(checks[].date)도 같이 표시 — 필터된 arr 기준 */
  var chkByDay={};
  arr.forEach(function(r){ (r.checks||[]).forEach(function(c){
    var d=String(c.date||''); if(d.slice(0,7)===calYM){ var dd=+d.slice(8,10); (chkByDay[dd]=chkByDay[dd]||[]).push({r:r,c:c}); }
  }); });
  var t = todayStr();
  var h = '<div class="cal"><div class="calhd"><div class="nav"><button id="calPrev">‹</button></div><b>'+y+'년 '+m+'월</b><div class="nav"><button id="calNext">›</button></div></div>'
    + '<div class="calgrid">';
  ['일','월','화','수','목','금','토'].forEach(function(d){ h+='<div class="dow">'+d+'</div>'; });
  for(var i=0;i<start;i++) h+='<div class="cell dim"></div>';
  for(var d=1; d<=days; d++){
    var list = byDay[d]||[];
    var chks = chkByDay[d]||[];
    var dateStr = calYM+'-'+String(d).padStart(2,'0');
    var isT = dateStr===t;
    /* v6.1: 🔔는 .evt처럼 제목을 칸 안에 바로 보여줌(2개까지+더보기). 클릭하면 전체기록이 아니라
       그날 요약 팝업(그날 기록+확인할 것)이 뜨게 — 기록 제목(.evt) 클릭은 기존대로 바로 전체기록 열림 */
    h += '<div class="cell'+(isT?' today':'')+'"><span class="num">'+d+'</span>'
      + list.slice(0,3).map(function(r){
          var k = KINDS[r.kind] || KINDS.memo;
          return '<span class="evt" style="background:'+k.c+'" data-open="'+esc(r.id)+'">'+((r.star||0)>=4?'⭐':'')+esc(r.title||'')+'</span>';
        }).join('')
      + (list.length>3 ? '<span style="font-size:10px;color:var(--sub2)">+'+(list.length-3)+'건 더</span>' : '')
      + chks.slice(0,2).map(function(x){
          return '<span class="chkEvt" data-daypop="'+dateStr+'">🔔 '+esc(x.c.what||x.r.title||'')+'</span>';
        }).join('')
      + (chks.length>2 ? '<span class="calChk" data-daypop="'+dateStr+'">+'+(chks.length-2)+'건 더</span>' : '')
      + '</div>';
  }
  return h + '</div></div>';
}
/* v6.1: 달력 🔔 클릭 → 전체기록 대신 그날 요약(기록+확인할 것)만 가볍게 보여주는 팝업 */
function openDayPopup(dateStr){
  var arr = filtered();
  var dayRecords = arr.filter(function(r){ return r.date===dateStr; });
  var dayChecks = [];
  arr.forEach(function(r){ (r.checks||[]).forEach(function(c){ if(c.date===dateStr) dayChecks.push({r:r, c:c}); }); });
  var p = dateStr.split('-');
  var wd = ['일','월','화','수','목','금','토'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];
  document.getElementById('dayModalTitle').textContent = (+p[1])+'월 '+(+p[2])+'일 ('+wd+')';
  var html = '<div class="dayPopSec"><h5>📌 이날 기록</h5>'
    + (dayRecords.length ? dayRecords.map(function(r){
        var k = KINDS[r.kind] || KINDS.memo;
        return '<div class="checkItem" data-open="'+esc(r.id)+'">'
          + '<span class="dot" style="background:'+k.c+'"></span>'
          + '<span class="tt">'+esc(r.title||'')+'</span>'
          + '<span class="kk">'+k.i+' '+k.n+'</span>'
          + '</div>';
      }).join('') : '<div class="emptyMini">이날 기록은 없어요</div>')
    + '</div><div class="dayPopSec"><h5>🔔 확인할 것</h5>'
    + (dayChecks.length ? dayChecks.map(function(x){
        var k = KINDS[x.r.kind] || KINDS.memo;
        return '<div class="checkItem" data-open="'+esc(x.r.id)+'">'
          + '<span class="dot" style="background:'+k.c+'"></span>'
          + '<span class="tt">'+esc(x.c.what||x.r.title||'')+(x.c.action?(' <span style="color:var(--sub2)">— '+esc(x.c.action)+'</span>'):'')+'</span>'
          + '<span class="kk">'+k.i+' '+esc(x.r.title||'')+'</span>'
          + '</div>';
      }).join('') : '<div class="emptyMini">확인할 예정은 없어요</div>')
    + '</div>';
  var body = document.getElementById('dayModalBody');
  body.innerHTML = html;
  body.querySelectorAll('[data-open]').forEach(function(el){
    el.addEventListener('click', function(){
      document.getElementById('dayModal').classList.remove('on');
      openPage(el.getAttribute('data-open'));
    });
  });
  resetModalPos(document.querySelector('#dayModal .modal'));
  document.getElementById('dayModal').classList.add('on');
}
document.getElementById('dayModalClose').addEventListener('click', function(){
  document.getElementById('dayModal').classList.remove('on');
});

/* ── 리스트(줄)보기 — 한 줄에 압축해서 훑어보기 ── */
function listHTML(arr){
  var groups = {}, order = [];
  arr.forEach(function(r){ var d=r.date||'미정'; if(!groups[d]){ groups[d]=[]; order.push(d); } groups[d].push(r); });
  var t = todayStr();
  var y = kstNow(); y.setDate(y.getDate()-1); var yStr = y.toISOString().slice(0,10);
  return order.map(function(d){
    var label = d===t?('오늘 '+d):(d===yStr?('어제 '+d):d);
    return '<div class="day"><h2>'+esc(label)+'</h2><span>'+groups[d].length+'건</span></div>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px 12px;margin-bottom:12px">'
      + groups[d].map(function(r){
          var k = KINDS[r.kind] || KINDS.memo;
          return '<div data-open="'+esc(r.id)+'" style="padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0">'
            + '<span style="color:'+k.c+'">'+k.i+'</span> <b style="font-size:13px">'+esc(r.title||'')+'</b>'
            + (r.oneLiner?('<div style="font-size:11px;color:var(--sub2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.oneLiner)+'</div>'):'')
            + '</div>';
        }).join('')
      + '</div>';
  }).join('');
}

/* ── 채널별보기 (보드와 같은 틀, 그룹 기준만 채널/출처) ── */
function chHTML(arr){
  var cols = {}, order = [];
  arr.forEach(function(r){
    var s = r.channel || '미상';
    if(!cols[s]){ cols[s]=[]; order.push(s); }
    cols[s].push(r);
  });
  order.sort(function(a,b){ if(a==='미상') return 1; if(b==='미상') return -1; return cols[b].length-cols[a].length; });
  function topOf(recs, field){ var m={}; recs.forEach(function(r){ (r[field]||[]).forEach(function(v){ if(v) m[v]=(m[v]||0)+1; }); }); return Object.keys(m).sort(function(a,b){ return m[b]-m[a]; }).slice(0,3); }
  return '<div class="board">' + order.map(function(s){
    var recs = cols[s], tps = topOf(recs,'topics'), sts = topOf(recs,'stocks');
    return '<div class="bcol"><div class="bhd"><b>'+esc(s)+'</b><span class="n">'+recs.length+'</span></div>'
      + '<div style="font-size:11px;color:var(--sub2);padding:0 2px 6px;line-height:1.6">'
        + (tps.length?('주제: '+tps.map(esc).join(' · ')+'<br>'):'')
        + (sts.length?('종목: '+sts.map(esc).join(' · ')):'')
      + '</div>'
      + recs.map(function(r){
          var k = KINDS[r.kind] || KINDS.memo;
          return '<div class="chcard" data-open="'+esc(r.id)+'">'
            + '<div class="kk" style="color:'+k.c+'">'+k.i+' '+k.n+'</div>'
            + '<div class="tt">'+esc(r.title||'')+'</div>'
            + '<div class="dd">'+fmtDate(r.date)+'</div>'
            + '</div>';
        }).join('')
      + '</div>';
  }).join('') + '</div>';
}

/* ── 타임라인보기 — 최신순 세로 히스토리 ── */
function timeHTML(arr){
  return '<div class="tl">' + arr.map(function(r){
    var k = KINDS[r.kind] || KINDS.memo;
    var stocks = (r.stocks||[]).slice(0,4).map(function(s){ return '<span class="stag">'+esc(s)+'</span>'; }).join('');
    var judge = r.userJudgment ? ('<div style="font-size:12px;color:var(--navy-700);margin-top:5px">🙋 '+esc(r.userJudgment)+'</div>') : (r.aiInterpretation ? ('<div style="font-size:12px;color:var(--sub);margin-top:5px">🤖 '+esc(r.aiInterpretation)+'</div>') : '');
    return '<div class="tlItem" data-open="'+esc(r.id)+'">'
      + '<div class="tlHd">'+fmtDate(r.date)+' · '+k.i+' '+k.n+(r.channel?(' · '+esc(r.channel)):'')+'</div>'
      + '<div class="tlTitle">'+esc(r.title||'')+'</div>'
      + (r.oneLiner ? '<div class="tlSub">'+esc(r.oneLiner)+'</div>' : '')
      + judge
      + (stocks ? '<div class="stocks" style="margin-top:6px">'+stocks+'</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}

/* ── 갤러리보기 — 큼직한 카드로 훑어보기 (차트류에 특히 유용) ── */
function galHTML(arr){
  return '<div class="galgrid">' + arr.map(function(r){
    var k = KINDS[r.kind] || KINDS.memo;
    var cover = r.image
      ? '<div class="cover" style="background:'+k.c+'"><img src="'+esc(r.image)+'" alt="" loading="lazy"></div>'
      : '<div class="cover" style="background:'+k.c+'">'+k.i+'</div>';
    return '<div class="galcard" data-open="'+esc(r.id)+'">'
      + cover
      + '<div class="gb">'
      + '<div class="gk" style="color:'+k.c+'">'+k.n+(r.channel?(' · '+esc(r.channel)):'')+'</div>'
      + '<div class="gt">'+esc(r.title||'')+'</div>'
      + '<div class="go2">📅 '+fmtDate(r.date)+(r.star?(' · '+'★'.repeat(r.star)):'')+'</div>'
      + '</div></div>';
  }).join('') + '</div>';
}

function bindContentClicks(){
  document.querySelectorAll('#content [data-open]').forEach(function(el){
    el.addEventListener('click', function(ev){
      if(ev.target.closest('[data-noopen]')) return;
      openPage(el.getAttribute('data-open'));
    });
  });
  document.querySelectorAll('#content [data-del]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var id = el.getAttribute('data-del');
      if(confirm('이 기록을 지울까요?')) removeRecord(id);
    });
  });
  /* v6.1: 달력 🔔 클릭 → 그날 요약 팝업 */
  document.querySelectorAll('#content [data-daypop]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      openDayPopup(el.getAttribute('data-daypop'));
    });
  });
  /* v7.10: 종목모드 레벨1(종목 목록 자체를 카드/리스트/표/보드/채널별/달력/타임라인/갤러리로 보는 화면)
     안의 종목 항목을 누르면 그 종목의 기록들로 들어감(레벨2) */
  document.querySelectorAll('#content [data-stocktab]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      curStockTab = el.getAttribute('data-stocktab');
      render();
    });
  });
  /* v7.10: 종목모드 레벨2 헤더의 "← 종목 목록으로" — 그 종목만 벗어나고 종목모드 자체는 유지 */
  document.querySelectorAll('#content [data-stockback]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      curStockTab = '';
      render();
    });
  });
  /* v7.6: 종목 목록 카드 — 누르면 바로 종목 상세(정보 누적 창)로 */
  document.querySelectorAll('#content [data-stockopen]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      openStockDetail(el.getAttribute('data-stockopen'));
    });
  });
  var pv = document.getElementById('calPrev'), nx = document.getElementById('calNext');
  if(pv) pv.addEventListener('click', function(){ shiftMonth(-1); });
  if(nx) nx.addEventListener('click', function(){ shiftMonth(1); });
}
function shiftMonth(n){
  var y=+calYM.slice(0,4), m=+calYM.slice(5,7);
  m += n; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  calYM = y+'-'+String(m).padStart(2,'0');
  render();
}

function showImagePreview(url){
  var box = document.getElementById('imgPreviewBox'), img = document.getElementById('imgPreview');
  if(url){ img.src = url; box.style.display = ''; }
  else { img.src = ''; box.style.display = 'none'; }
}
function setImgStatus(msg, isErr){
  var s = document.getElementById('imgUploadStatus');
  s.textContent = msg || '';
  s.classList.toggle('err', !!isErr);
}
document.getElementById('fImageInput').addEventListener('change', function(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(!storage){ setImgStatus('이미지 저장소 연결 중입니다 — 잠시 후 다시 시도해 주세요', true); ev.target.value=''; return; }
  if(!/^image\//.test(file.type)){ setImgStatus('이미지 파일만 올릴 수 있어요', true); ev.target.value=''; return; }
  if(file.size > 8*1024*1024){ setImgStatus('8MB 이하 이미지만 올릴 수 있어요', true); ev.target.value=''; return; }
  var oldPath = pickedImage.path; // 새 이미지로 교체하는 거면 옛것은 정리한다
  var path = 'records_images/' + todayStr() + '/' + Date.now() + '_' + file.name.replace(/[^\w.\-가-힣]/g,'_');
  setImgStatus('업로드 중…');
  storage.ref(path).put(file).then(function(snap){
    return snap.ref.getDownloadURL();
  }).then(function(url){
    pickedImage = {url:url, path:path};
    showImagePreview(url);
    setImgStatus('✔ 업로드 완료');
    ev.target.value='';
    if(oldPath) storage.ref(oldPath).delete().catch(function(e){ logBug('옛 이미지 정리 실패(무시): '+e.message); });
  }).catch(function(e){
    logBug('이미지 업로드 실패: '+e.message);
    setImgStatus('업로드 실패: '+e.message, true);
    ev.target.value='';
  });
});
document.getElementById('imgRemoveBtn').addEventListener('click', function(){

});

/* v5: 시나리오 폼 채우기/읽기 — idea 전용, 값 없으면 빈 칸으로 */
function fillScenarioForm(scen){
  scen = scen || {};
  var up = scen.up||{}, neutral = scen.neutral||{}, down = scen.down||{};
  document.getElementById('fScenCommon').value = scen.commonFacts||'';
  document.getElementById('fScenUpDesc').value = up.desc||'';
  document.getElementById('fScenUpStrengthen').value = up.strengthen||'';
  document.getElementById('fScenUpInvalidate').value = up.invalidate||'';
  document.getElementById('fScenNeutralDesc').value = neutral.desc||'';
  document.getElementById('fScenNeutralStrengthen').value = neutral.strengthen||'';
  document.getElementById('fScenNeutralInvalidate').value = neutral.invalidate||'';
  document.getElementById('fScenDownDesc').value = down.desc||'';
  document.getElementById('fScenDownStrengthen').value = down.strengthen||'';
  document.getElementById('fScenDownInvalidate').value = down.invalidate||'';
}
function readScenarioForm(){
  return {
    commonFacts: document.getElementById('fScenCommon').value.trim(),
    up:      {desc: document.getElementById('fScenUpDesc').value.trim(),      strengthen: document.getElementById('fScenUpStrengthen').value.trim(),      invalidate: document.getElementById('fScenUpInvalidate').value.trim()},
    neutral: {desc: document.getElementById('fScenNeutralDesc').value.trim(), strengthen: document.getElementById('fScenNeutralStrengthen').value.trim(), invalidate: document.getElementById('fScenNeutralInvalidate').value.trim()},
    down:    {desc: document.getElementById('fScenDownDesc').value.trim(),    strengthen: document.getElementById('fScenDownStrengthen').value.trim(),    invalidate: document.getElementById('fScenDownInvalidate').value.trim()}
  };
}
function scenarioHasContent(s){
  return !!(s.commonFacts || ['up','neutral','down'].some(function(k){ return s[k].desc || s[k].strengthen || s[k].invalidate; }));
}

function normTopics(str){
  var seen={}, out=[];
  (str||'').split(',').forEach(function(t){
    t=t.replace(/  +/g,' ').trim();
    if(!t) return;
    var key=t.toLowerCase();
    if(seen[key]) return;
    seen[key]=1; out.push(t);
  });
  return out;
}
/* relations 골격(Phase 1A): 원본 한쪽에만 relations:[{relationId,targetId,type,note,createdAt}] 저장.
   역방향은 메모리 records 배열을 훑어 조회(C안). 생성 UI는 Phase 1B. */

  return (records||[]).filter(function(x){ return (x.relations||[]).some(function(rl){ return rl && rl.targetId===id; }); });
}

  /* v5: 시나리오는 idea 기록에서 내용이 있을 때만 저장 — 최초 저장 시각(scenariosSetAt)은 수정해도 안 바뀜(9번 원칙: 판단 당시 기록 보존) */
  if(data.kind==='idea'){

   페이지 보기 (노션식 읽기 화면 — 전체요약 복붙용)

function renderRelResults(q){
  var host=document.getElementById('relResults'); if(!host) return;
  var src=records.find(function(x){ return x.id===REL_SRC; });
  var linked={}; ((src&&src.relations)||[]).forEach(function(rl){ linked[rl.targetId]=1; });
  q=(q||'').toLowerCase();
  var list=records.filter(function(r){
    if(r.id===REL_SRC || linked[r.id]) return false;
    if(!q) return true;
    var hay=[r.title,r.oneLiner,(r.stocks||[]).join(' '),(r.topics||[]).join(' '),r.channel].join(' ').toLowerCase();
    return hay.indexOf(q)>=0;
  }).slice(0,40);
  if(!list.length){ host.innerHTML='<div style="font-size:12.5px;color:var(--sub2);padding:8px">연결할 기록이 없어요</div>'; return; }
  host.innerHTML=list.map(function(r){ var k=KINDS[r.kind]||KINDS.memo;
    return '<div class="relPick" data-id="'+esc(r.id)+'" style="padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px">'+k.i+' <b>'+esc(r.title||'')+'</b>'+(r.oneLiner?' <span style="color:var(--sub2);font-size:11.5px">— '+esc(r.oneLiner)+'</span>':'')+'</div>'; }).join('');
  host.querySelectorAll('.relPick').forEach(function(el){ el.addEventListener('click', function(){ addRelation(REL_SRC, el.getAttribute('data-id'), document.getElementById('relType').value); }); });
}
function openRelModal(srcId){
  REL_SRC=srcId; document.getElementById('relSearch').value=''; renderRelResults('');
  resetModalPos(document.querySelector('#relModal .modal'));
  document.getElementById('relModal').classList.add('on');
}
function closeRelModal(){ document.getElementById('relModal').classList.remove('on'); }
function addRelation(srcId,targetId,type){
  var r=records.find(function(x){ return x.id===srcId; }); if(!r||!db) return;
  var rels=(r.relations||[]).slice();
  if(rels.some(function(x){ return x.targetId===targetId; })) return;
  rels.push({relationId:'rel_'+Date.now(), targetId:targetId, type:type||'related', note:'', createdAt:Date.now()});
  r.relations=rels;
  db.collection('records').doc(srcId).update({relations:rels}).catch(function(e){ logBug('관계 저장 실패: '+e.message); });
  closeRelModal(); openPage(srcId);
}
function delRelation(srcId,targetId){
  var r=records.find(function(x){ return x.id===srcId; }); if(!r||!db) return;
  var rels=(r.relations||[]).filter(function(x){ return x.targetId!==targetId; });
  r.relations=rels;
  db.collection('records').doc(srcId).update({relations:rels}).catch(function(e){ logBug('관계 삭제 실패: '+e.message); });
  openPage(srcId);
}
function openPage(id){

  if(r.channel) meta += '<span class="m1">'+esc(f.chBoxLbl.replace('(선택)',''))+': '+esc(r.channel)+'</span>';
  if(r.action) meta += '<span class="m1 action">'+esc(f.actionLbl)+': '+esc(r.action)+'</span>';
  if(r.star) meta += '<span class="m1 stars">'+esc(f.starLbl)+' '+'★'.repeat(r.star)+'</span>';

  var stocks = (r.stocks||[]).map(function(s){ return '<span class="stag">'+esc(s)+'</span>'; }).join('');

  var scenHtml = '';

    var sc = r.scenarios;

      s = s||{};

      return '<div class="scenCol"><b>'+label+'</b>'
        + (s.desc?'<div style="font-size:12.5px;margin-bottom:5px;white-space:pre-wrap">'+esc(s.desc)+'</div>':'')
        + (s.strengthen?'<div style="font-size:11.5px;color:var(--good)">💪 강화: '+esc(s.strengthen)+'</div>':'')
        + (s.invalidate?'<div style="font-size:11.5px;color:var(--warn)">⛔ 무효화: '+esc(s.invalidate)+'</div>':'')
        + '</div>';
    };
    scenHtml = '<div class="pg-h4">🧭 시나리오'+(r.scenariosSetAt?(' <span style="font-weight:400;color:var(--sub2);font-size:11px">· 최초 저장 '+esc(r.scenariosSetAt.slice(0,16).replace('T',' '))+'</span>'):'')+'</div>'
      + '<div class="pg-scen">'
      + (sc.commonFacts?'<div class="commonFacts">📌 공통 사실: '+esc(sc.commonFacts)+'</div>':'')
