      + '</div>';
  }

  var checks = (r.checks||[]).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  var checkTbl = '';
  if(checks.length){
    checkTbl = '<div class="pg-h4">📅 체크 캘린더</div><table class="pg-checktbl"><tr><th>날짜</th><th>확인할 것</th><th>그때 할 행동</th></tr>'
      + checks.map(function(c){
          return '<tr><td>'+esc(c.date||'')+'</td><td>'+esc(c.what||'')+'</td><td>'+esc(c.action||'')+'</td></tr>';
        }).join('') + '</table>';
  }

  var topicsHtml = (r.topics && r.topics.length) ? '<div class="pg-stocks">'+r.topics.map(function(t){ return '<span class="stag" style="background:#eef3fb">#'+esc(t)+'</span>'; }).join('')+'</div>' : '';
  var judgeHtml = (r.aiInterpretation ? '<div class="pg-h4">🤖 AI 해석</div><div class="pg-body">'+esc(r.aiInterpretation)+'</div>' : '') + (r.userJudgment ? '<div class="pg-h4">🙋 내 판단</div><div class="pg-body">'+esc(r.userJudgment)+'</div>' : '');
  var _fwd = (r.relations||[]).map(function(rl){ var t=(records||[]).find(function(x){return x.id===rl.targetId;}); return t?{rec:t,type:rl.type||'related',dir:'→'}:null; }).filter(Boolean);
  var _rev = reverseRelations(r.id).map(function(t){ return {rec:t,type:'',dir:'←'}; });

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다'); }).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('복사했습니다');
  }catch(e){ logBug('복사 실패: '+e.message); toast('복사 실패 — 직접 선택해 주세요'); }
}

/* ══════════════════════════════════════════════════════════
   v7.1: 종목 상세(정보 누적) — 목표가·보유수량·매수단가·상태 + 투자논지 이력 + 관련 기록
   ══════════════════════════════════════════════════════════ */
var _sdCurName = null;
function openStockDetail(name){
  _sdCurName = name;
  document.getElementById('sdName').textContent = '🏷 '+name;
  document.getElementById('sdCount').textContent = stockCount(name)+'건 기록됨';
  var item = stockItemOf(name) || {};
  document.getElementById('sdStatus').value = item.status || '';
  document.getElementById('sdTarget').value = item.targetPrice != null ? item.targetPrice : '';
  document.getElementById('sdQty').value = item.quantity != null ? item.quantity : '';
  document.getElementById('sdAvgCost').value = item.avgCost != null ? item.avgCost : '';
  renderCustomFields(item.customFields || []);
  renderCfPresets(item.customFields || []);
  renderThesisLog(item.thesisLog || []);
  renderRelatedRecords(name);
  resetModalPos(document.querySelector('#stockDetailModal .modal'));
  document.getElementById('stockDetailModal').classList.add('on');
}
/* v7.4: 목표가·보유수량·매수단가처럼 미리 정해둔 항목 말고, 종목마다 원하는 항목을 이름 붙여
   자유롭게 추가하는 "추가 정보". 값 수정은 💾 저장 버튼으로 한번에(자동이력 diff 포함),
   추가/삭제는 그 자리에서 바로(각각 mutateStockItem 한 번씩 — 경합 걱정 없음) */
function renderCustomFields(fields){
  var host = document.getElementById('sdCustomFields');
  if(!fields || !fields.length){ host.innerHTML = '<div class="emptyMini">아직 추가한 항목이 없어요</div>'; return; }
  host.innerHTML = fields.map(function(f, i){
    return '<div class="cfRow"><label>'+esc(f.label)+'</label>'
      + '<input type="text" class="cfVal" data-idx="'+i+'" value="'+esc(f.value||'')+'">'
      + '<button type="button" class="cfDel" data-idx="'+i+'" title="삭제">✕</button></div>';
  }).join('');
  host.querySelectorAll('.cfDel').forEach(function(b){
    b.addEventListener('click', function(){
      if(!_sdCurName) return;
      var idx = +b.getAttribute('data-idx');
      mutateStockItem(_sdCurName, function(base){
        var list = (base.customFields||[]).slice();
        var removed = list.splice(idx,1)[0];
        base.customFields = list;
        if(removed){
          var log = (base.thesisLog||[]).slice();
          log.push({date: todayStr(), text: '항목 삭제: '+removed.label+(removed.value?('('+removed.value+')'):''), auto:true});
          base.thesisLog = log;
        }
      });
      setTimeout(function(){ openStockDetail(_sdCurName); }, 300);
    });
  });
}
/* v7.5: 항목명 타이핑 없이 자주 쓰는 이름을 칩으로 눌러서 채우기 — 이미 추가한 이름은 빼서
   같은 항목이 중복으로 쌓이지 않게. 종목마다 필요한 게 다르므로 강제로 채우지 않음(눌러야만 생김)
   v7.6: 배당수익률·동종업계 비교 같은 "지표성" 항목 대신, 나중에 판단을 다시 복기할 때(추론) 도움이
   되는 항목으로 교체 — 왜 샀는지/뭐가 틀리면 틀린 건지/다음에 뭘 봐야 하는지가 남아야 나중에 도움됨 */
var CF_PRESETS = ['매수사유','핵심가정','반증조건','촉매','확신도','리스크','손절가','매도조건','목표비중','진입전략','재평가시점','메모'];
function renderCfPresets(fields){
  var host = document.getElementById('sdCfPresets');
  if(!host) return;
  var used = (fields||[]).map(function(f){ return f.label; });
  var avail = CF_PRESETS.filter(function(p){ return used.indexOf(p)<0; });
  if(!avail.length){ host.innerHTML=''; return; }
  host.innerHTML = avail.map(function(p){ return '<span class="cfPreset" data-preset="'+esc(p)+'">+ '+esc(p)+'</span>'; }).join('');
  host.querySelectorAll('[data-preset]').forEach(function(el){
    el.addEventListener('click', function(){
      document.getElementById('sdCfLabel').value = el.getAttribute('data-preset');
      document.getElementById('sdCfValue').focus();
    });
  });
}
function renderThesisLog(log){
  var host = document.getElementById('sdThesisLog');
  if(!log.length){ host.innerHTML = '<div class="emptyMini">아직 남긴 논지가 없어요</div>'; return; }
  var sorted = log.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }); // 최신이 위로(13번 원칙)
  host.innerHTML = sorted.map(function(x){
    return '<div class="thesisLogItem'+(x.auto?' auto':'')+'"><span class="d">'+esc(fmtDate(x.date))+'</span>'+esc(x.text)+'</div>';
  }).join('');
}
function renderRelatedRecords(name){
  var host = document.getElementById('sdRelatedRecords');
  var recs = records.filter(function(r){ return (r.stocks||[]).indexOf(name)>=0; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  if(!recs.length){ host.innerHTML = '<div class="emptyMini">아직 관련 기록이 없어요</div>'; return; }
  host.innerHTML = recs.slice(0,20).map(function(r){
    var k = KINDS[r.kind] || KINDS.memo;
    return '<div class="checkItem" data-open="'+esc(r.id)+'">'
      + '<span class="dot" style="background:'+k.c+'"></span>'
      + '<span class="tt">'+esc(r.title||'')+'</span>'
      + '<span class="kk">'+fmtDate(r.date)+' · '+k.i+'</span>'
      + '</div>';
  }).join('') + (recs.length>20 ? '<div class="emptyMini">+'+(recs.length-20)+'건 더 있어요(종목칩으로 필터해서 보세요)</div>' : '');

    el.addEventListener('click', function(){
      document.getElementById('stockDetailModal').classList.remove('on');
      openPage(el.getAttribute('data-open'));
    });
  });
}

document.getElementById('sdSaveFields').addEventListener('click', function(){
  if(!_sdCurName) return;
  var item = stockItemOf(_sdCurName) || {};
  var newTarget = document.getElementById('sdTarget').value.trim();
  var newQty = document.getElementById('sdQty').value.trim();
  var newAvg = document.getElementById('sdAvgCost').value.trim();
  var newStatus = document.getElementById('sdStatus').value;
  /* v7.1 레드팀 대응: 값이 바뀌면 지우지 않고 투자논지 이력에 "무엇이 얼마→얼마로 바뀜"을 자동으로 한 줄 남김 */
  var changes = [];
  if(newTarget !== String(item.targetPrice==null?'':item.targetPrice)) changes.push('목표가 '+(item.targetPrice||'-')+' → '+(newTarget||'-'));
  if(newQty !== String(item.quantity==null?'':item.quantity)) changes.push('보유수량 '+(item.quantity||'-')+' → '+(newQty||'-'));
  if(newAvg !== String(item.avgCost==null?'':item.avgCost)) changes.push('매수단가 '+(item.avgCost||'-')+' → '+(newAvg||'-'));
  if(newStatus !== (item.status||'')) changes.push('상태 '+(item.status||'-')+' → '+(newStatus||'-'));
  /* v7.4: 추가정보(커스텀 필드) 값도 같이 diff — 항목 이름/순서는 안 바꾸고 값만 반영 */
  var oldCf = item.customFields || [];
  var cfInputs = document.querySelectorAll('#sdCustomFields .cfVal');
  var newCf = oldCf.map(function(f, i){
    var inp = cfInputs[i];
    var newVal = inp ? inp.value.trim() : (f.value||'');
    if(newVal !== (f.value||'')) changes.push(f.label+' '+(f.value||'-')+' → '+(newVal||'-'));
    return {label: f.label, value: newVal};
  });
  mutateStockItem(_sdCurName, function(base){
    base.targetPrice = newTarget; base.quantity = newQty; base.avgCost = newAvg; base.status = newStatus;
    base.customFields = newCf;
    if(changes.length){
      var log = (base.thesisLog||[]).slice();
      log.push({date: todayStr(), text: changes.join(' · '), auto:true});
      base.thesisLog = log;
    }
  });
  toast('저장했습니다');
  setTimeout(function(){ openStockDetail(_sdCurName); }, 300);
});
document.getElementById('sdCfAddBtn').addEventListener('click', function(){
  if(!_sdCurName) return;
  var labelInp = document.getElementById('sdCfLabel');
  var valInp = document.getElementById('sdCfValue');
  var label = labelInp.value.trim();
  var value = valInp.value.trim();
  if(!label){ toast('항목 이름을 먼저 적어주세요'); return; }
  mutateStockItem(_sdCurName, function(base){
    var list = (base.customFields||[]).slice();
    list.push({label:label, value:value});
    base.customFields = list;
    var log = (base.thesisLog||[]).slice();
    log.push({date: todayStr(), text: '항목 추가: '+label+(value?(' = '+value):''), auto:true});
    base.thesisLog = log;
  });
  labelInp.value=''; valInp.value='';
  setTimeout(function(){ openStockDetail(_sdCurName); }, 300);
});
document.getElementById('sdThesisAddBtn').addEventListener('click', function(){
  if(!_sdCurName) return;

});

/* ══════════════════════════════════════════════════════════
   v7.1: 다른 앱(뉴스레이더 등)에서 "?import=news&title=..." 형태로 넘어온 자료를
   + 기록 추가 모달에 미리 채워서 열어줌. 절대 자동 저장하지 않음 — 반드시 눈으로 확인하고
   직접 [저장]을 눌러야 실제로 들어감(잘못된 자료가 조용히 쌓이는 것 방지)
   ══════════════════════════════════════════════════════════ */
function handleImportParams(){
  var qs = new URLSearchParams(location.search);
  if(qs.get('import') !== 'news') return;
  var title = qs.get('title') || '';
  var channel = qs.get('channel') || '';
  var link = qs.get('link') || '';
  var oneLiner = qs.get('oneLiner') || '';
  var body = qs.get('body') || '';
  var date = qs.get('date') || '';
  var kw = (qs.get('kw') || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);

  openAdd();
  renderKindPick('news');
  applyKindFields('news');
  document.getElementById('fTitle').value = title;
  document.getElementById('fChannel').value = channel;
  document.getElementById('fLink').value = link;
  document.getElementById('fOneLiner').value = oneLiner || title;
  document.getElementById('fBody').value = body;
  if(date) document.getElementById('fDate').value = date;
  /* 키워드가 이미 등록된 종목명과 정확히 같을 때만 자동 태그(추측 태그로 잘못 붙는 것 방지) */
  var known = allStockNames();
  kw.forEach(function(k){ if(known.indexOf(k)>=0 && pickedStocks.indexOf(k)<0) pickedStocks.push(k); });
  renderStockTags();
  toast('뉴스레이더에서 가져왔어요 — 확인하고 저장해 주세요');
  history.replaceState(null, '', location.pathname); // 새로고침해도 다시 안 열리게 주소 정리
}
setTimeout(handleImportParams, 800); // records/stockMaster 첫 로딩(비동기) 이후에 종목 자동태그가 정확해지도록 약간 대기
</script>
