<title>투자 전용</title>
<style>
:root{--bg:#FBF7F1;--card:#FFFFFF;--card-border:#F0E4D8;--text:#3D3630;--quiet:#8C8078;--faint:#A79B8E;--bull-bg:#FCE3ED;--bull-tx:#C24672;--neutral-bg:#F5EBD0;--neutral-tx:#7A5C12;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh;padding-bottom:40px;}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px;}
@media (min-width:700px){.wrap{padding:0 32px;}}
.hdr{padding:calc(env(safe-area-inset-top) + 18px) 4px 6px;display:flex;align-items:center;justify-content:space-between;}
.hdr-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.back{font-size:13px;color:var(--quiet);text-decoration:none;font-weight:700;padding:8px 4px;}
.cta{display:block;background:linear-gradient(135deg,var(--bull-bg),#FFF3F8);border:1px solid #F3C8DA;border-radius:20px;padding:18px 20px;text-decoration:none;color:var(--text);margin:14px 0 22px;box-shadow:0 2px 8px rgba(194,70,114,.08);}
.cta-em{font-size:30px;line-height:1;}
.cta-nm{font-size:18px;font-weight:800;margin-top:8px;}
.cta-ds{font-size:12.5px;color:var(--quiet);margin-top:3px;line-height:1.4;}
.sec-lbl{font-size:14px;font-weight:800;color:#5A5148;padding:2px 6px 10px;letter-spacing:-0.2px;}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:26px;}
.icongrid a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:14px 4px;border-radius:14px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--card-border);text-align:center;}
.icongrid a:active{background:#FAF5EF;}
.icongrid .em{font-size:26px;line-height:1;}
.icongrid .nm{font-size:12px;font-weight:700;line-height:1.25;}
.icongrid a.coming{opacity:.5;pointer-events:none;}
</style>
</head>
