<!-- v 20260904-1530  predict.html — 오픈북 예측 입력·채점 결과·출처별 신뢰도. 읽기: raw/predictions.json · analysis/scores.json · facts/source_trust.json -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오픈북 예측·채점</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--line:#e3e6ee;--ink:#1f2430;--sub:#6b7280;--p1:#dbeafe;--p2:#dcfce7;--p3:#fef3c7;--p5:#fee2e2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1}header small{color:var(--sub);font-size:12px}
  .btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;cursor:pointer;text-decoration:none;color:inherit;display:inline-flex;align-items:center}
  .btn.pri{background:var(--p1);border-color:#93c5fd}
  main{padding:14px 16px 80px;max-width:1440px;margin:0 auto}
  h2{font-size:16px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .tag{font-size:12px;padding:1px 8px;border-radius:8px;border:1px solid var(--line);color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
  input,select,textarea{font:inherit;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{min-height:64px}
  .full{grid-column:1/-1}
  pre{background:#f7f7f9;border-radius:10px;padding:10px;font:12.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
  .wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{background:var(--p1);padding:8px 10px;text-align:left;white-space:nowrap}
  td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
  .hit{color:#15803d;font-weight:700}.miss{color:#b91c1c;font-weight:700}.na{color:var(--sub)}
  .empty{color:var(--sub);padding:12px 14px}
</style>
</head>
<body>
<header>
  <h1>오픈북 예측·채점 <small id="ver"></small></h1>
  <a class="btn" href="axes.html">축·전략</a><a class="btn" href="index.html">허브</a>
</header>
<main>
  <h2>예측 적기 <span class="tag">미리 적고, 기한에 채점(원칙 15)</span></h2>
  <div class="card">
    <form id="f">
      <label>출처 종류<select name="type"><option value="youtube">유튜브 채널</option><option value="self">달님</option><option value="strategy">전략 카드</option></select></label>
      <label>출처 이름<input name="name" placeholder="채널명 / 달님 / supply"></label>
      <label>영상·근거 URL<input name="video" placeholder="있으면"></label>
      <label>대상<input name="target" placeholder="삼성전자, 필라델피아 반도체" required></label>
      <label>티커<input name="ticker" placeholder="005930.KS / ^SOX / NVDA" required></label>
      <label>방향<select name="direction"><option>상승</option><option>하락</option><option>돌파</option><option>하회</option></select></label>
      <label>기준선<input name="baseline" placeholder="21일선, 70달러 (없으면 비움)"></label>
      <label>발표 시각(KST)<input name="made_at" type="datetime-local" step="300" required></label>
      <label>검증 기한<input name="due" type="date" required></label>
      <label class="full">이유<textarea name="reason" placeholder="왜 그렇게 보는가 — 근거 출처가 공식 자료면 적기"></textarea></label>
      <label class="full">반증 조건(무효화)<input name="invalidation" placeholder="이러면 틀린 것: 예) 21일선 종가 이탈" required></label>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="submit">JSON 만들기</button><button class="btn" type="button" id="copyBtn">복사</button><span style="color:var(--sub);font-size:13px;align-self:center">복사한 줄을 GitHub 웹에서 raw/predictions.json 의 items 안에 붙여넣기 → 다음 아침 채점</span></div>
    </form>
    <pre id="out" hidden></pre>
  </div>

  <h2>출처별 신뢰도 <span class="tag">적중률 = 적중/(적중+빗나감) · 2건 미만 보류</span></h2>
  <div class="wrap"><table id="trust"><thead><tr><th>출처</th><th>종류</th><th>적중</th><th>빗나감</th><th>판정불가</th><th>적중률</th><th>판단</th></tr></thead><tbody></tbody></table><div class="empty" id="trustEmpty" hidden>아직 채점된 예측이 없습니다</div></div>

  <h2>채점 결과 <span class="tag" id="scoreTag"></span></h2>
  <div class="wrap"><table id="scores"><thead><tr><th>기한</th><th>출처</th><th>대상·티커</th><th>방향</th><th>판정</th><th>근거</th></tr></thead><tbody></tbody></table><div class="empty" id="scoreEmpty" hidden>아직 채점된 예측이 없습니다</div></div>

  <h2>대기 중 예측 <span class="tag" id="pendTag"></span></h2>
  <div class="wrap"><table id="pend"><thead><tr><th>기한</th><th>출처</th><th>대상·티커</th><th>방향</th><th>반증 조건</th></tr></thead><tbody></tbody></table><div class="empty" id="pendEmpty" hidden>대기 중 예측이 없습니다</div></div>
</main>
<script src="js/status.js" data-app="predict" data-version="v 20260904-1530"></script>
<script>
(function(){
  document.getElementById('ver').textContent='v 20260904-1530';
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var get=function(p){return fetch(p+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.json()})};
  var f=document.getElementById('f'), out=document.getElementById('out');
  // 기본값: 발표 시각=지금(KST, 5분 단위), 기한=4주 뒤
  var now=window.Status.kstNow(); now.setUTCMinutes(Math.round(now.getUTCMinutes()/5)*5,0,0);
  f.made_at.value=now.toISOString().slice(0,16); var due=new Date(now.getTime()+28*86400000); f.due.value=due.toISOString().slice(0,10);
  function build(){
    var d=new FormData(f), o={};
    d.forEach(function(v,k){o[k]=String(v).trim()});
    var id='pred-'+o.made_at.slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6);
    var j={id:id,source:{type:o.type,name:o.name,video:o.video},target:o.target,ticker:o.ticker,direction:o.direction,baseline:o.baseline,
           made_at:o.made_at+':00+09:00',due:o.due,invalidation:o.invalidation,reason:o.reason,status:'pending'};
    out.hidden=false; out.textContent=JSON.stringify(j,null,2)+',';
    return out.textContent;
  }
  f.onsubmit=function(e){e.preventDefault();build();};
  document.getElementById('copyBtn').onclick=function(){ if(!f.reportValidity())return; var t=build(), b=this; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='복사됨 ✓';setTimeout(function(){b.textContent='복사'},1500)},function(){out.focus()}); };

  get('facts/source_trust.json').then(function(d){
    var tb=document.querySelector('#trust tbody'), rows=d.sources||[];
    document.getElementById('trustEmpty').hidden=rows.length>0;
    rows.forEach(function(r){ tb.innerHTML+='<tr><td>'+esc(r.name)+'</td><td>'+esc(r.type)+'</td><td class="hit">'+r.hit+'</td><td class="miss">'+r.miss+'</td><td class="na">'+r.na+'</td><td>'+(r.hit_rate==null?'—':r.hit_rate+'%')+'</td><td>'+esc(r.comment)+'</td></tr>'; });
  }).catch(function(){ document.getElementById('trustEmpty').hidden=false; });

  var scored={};
  get('analysis/scores.json').then(function(d){
    var tb=document.querySelector('#scores tbody'), rows=d.items||[];
    document.getElementById('scoreTag').textContent=(d.updated?'갱신 '+window.Status.kstStr(d.updated):'')+' · '+rows.length+'건';
    document.getElementById('scoreEmpty').hidden=rows.length>0;
    rows.forEach(function(s){ scored[s.id]=1; var cls=s.status==='적중'?'hit':s.status==='빗나감'?'miss':'na';
      tb.innerHTML+='<tr><td>'+esc(s.due)+'</td><td>'+esc((s.source||{}).name)+'</td><td>'+esc(s.ticker)+'</td><td>'+esc(s.direction)+'</td><td class="'+cls+'">'+esc(s.status)+'</td><td>'+esc(s.basis)+'</td></tr>'; });
  }).catch(function(){ document.getElementById('scoreEmpty').hidden=false; }).then(function(){
    return get('raw/predictions.json');
  }).then(function(d){
    var tb=document.querySelector('#pend tbody'), rows=(d.items||[]).filter(function(p){return (p.status||'pending')==='pending'&&!scored[p.id]});
    document.getElementById('pendTag').textContent=rows.length+'건';
    document.getElementById('pendEmpty').hidden=rows.length>0;
    rows.sort(function(a,b){return (a.due||'')<(b.due||'')?-1:1}).forEach(function(p){
      tb.innerHTML+='<tr><td>'+esc(p.due)+'</td><td>'+esc((p.source||{}).name)+'</td><td>'+esc(p.target)+' <small>'+esc(p.ticker)+'</small></td><td>'+esc(p.direction)+'</td><td>'+esc(p.invalidation)+'</td></tr>'; });
  }).catch(function(e){ console.error(e.message); });
})();
</script>
</body>
</html>
